name: Blender 5.2.2 Android - OSL Host Bootstrap

on:
  workflow_dispatch:

jobs:
  osl-host:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux
          uname -a
          nproc
          free -h
          df -h /

      - name: Install host build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            pkg-config \
            bison \
            flex \
            clang \
            llvm-dev \
            libboost-dev \
            libopenexr-dev \
            libimath-dev \
            libpugixml-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            openimageio-tools

      - name: Verify base dependencies
        run: |
          set -eux

          echo "GCC:"
          gcc --version

          echo "CMake:"
          cmake --version

          echo "Ninja:"
          ninja --version

          echo "LLVM:"
          llvm-config --version

          echo "iconvert:"
          command -v iconvert
          iconvert --help >/dev/null

          echo "System OIIO version:"
          pkg-config --modversion OpenImageIO || true

      - name: Download OpenImageIO 2.5.19.1
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          OIIO_VERSION="2.5.19.1"

          curl -L --fail --retry 5 --retry-all-errors \
            "https://github.com/AcademySoftwareFoundation/OpenImageIO/archive/refs/tags/v${OIIO_VERSION}.tar.gz" \
            -o "oiio-${OIIO_VERSION}.tar.gz"

          test -f "oiio-${OIIO_VERSION}.tar.gz"

          rm -rf oiio-source
          mkdir -p oiio-source

          tar -xf "oiio-${OIIO_VERSION}.tar.gz" \
            -C oiio-source \
            --strip-components=1

          test -f oiio-source/CMakeLists.txt

      - name: Configure OpenImageIO
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/oiio-source"
          BUILD="$GITHUB_WORKSPACE/oiio-build"
          INSTALL="$GITHUB_WORKSPACE/oiio-install"

          rm -rf "$BUILD" "$INSTALL"
          mkdir -p "$BUILD" "$INSTALL"

          echo "=========================================="
          echo " Configuring OpenImageIO 2.5.19.1"
          echo "=========================================="

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_CXX_STANDARD=17 \
            -DOpenImageIO_BUILD_MISSING_DEPS=all \
            -DOIIO_BUILD_TESTS=0 \
            -DOIIO_BUILD_TOOLS=0 \
            -DBUILD_DOCS=0 \
            -DINSTALL_DOCS=0 \
            -DINSTALL_FONTS=0 \
            -DUSE_PYTHON=0 \
            -DUSE_QT=0 \
            -DUSE_OPENGL=0 \
            -DUSE_OPENCV=0 \
            -DUSE_FFMPEG=0 \
            -DUSE_LIBRAW=0 \
            -DUSE_OPENJPEG=0 \
            -DUSE_WEBP=0 \
            -DUSE_OPENVDB=0 \
            -DUSE_PTX=0 \
            -DUSE_NUKE=0 \
            -DSTOP_ON_WARNING=0

      - name: Build OpenImageIO
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/oiio-build"

          echo "=========================================="
          echo " Building OpenImageIO 2.5.19.1"
          echo "=========================================="

          cmake --build "$BUILD" \
            --parallel "$(nproc)"

      - name: Install OpenImageIO
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/oiio-build"

          cmake --build "$BUILD" \
            --target install \
            --parallel "$(nproc)"

      - name: Verify OpenImageIO 2.5 build
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/oiio-install"

          echo "OIIO install directory:"
          find "$INSTALL" -maxdepth 4 -type f | sort | head -150

          test -d "$INSTALL/include"
          test -d "$INSTALL/lib"

          echo "Installed OIIO libraries:"
          find "$INSTALL" \
            \( \
              -name '*OpenImageIO*.so*' \
              -o -name '*OpenImageIO*.a' \
            \) \
            -print

          echo "Installed OIIO CMake package:"
          find "$INSTALL" \
            -name 'OpenImageIOConfig.cmake' \
            -print

      - name: Download OSL 1.15.3.0
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          OSL_VERSION="1.15.3.0"

          curl -L --fail --retry 5 --retry-all-errors \
            "https://github.com/AcademySoftwareFoundation/OpenShadingLanguage/archive/refs/tags/v${OSL_VERSION}.tar.gz" \
            -o "osl-${OSL_VERSION}.tar.gz"

          test -f "osl-${OSL_VERSION}.tar.gz"

          rm -rf osl-source
          mkdir -p osl-source

          tar -xf "osl-${OSL_VERSION}.tar.gz" \
            -C osl-source \
            --strip-components=1

          test -f osl-source/CMakeLists.txt

      - name: Configure OSL
        env:
          OpenImageIO_ROOT: /home/runner/work/Blender-port-mobile-unofficial-/Blender-port-mobile-unofficial-/oiio-install
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/osl-source"
          BUILD="$GITHUB_WORKSPACE/osl-build"
          OIIO="$GITHUB_WORKSPACE/oiio-install"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          export OpenImageIO_ROOT="$OIIO"

          # Avoid "unbound variable" when CMAKE_PREFIX_PATH
          # does not already exist in the GitHub Actions environment.
          export CMAKE_PREFIX_PATH="$OIIO:${CMAKE_PREFIX_PATH:-}"

          echo "=========================================="
          echo " Configuring OSL 1.15.3.0"
          echo "=========================================="

          echo "OpenImageIO_ROOT=$OpenImageIO_ROOT"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOSL_BUILD_TESTS=OFF \
            -DOSL_BUILD_PLUGINS=OFF \
            -DOSL_BUILD_SHADERS=ON \
            -DOSL_BUILD_DOCS=OFF \
            -DOSL_USE_OPTIX=OFF \
            -DSTOP_ON_WARNING=0 \
            -DOpenImageIO_ROOT="$OIIO"

      - name: Build OSL
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          echo "=========================================="
          echo " Building OSL 1.15.3.0"
          echo "=========================================="

          cmake --build "$BUILD" \
            --parallel "$(nproc)"

      - name: Verify oslc
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              | head -1
          )"

          if [ -z "$OSLC" ]; then
            echo "ERROR: oslc was not built."
            exit 1
          fi

          echo "OSLC: $OSLC"

          "$OSLC" --help | head -80

      - name: Compile test OSL shader
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              | head -1
          )"

          mkdir -p "$GITHUB_WORKSPACE/osl-test"

          cat > "$GITHUB_WORKSPACE/osl-test/test.osl" <<'EOF'
          shader test_surface(
              color BaseColor = color(0.8, 0.2, 0.1),
              output closure color BSDF = 0
          )
          {
              BSDF = diffuse(N);
          }
          EOF

          cd "$GITHUB_WORKSPACE/osl-test"

          "$OSLC" -o test.oso test.osl

          test -f test.oso

          ls -lh test.oso

      - name: Upload OIIO and OSL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oiio-2.5.19.1-and-osl-1.15.3.0-host
          path: |
            oiio-build
            oiio-install
            osl-build
            osl-test/test.oso
          if-no-files-found: warn

      - name: OSL bootstrap complete
        if: success()
        run: |
          echo "=========================================="
          echo " OSL HOST BOOTSTRAP SUCCESS"
          echo "=========================================="
          echo "OpenImageIO 2.5.19.1: BUILT"
          echo "OSL 1.15.3.0: BUILT"
          echo "oslc: BUILT"
          echo "test.oso: COMPILED"
          echo "Next stage: integrate OSL into Blender Android build"
