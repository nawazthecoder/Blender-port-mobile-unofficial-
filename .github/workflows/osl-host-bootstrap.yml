name: Blender 5.2.2 Android - OSL Host Bootstrap

on:
  workflow_dispatch:

jobs:
  osl-host:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "=========================================="
          echo " GitHub Actions Environment"
          echo "=========================================="

          uname -a
          nproc
          free -h
          df -h /

      - name: Install host build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            pkg-config \
            bison \
            flex \
            clang \
            clang-18 \
            llvm-dev \
            llvm-18-dev \
            libclang-18-dev \
            libboost-dev \
            libboost-thread-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-atomic-dev \
            libboost-chrono-dev \
            libboost-date-time-dev \
            libopenexr-dev \
            libimath-dev \
            libpugixml-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            openimageio-tools \
            python3-dev

      - name: Verify host toolchain
        run: |
          set -eux

          echo "=========================================="
          echo " Host Toolchain Check"
          echo "=========================================="

          gcc --version
          g++ --version
          clang --version
          llvm-config --version
          cmake --version
          ninja --version
          python3 --version

          echo "Clang TargetInfo:"
          test -f /usr/lib/llvm-18/include/clang/Basic/TargetInfo.h
          ls -lh /usr/lib/llvm-18/include/clang/Basic/TargetInfo.h

          echo "Boost.Thread:"
          ldconfig -p | grep boost_thread || true
          test -f /usr/lib/x86_64-linux-gnu/libboost_thread.so

          echo "iconvert:"
          command -v iconvert
          iconvert --help >/dev/null

      # ============================================================
      # OpenImageIO 2.5.19.1
      # ============================================================

      - name: Download OpenImageIO 2.5.19.1
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          OIIO_VERSION="2.5.19.1"

          curl -L --fail --retry 5 --retry-all-errors \
            "https://github.com/AcademySoftwareFoundation/OpenImageIO/archive/refs/tags/v${OIIO_VERSION}.tar.gz" \
            -o "oiio-${OIIO_VERSION}.tar.gz"

          test -f "oiio-${OIIO_VERSION}.tar.gz"

          rm -rf oiio-source
          mkdir -p oiio-source

          tar -xf "oiio-${OIIO_VERSION}.tar.gz" \
            -C oiio-source \
            --strip-components=1

          test -f oiio-source/CMakeLists.txt

      - name: Configure OpenImageIO
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/oiio-source"
          BUILD="$GITHUB_WORKSPACE/oiio-build"
          INSTALL="$GITHUB_WORKSPACE/oiio-install"

          rm -rf "$BUILD"
          rm -rf "$INSTALL"

          mkdir -p "$BUILD"
          mkdir -p "$INSTALL"

          echo "=========================================="
          echo " Configuring OpenImageIO 2.5.19.1"
          echo "=========================================="

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_CXX_STANDARD=17 \
            -DOpenImageIO_BUILD_MISSING_DEPS=all \
            -DOIIO_BUILD_TESTS=0 \
            -DOIIO_BUILD_TOOLS=0 \
            -DBUILD_DOCS=0 \
            -DINSTALL_DOCS=0 \
            -DINSTALL_FONTS=0 \
            -DUSE_PYTHON=0 \
            -DUSE_QT=0 \
            -DUSE_OPENGL=0 \
            -DUSE_OPENCV=0 \
            -DUSE_FFMPEG=0 \
            -DUSE_LIBRAW=0 \
            -DUSE_OPENJPEG=0 \
            -DUSE_WEBP=0 \
            -DUSE_OPENVDB=0 \
            -DUSE_PTX=0 \
            -DUSE_NUKE=0 \
            -DSTOP_ON_WARNING=0

      - name: Build OpenImageIO
        shell: bash
        run: |
          set -u
          set -o pipefail

          BUILD="$GITHUB_WORKSPACE/oiio-build"
          LOG="$GITHUB_WORKSPACE/oiio-build.log"

          echo "=========================================="
          echo " Building OpenImageIO 2.5.19.1"
          echo "=========================================="

          set +e

          cmake --build "$BUILD" \
            --parallel "$(nproc)" \
            > "$LOG" 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo " OpenImageIO BUILD FAILED"
            echo "=========================================="

            echo
            echo "========== IMPORTANT ERROR LINES =========="

            grep -E \
              "fatal error:|undefined reference|collect2: error|error: |FAILED:|ninja: build stopped" \
              "$LOG" \
              | tail -100 || true

            echo
            echo "========== LAST 120 LINES =========="

            tail -120 "$LOG"

            exit "$STATUS"
          fi

          echo "OpenImageIO build completed successfully."

      - name: Install OpenImageIO
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/oiio-build"

          cmake --build "$BUILD" \
            --target install \
            --parallel "$(nproc)"

      - name: Verify OpenImageIO
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/oiio-install"

          test -d "$INSTALL/include"
          test -d "$INSTALL/lib"

          OIIO_CONFIG="$(
            find "$INSTALL" \
              -name "OpenImageIOConfig.cmake" \
              -print \
              -quit
          )"

          test -n "$OIIO_CONFIG"

          echo "OIIO CMake package:"
          echo "$OIIO_CONFIG"

          echo "OIIO libraries:"
          find "$INSTALL" \
            \( \
              -name "*OpenImageIO*.so*" \
              -o -name "*OpenImageIO*.a" \
            \) \
            -print

      # ============================================================
      # pybind11 3.0.0
      # ============================================================

      - name: Download pybind11 3.0.0
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          PYBIND11_VERSION="3.0.0"

          curl -L --fail --retry 5 --retry-all-errors \
            "https://github.com/pybind/pybind11/archive/refs/tags/v${PYBIND11_VERSION}.tar.gz" \
            -o "pybind11-${PYBIND11_VERSION}.tar.gz"

          test -f "pybind11-${PYBIND11_VERSION}.tar.gz"

          rm -rf pybind11-source
          mkdir -p pybind11-source

          tar -xf "pybind11-${PYBIND11_VERSION}.tar.gz" \
            -C pybind11-source \
            --strip-components=1

          test -f pybind11-source/CMakeLists.txt

      - name: Configure pybind11
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/pybind11-source"
          BUILD="$GITHUB_WORKSPACE/pybind11-build"
          INSTALL="$GITHUB_WORKSPACE/pybind11-install"

          rm -rf "$BUILD"
          rm -rf "$INSTALL"

          mkdir -p "$BUILD"
          mkdir -p "$INSTALL"

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DPYBIND11_TEST=OFF \
            -DPYBIND11_NOPYTHON=OFF

      - name: Install pybind11
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/pybind11-build"

          cmake --build "$BUILD" \
            --target install \
            --parallel "$(nproc)"

      - name: Verify pybind11
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/pybind11-install"

          test -d "$INSTALL/include"

          PYBIND_CONFIG="$(
            find "$INSTALL" \
              -name "pybind11Config.cmake" \
              -print \
              -quit
          )"

          test -n "$PYBIND_CONFIG"

          echo "pybind11 CMake package:"
          echo "$PYBIND_CONFIG"

      # ============================================================
      # OSL 1.15.3.0
      # ============================================================

      - name: Download OSL 1.15.3.0
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          OSL_VERSION="1.15.3.0"

          curl -L --fail --retry 5 --retry-all-errors \
            "https://github.com/AcademySoftwareFoundation/OpenShadingLanguage/archive/refs/tags/v${OSL_VERSION}.tar.gz" \
            -o "osl-${OSL_VERSION}.tar.gz"

          test -f "osl-${OSL_VERSION}.tar.gz"

          rm -rf osl-source
          mkdir -p osl-source

          tar -xf "osl-${OSL_VERSION}.tar.gz" \
            -C osl-source \
            --strip-components=1

          test -f osl-source/CMakeLists.txt

      - name: Configure OSL
        env:
          OpenImageIO_ROOT: /home/runner/work/Blender-port-mobile-unofficial-/Blender-port-mobile-unofficial-/oiio-install
          pybind11_ROOT: /home/runner/work/Blender-port-mobile-unofficial-/Blender-port-mobile-unofficial-/pybind11-install

        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/osl-source"
          BUILD="$GITHUB_WORKSPACE/osl-build"
          OIIO="$GITHUB_WORKSPACE/oiio-install"
          PYBIND11="$GITHUB_WORKSPACE/pybind11-install"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          export OpenImageIO_ROOT="$OIIO"
          export pybind11_ROOT="$PYBIND11"

          export CMAKE_PREFIX_PATH="$PYBIND11:$OIIO:${CMAKE_PREFIX_PATH:-}"

          echo "=========================================="
          echo " Configuring OSL 1.15.3.0"
          echo "=========================================="

          echo "OpenImageIO_ROOT=$OpenImageIO_ROOT"
          echo "pybind11_ROOT=$pybind11_ROOT"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOSL_BUILD_TESTS=OFF \
            -DOSL_BUILD_PLUGINS=OFF \
            -DOSL_BUILD_SHADERS=ON \
            -DOSL_BUILD_DOCS=OFF \
            -DOSL_USE_OPTIX=OFF \
            -DSTOP_ON_WARNING=0 \
            -DOpenImageIO_ROOT="$OIIO" \
            -Dpybind11_ROOT="$PYBIND11" \
            -DCMAKE_EXE_LINKER_FLAGS="-lboost_thread"

      # ============================================================
      # Build OSL
      # ============================================================

      - name: Build OSL
        shell: bash
        run: |
          set -u
          set -o pipefail

          BUILD="$GITHUB_WORKSPACE/osl-build"
          LOG="$GITHUB_WORKSPACE/osl-build.log"

          echo "=========================================="
          echo " Building OSL 1.15.3.0"
          echo "=========================================="

          set +e

          cmake --build "$BUILD" \
            --parallel "$(nproc)" \
            > "$LOG" 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo " OSL BUILD FAILED"
            echo "=========================================="

            echo
            echo "========== IMPORTANT ERROR LINES =========="

            grep -E \
              "fatal error:|undefined reference|collect2: error|error: |FAILED:|ninja: build stopped" \
              "$LOG" \
              | tail -100 || true

            echo
            echo "========== LAST 120 LINES =========="

            tail -120 "$LOG"

            exit "$STATUS"
          fi

          echo
          echo "=========================================="
          echo " OSL BUILD COMPLETED"
          echo "=========================================="

      # ============================================================
      # Verify OSL build products
      # ============================================================

      - name: Verify oslc and stdosl.h
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"
          SOURCE="$GITHUB_WORKSPACE/osl-source"

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              -quit
          )"

          test -n "$OSLC"

          STDOSL="$SOURCE/src/shaders/stdosl.h"

          test -f "$STDOSL"

          echo "=========================================="
          echo " OSL BUILD PRODUCTS VERIFIED"
          echo "=========================================="

          echo "OSLC:"
          echo "$OSLC"

          echo
          echo "stdosl.h:"
          echo "$STDOSL"

      # ============================================================
      # Install OSL
      #
      # This gives us a real OSL shader installation in addition
      # to the source tree. OSL installs stdosl.h and shader files
      # under the OSL shader installation directory.
      # ============================================================

      - name: Install OSL
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"
          INSTALL="$GITHUB_WORKSPACE/osl-install"

          rm -rf "$INSTALL"
          mkdir -p "$INSTALL"

          cmake \
            --install "$BUILD" \
            --prefix "$INSTALL"

          echo "=========================================="
          echo " OSL INSTALL COMPLETE"
          echo "=========================================="

          find "$INSTALL" \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # Find the installed stdosl.h
      # ============================================================

      - name: Locate installed stdosl.h
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/osl-install"

          STDOSL="$(
            find "$INSTALL" \
              -type f \
              -name stdosl.h \
              -print \
              -quit
          )"

          if [ -z "$STDOSL" ]; then
            echo "ERROR: Installed stdosl.h was not found."

            echo
            echo "Searching source tree:"
            find "$GITHUB_WORKSPACE/osl-source" \
              -type f \
              -name stdosl.h \
              -print

            exit 1
          fi

          echo "Installed stdosl.h:"
          echo "$STDOSL"

      # ============================================================
      # Compile test OSL shader
      # ============================================================

      - name: Compile test OSL shader
        shell: bash
        run: |
          set -u
          set -o pipefail

          BUILD="$GITHUB_WORKSPACE/osl-build"
          SOURCE="$GITHUB_WORKSPACE/osl-source"
          TESTDIR="$GITHUB_WORKSPACE/osl-test"
          LOG="$GITHUB_WORKSPACE/osl-test.log"

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              -quit
          )"

          test -n "$OSLC"

          # OSL's standard library header is here in the source tree.
          SHADER_INCLUDE="$SOURCE/src/shaders"

          test -f "$SHADER_INCLUDE/stdosl.h"

          rm -rf "$TESTDIR"
          mkdir -p "$TESTDIR"

          cat > "$TESTDIR/test.osl" <<'EOF'
          #include "stdosl.h"

          shader test_surface(
              color BaseColor = color(0.8, 0.2, 0.1),
              output closure color BSDF = 0
          )
          {
              BSDF = diffuse(N);
          }
          EOF

          cd "$TESTDIR"

          echo "=========================================="
          echo " Compiling test OSL shader"
          echo "=========================================="

          set +e

          "$OSLC" \
            -I "$SHADER_INCLUDE" \
            -o test.oso \
            test.osl \
            > "$LOG" 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo " TEST OSL COMPILATION FAILED"
            echo "=========================================="

            echo
            echo "========== TEST ERROR =========="

            cat "$LOG"

            echo
            echo "OSLC:"
            echo "$OSLC"

            echo
            echo "Shader include directory:"
            echo "$SHADER_INCLUDE"

            echo
            echo "stdosl.h:"
            ls -lh "$SHADER_INCLUDE/stdosl.h"

            exit "$STATUS"
          fi

          test -f test.oso

          echo
          echo "=========================================="
          echo " TEST OSL COMPILATION SUCCESS"
          echo "=========================================="

          ls -lh test.oso

      # ============================================================
      # Upload diagnostics
      # ============================================================

      - name: Upload OIIO, pybind11 and OSL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oiio-2.5.19.1-pybind11-3.0.0-osl-1.15.3.0-host
          path: |
            oiio-build.log
            oiio-build
            oiio-install
            pybind11-build
            pybind11-install
            osl-build.log
            osl-build
            osl-install
            osl-test.log
            osl-test/test.oso
          if-no-files-found: warn

      - name: OSL bootstrap complete
        if: success()
        run: |
          echo "=========================================="
          echo " OSL HOST BOOTSTRAP SUCCESS"
          echo "=========================================="
          echo
          echo "OpenImageIO 2.5.19.1: BUILT"
          echo "pybind11 3.0.0: BUILT"
          echo "LLVM 18: AVAILABLE"
          echo "Clang 18 headers: AVAILABLE"
          echo "Boost.Thread: AVAILABLE"
          echo "OSL 1.15.3.0: BUILT"
          echo "oslc: BUILT"
          echo "stdosl.h: FOUND"
          echo "test.oso: COMPILED"
          echo
          echo "Next stage: integrate OSL into Blender Android build"
