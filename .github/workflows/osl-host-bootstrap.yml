name: Blender 5.2.2 Android - OSL Host Bootstrap

on:
  workflow_dispatch:

jobs:
  osl-host:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "=== SYSTEM ==="
          uname -a

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h /

      - name: Install host build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            pkg-config \
            bison \
            flex \
            clang \
            llvm-dev \
            libboost-dev \
            libopenexr-dev \
            libimath-dev \
            libpugixml-dev \
            libopenimageio-dev \
            openimageio-tools

      - name: Verify OpenImageIO
        run: |
          set -eux

          echo "=== iconvert ==="
          command -v iconvert
          iconvert --help >/dev/null

          echo
          echo "=== OpenImageIO development files ==="

          pkg-config --modversion OpenImageIO || true

          echo
          echo "=== OpenImageIO CMake package ==="

          find /usr/lib \
            -path '*cmake/OpenImageIO*' \
            -maxdepth 5 \
            -type f \
            -print \
            2>/dev/null | head -30

          echo
          echo "=== iconvert location ==="
          ls -lh "$(command -v iconvert)"

      - name: Verify LLVM
        run: |
          set -eux

          echo "=== clang ==="
          clang --version

          echo
          echo "=== llvm-config ==="
          llvm-config --version

      - name: Download OSL 1.15.3.0
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          OSL_VERSION="1.15.3.0"

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/AcademySoftwareFoundation/OpenShadingLanguage/archive/refs/tags/v${OSL_VERSION}.tar.gz" \
            -o "osl-${OSL_VERSION}.tar.gz"

          test -f "osl-${OSL_VERSION}.tar.gz"

          rm -rf osl-source

          mkdir -p osl-source

          tar -xf \
            "osl-${OSL_VERSION}.tar.gz" \
            -C osl-source \
            --strip-components=1

          test -f osl-source/CMakeLists.txt

          echo "OSL source: OK"

      - name: Configure OSL
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/osl-source"
          BUILD="$GITHUB_WORKSPACE/osl-build"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          echo "=========================================="
          echo " Configuring OSL 1.15.3.0"
          echo "=========================================="

          cmake \
            -S "$SOURCE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOSL_BUILD_TESTS=OFF \
            -DOSL_BUILD_PLUGINS=OFF \
            -DOSL_BUILD_SHADERS=ON \
            -DOSL_BUILD_DOCS=OFF \
            -DOSL_USE_OPTIX=OFF \
            -DSTOP_ON_WARNING=0

      - name: Build OSL
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          cmake \
            --build "$BUILD" \
            --parallel "$(nproc)"

      - name: Verify oslc
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          echo "=== Searching for oslc ==="

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              | head -1
          )"

          if [ -z "$OSLC" ]; then
            echo "ERROR: oslc was not built."
            exit 1
          fi

          echo
          echo "OSLC:"
          echo "$OSLC"

          echo
          echo "=== OSLC TEST ==="

          "$OSLC" --help | head -80

      - name: Compile test OSL shader
        run: |
          set -eux

          BUILD="$GITHUB_WORKSPACE/osl-build"

          OSLC="$(
            find "$BUILD" \
              -type f \
              -name oslc \
              -perm -111 \
              -print \
              | head -1
          )"

          mkdir -p "$GITHUB_WORKSPACE/osl-test"

          cat > "$GITHUB_WORKSPACE/osl-test/test.osl" <<'EOF'
          shader test_surface(
              color BaseColor = color(0.8, 0.2, 0.1),
              output closure color BSDF = 0
          )
          {
              BSDF = diffuse(N);
          }
          EOF

          cd "$GITHUB_WORKSPACE/osl-test"

          "$OSLC" \
            -o test.oso \
            test.osl

          test -f test.oso

          echo
          echo "OSL shader compiled successfully:"
          ls -lh test.oso

      - name: Upload OSL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osl-1.15.3.0-host
          path: |
            osl-build
            osl-test/test.oso
          if-no-files-found: warn

      - name: OSL bootstrap complete
        if: success()
        run: |
          echo
          echo "=========================================="
          echo " OSL 1.15.3.0 HOST BUILD COMPLETE"
          echo "=========================================="
          echo
          echo "iconvert:        FOUND"
          echo "OpenImageIO:     FOUND"
          echo "LLVM:             FOUND"
          echo "oslc:            FOUND"
          echo "OSL shader test: PASSED"
          echo
          echo "Next stage:"
          echo "Android-target OSL integration"
          echo "=========================================="
