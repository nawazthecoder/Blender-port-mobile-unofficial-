
name: Android OSL Target Configure Probe

on:
  workflow_dispatch:
    inputs:
      llvm_run_id:
        description: "Successful LLVM ARM64 run ID"
        required: true
        default: "37872328646"
        type: string
      oiio_run_id:
        description: "Successful OIIO ARM64 run ID"
        required: true
        default: "37616185108"
        type: string

permissions:
  actions: read
  contents: read

env:
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"
  OSL_VERSION: "v1.15.3.0"
  PUGIXML_VERSION: "v1.10"

jobs:
  configure:
    name: Configure OSL for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build git binutils \
            python3 pkg-config

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Download existing Android LLVM artifact
        uses: actions/download-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          repository: ${{ github.repository }}
          run-id: ${{ inputs.llvm_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/llvm

      - name: Download existing Android OIIO artifact
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-oiio
          repository: ${{ github.repository }}
          run-id: ${{ inputs.oiio_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/oiio

      - name: Extract and verify target dependency packages
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/android-osl-probe"
          mkdir -p "$ROOT/deps/llvm" "$ROOT/deps/oiio" "$ROOT/logs"

          LLVM_ARCHIVE="$(
            find artifacts/llvm -type f \
              -name 'llvm-20.1.8-android-arm64.tar.gz' \
              -print -quit
          )"

          OIIO_ARCHIVE="$(
            find artifacts/oiio -type f \
              -name 'android-arm64-oiio-prefix.tar.gz' \
              -print -quit
          )"

          test -n "$LLVM_ARCHIVE"
          test -n "$OIIO_ARCHIVE"
          test -f "$LLVM_ARCHIVE"
          test -f "$OIIO_ARCHIVE"

          tar -xzf "$LLVM_ARCHIVE" -C "$ROOT/deps/llvm"
          tar -xzf "$OIIO_ARCHIVE" -C "$ROOT/deps/oiio"

          LLVM_CONFIG="$(
            find "$ROOT/deps/llvm" \
              -name LLVMConfig.cmake -print -quit
          )"
          CLANG_CONFIG="$(
            find "$ROOT/deps/llvm" \
              -name ClangConfig.cmake -print -quit
          )"
          OIIO_CONFIG="$(
            find "$ROOT/deps/oiio" \
              -name OpenImageIOConfig.cmake -print -quit
          )"
          IMATH_CONFIG="$(
            find "$ROOT/deps/oiio" \
              -name ImathConfig.cmake -print -quit
          )"
          OPENEXR_CONFIG="$(
            find "$ROOT/deps/oiio" \
              -name OpenEXRConfig.cmake -print -quit
          )"
          OCIO_CONFIG="$(
            find "$ROOT/deps/oiio" \
              -name OpenColorIOConfig.cmake -print -quit
          )"

          for item in \
            LLVM_CONFIG CLANG_CONFIG OIIO_CONFIG \
            IMATH_CONFIG OPENEXR_CONFIG OCIO_CONFIG; do
            value="${!item}"
            if [[ -z "$value" || ! -f "$value" ]]; then
              echo "::error::Missing CMake package: $item"
              find "$ROOT/deps" -iname '*Config.cmake' -print | sort
              exit 1
            fi
          done

          LLVM_PREFIX="$(cd "$(dirname "$LLVM_CONFIG")/../../.." && pwd)"
          OIIO_PREFIX="$(cd "$(dirname "$OIIO_CONFIG")/../../.." && pwd)"

          # Use files from the Android dependency prefix explicitly.
          find_file() {
            local base="$1"
            local pattern="$2"
            find "$base" -type f -name "$pattern" -print -quit
          }

          TIFF_LIBRARY="$(find_file "$OIIO_PREFIX/lib" 'libtiff.a')"
          JPEG_LIBRARY="$(find_file "$OIIO_PREFIX/lib" 'libjpeg.a')"
          PNG_LIBRARY="$(find_file "$OIIO_PREFIX/lib" 'libpng16.a')"
          ZLIB_LIBRARY="$(find_file "$OIIO_PREFIX/lib" 'libz.a')"

          TIFF_HEADER="$(find_file "$OIIO_PREFIX/include" 'tiffio.h')"
          JPEG_HEADER="$(find_file "$OIIO_PREFIX/include" 'jpeglib.h')"
          PNG_HEADER="$(find_file "$OIIO_PREFIX/include" 'png.h')"
          ZLIB_HEADER="$(find_file "$OIIO_PREFIX/include" 'zlib.h')"

          for item in \
            TIFF_LIBRARY JPEG_LIBRARY PNG_LIBRARY ZLIB_LIBRARY \
            TIFF_HEADER JPEG_HEADER PNG_HEADER ZLIB_HEADER; do
            value="${!item}"
            if [[ -z "$value" || ! -f "$value" ]]; then
              echo "::error::Missing target dependency file: $item"
              echo "OIIO prefix: $OIIO_PREFIX"
              find "$OIIO_PREFIX" -maxdepth 4 -type f \
                \( -name '*.a' -o -name 'tiffio.h' \
                   -o -name 'jpeglib.h' -o -name 'png.h' \
                   -o -name 'zlib.h' \) -print | sort
              exit 1
            fi
          done

          TIFF_INCLUDE_DIR="$(dirname "$TIFF_HEADER")"
          JPEG_INCLUDE_DIR="$(dirname "$JPEG_HEADER")"
          PNG_INCLUDE_DIR="$(dirname "$PNG_HEADER")"
          ZLIB_INCLUDE_DIR="$(dirname "$ZLIB_HEADER")"

          LLVM_CONFIG_DIR="$(dirname "$LLVM_CONFIG")"
          CLANG_CONFIG_DIR="$(dirname "$CLANG_CONFIG")"
          OIIO_CONFIG_DIR="$(dirname "$OIIO_CONFIG")"
          IMATH_CONFIG_DIR="$(dirname "$IMATH_CONFIG")"
          OPENEXR_CONFIG_DIR="$(dirname "$OPENEXR_CONFIG")"
          OCIO_CONFIG_DIR="$(dirname "$OCIO_CONFIG")"

          IMATH_VERSION_FILE="$(
            find "$OIIO_PREFIX" \
              -name ImathConfigVersion.cmake -print -quit
          )"

          {
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "OIIO_PREFIX=$OIIO_PREFIX"
            echo "LLVM_CONFIG_DIR=$LLVM_CONFIG_DIR"
            echo "CLANG_CONFIG_DIR=$CLANG_CONFIG_DIR"
            echo "OIIO_CONFIG_DIR=$OIIO_CONFIG_DIR"
            echo "IMATH_CONFIG_DIR=$IMATH_CONFIG_DIR"
            echo "OPENEXR_CONFIG_DIR=$OPENEXR_CONFIG_DIR"
            echo "OCIO_CONFIG_DIR=$OCIO_CONFIG_DIR"
            echo "TIFF_LIBRARY=$TIFF_LIBRARY"
            echo "TIFF_INCLUDE_DIR=$TIFF_INCLUDE_DIR"
            echo "JPEG_LIBRARY=$JPEG_LIBRARY"
            echo "JPEG_INCLUDE_DIR=$JPEG_INCLUDE_DIR"
            echo "PNG_LIBRARY=$PNG_LIBRARY"
            echo "PNG_INCLUDE_DIR=$PNG_INCLUDE_DIR"
            echo "ZLIB_LIBRARY=$ZLIB_LIBRARY"
            echo "ZLIB_INCLUDE_DIR=$ZLIB_INCLUDE_DIR"
            echo "OSL_PROBE_ROOT=$ROOT"
          } >> "$GITHUB_ENV"

          {
            echo "LLVM prefix: $LLVM_PREFIX"
            echo "OIIO prefix: $OIIO_PREFIX"
            echo "LLVM package: $LLVM_CONFIG"
            echo "Clang package: $CLANG_CONFIG"
            echo "OIIO package: $OIIO_CONFIG"
            echo "Imath package: $IMATH_CONFIG"
            echo "OpenEXR package: $OPENEXR_CONFIG"
            echo "OpenColorIO package: $OCIO_CONFIG"
            echo "TIFF library: $TIFF_LIBRARY"
            echo "TIFF headers: $TIFF_INCLUDE_DIR"
            echo "JPEG library: $JPEG_LIBRARY"
            echo "JPEG headers: $JPEG_INCLUDE_DIR"
            echo "PNG library: $PNG_LIBRARY"
            echo "PNG headers: $PNG_INCLUDE_DIR"
            echo "zlib library: $ZLIB_LIBRARY"
            echo "zlib headers: $ZLIB_INCLUDE_DIR"
            if [[ -n "$IMATH_VERSION_FILE" ]]; then
              echo
              echo "Imath version metadata: $IMATH_VERSION_FILE"
              grep -E 'PACKAGE_VERSION|VERSION' "$IMATH_VERSION_FILE" || true
            fi
          } | tee "$ROOT/logs/dependency-paths.txt"

      - name: Build missing Android pugixml dependency
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$OSL_PROBE_ROOT"
          SRC="$ROOT/pugixml-source"
          BUILD="$ROOT/pugixml-build"
          PREFIX="$ROOT/deps/pugixml"

          git clone \
            --depth 1 \
            --branch "$PUGIXML_VERSION" \
            https://github.com/zeux/pugixml.git \
            "$SRC"

          git -C "$SRC" rev-parse HEAD \
            | tee "$ROOT/logs/pugixml-source-commit.txt"

          cmake \
            -S "$SRC" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DPUGIXML_BUILD_TESTS=OFF \
            2>&1 | tee "$ROOT/logs/pugixml-configure.log"

          cmake --build "$BUILD" --parallel 2 \
            2>&1 | tee "$ROOT/logs/pugixml-build.log"

          cmake --install "$BUILD" \
            2>&1 | tee "$ROOT/logs/pugixml-install.log"

          PUGI_CONFIG="$(
            find "$PREFIX" \
              \( -iname 'pugixml-config.cmake' \
                 -o -iname 'pugixmlConfig.cmake' \) \
              -print -quit
          )"
          PUGI_LIBRARY="$(
            find "$PREFIX/lib" -name 'libpugixml.a' -print -quit
          )"

          test -n "$PUGI_CONFIG"
          test -f "$PUGI_CONFIG"
          test -n "$PUGI_LIBRARY"
          test -f "$PUGI_LIBRARY"

          MEMBER="$(ar t "$PUGI_LIBRARY" | sed -n '1p')"
          test -n "$MEMBER"
          OBJECT="$(mktemp)"
          ar p "$PUGI_LIBRARY" "$MEMBER" > "$OBJECT"
          readelf -h "$OBJECT" | tee "$ROOT/logs/pugixml-elf.txt"
          readelf -h "$OBJECT" | grep -Eq 'Machine:.*AArch64'
          rm -f "$OBJECT"

          echo "PUGIXML_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "PUGIXML_CONFIG_DIR=$(dirname "$PUGI_CONFIG")" \
            >> "$GITHUB_ENV"

          {
            echo "Pugixml package: $PUGI_CONFIG"
            echo "Pugixml library: $PUGI_LIBRARY"
          } | tee "$ROOT/logs/pugixml-package-summary.txt"

      - name: Fetch exact OSL source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$OSL_VERSION" \
            https://github.com/AcademySoftwareFoundation/OpenShadingLanguage.git \
            "$OSL_PROBE_ROOT/source"

          git -C "$OSL_PROBE_ROOT/source" rev-parse HEAD \
            | tee "$OSL_PROBE_ROOT/logs/osl-source-commit.txt"

      - name: Configure OSL for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$OSL_PROBE_ROOT"
          BUILD="$ROOT/build"
          PREFIX="$ROOT/install"
          LOG="$ROOT/logs/osl-target-configure.log"

          mkdir -p "$BUILD" "$PREFIX"

          cmake \
            -S "$ROOT/source" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "-DCMAKE_PREFIX_PATH=${PUGIXML_PREFIX};${OIIO_PREFIX};${LLVM_PREFIX}" \
            "-DLLVM_DIR=${LLVM_CONFIG_DIR}" \
            "-DClang_DIR=${CLANG_CONFIG_DIR}" \
            "-DOpenImageIO_DIR=${OIIO_CONFIG_DIR}" \
            "-DImath_DIR=${IMATH_CONFIG_DIR}" \
            "-DOpenEXR_DIR=${OPENEXR_CONFIG_DIR}" \
            "-DOpenColorIO_DIR=${OCIO_CONFIG_DIR}" \
            "-Dpugixml_DIR=${PUGIXML_CONFIG_DIR}" \
            "-DPUGIXML_HOME=${PUGIXML_PREFIX}" \
            "-DTIFF_LIBRARY=${TIFF_LIBRARY}" \
            "-DTIFF_LIBRARY_RELEASE=${TIFF_LIBRARY}" \
            "-DTIFF_INCLUDE_DIR=${TIFF_INCLUDE_DIR}" \
            "-DJPEG_LIBRARY=${JPEG_LIBRARY}" \
            "-DJPEG_LIBRARY_RELEASE=${JPEG_LIBRARY}" \
            "-DJPEG_INCLUDE_DIR=${JPEG_INCLUDE_DIR}" \
            "-DPNG_LIBRARY=${PNG_LIBRARY}" \
            "-DPNG_LIBRARY_RELEASE=${PNG_LIBRARY}" \
            "-DPNG_PNG_INCLUDE_DIR=${PNG_INCLUDE_DIR}" \
            "-DPNG_INCLUDE_DIR=${PNG_INCLUDE_DIR}" \
            "-DZLIB_LIBRARY=${ZLIB_LIBRARY}" \
            "-DZLIB_LIBRARY_RELEASE=${ZLIB_LIBRARY}" \
            "-DZLIB_INCLUDE_DIR=${ZLIB_INCLUDE_DIR}" \
            -DBUILD_MISSING_DEPS=OFF \
            -DBUILD_ROBINMAP_FORCE=OFF \
            -DOSL_BUILD_TESTS=OFF \
            -DOSL_BUILD_PLUGINS=OFF \
            -DOSL_BUILD_SHADERS=OFF \
            -DUSE_LLVM_BITCODE=OFF \
            -DOSL_USE_OPTIX=OFF \
            -DUSE_PYTHON=OFF \
            -DUSE_QT=OFF \
            -DINSTALL_DOCS=OFF \
            2>&1 | tee "$LOG"

      - name: Validate OSL configure cache
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$OSL_PROBE_ROOT"
          CACHE="$ROOT/build/CMakeCache.txt"
          LOG="$ROOT/logs/osl-target-configure.log"

          test -f "$CACHE"
          grep -F "CMAKE_SYSTEM_NAME:STRING=Android" "$CACHE"

          grep -E \
            '^(LLVM_DIR|Clang_DIR|OpenImageIO_DIR|Imath_DIR|OpenEXR_DIR|OpenColorIO_DIR|pugixml_DIR|TIFF_LIBRARY|TIFF_LIBRARY_RELEASE|TIFF_INCLUDE_DIR|JPEG_LIBRARY|JPEG_INCLUDE_DIR|PNG_LIBRARY|PNG_PNG_INCLUDE_DIR|ZLIB_LIBRARY|ZLIB_INCLUDE_DIR|CMAKE_ANDROID_ARCH_ABI):' \
            "$CACHE" \
            | tee "$ROOT/logs/configure-cache-summary.txt"

          echo "OSL CMake configuration completed."
          echo "This did not compile or install OSL."

      - name: Upload configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-osl-target-configure-report
          path: |
            android-osl-probe/logs/
            android-osl-probe/build/CMakeCache.txt
            android-osl-probe/build/CMakeFiles/CMakeConfigureLog.yaml
            android-osl-probe/build/CMakeFiles/CMakeError.log
            android-osl-probe/build/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn
          retention-days: 14
