name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-linux-android29"

  BUILD_JOBS: "4"

jobs:
  build-llvm-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/host-llvm-install \
            llvm-android/host-clang-install \
            llvm-android/target-llvm-install \
            llvm-android/target-install \
            llvm-android/package \
            llvm-android/logs

          echo "ROOT=$GITHUB_WORKSPACE/llvm-android" >> "$GITHUB_ENV"
          echo "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_WORKSPACE/llvm-android/build" >> "$GITHUB_ENV"
          echo "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" >> "$GITHUB_ENV"
          echo "HOST_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-llvm-install" >> "$GITHUB_ENV"
          echo "HOST_CLANG_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-clang-install" >> "$GITHUB_ENV"
          echo "TARGET_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-llvm-install" >> "$GITHUB_ENV"
          echo "TARGET_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-install" >> "$GITHUB_ENV"
          echo "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" >> "$GITHUB_ENV"

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          TC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"

          echo "NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "SYSROOT=$TC/sysroot" >> "$GITHUB_ENV"
          echo "ANDROID_CLANG=$TC/bin/clang" >> "$GITHUB_ENV"
          echo "ANDROID_CLANGXX=$TC/bin/clang++" >> "$GITHUB_ENV"

      # ============================================================
      # LLVM SOURCE
      # ============================================================

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo "=========================================="
          echo " LLVM SOURCE"
          echo "=========================================="

          git -C "$SRC" rev-parse HEAD
          git -C "$SRC" describe --tags --always

      # ============================================================
      # STAGE 1
      # NATIVE LLVM
      # ============================================================

      - name: Configure native host LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_LLVM_INSTALL" \
            \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INCLUDE_UTILS=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-llvm-configure.log"

      - name: Build native LLVM TableGen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target \
              llvm-tblgen \
              llvm-min-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-tblgen-build.log"

      - name: Install native LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target install \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-install.log"

      - name: Collect native LLVM TableGen
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host-llvm/bin/llvm-tblgen"
          test -x "$BUILD/host-llvm/bin/llvm-min-tblgen"

          cp "$BUILD/host-llvm/bin/llvm-tblgen" "$HOST_TOOLS/llvm-tblgen"
          cp "$BUILD/host-llvm/bin/llvm-min-tblgen" "$HOST_TOOLS/llvm-min-tblgen"

          chmod +x "$HOST_TOOLS/llvm-tblgen" "$HOST_TOOLS/llvm-min-tblgen"

          echo "========== llvm-tblgen =========="
          file "$HOST_TOOLS/llvm-tblgen"
          "$HOST_TOOLS/llvm-tblgen" --version

          echo "========== llvm-min-tblgen =========="
          file "$HOST_TOOLS/llvm-min-tblgen"
          "$HOST_TOOLS/llvm-min-tblgen" --version

      # ============================================================
      # STAGE 2
      # NATIVE CLANG TABLEGEN
      # ============================================================

      - name: Configure native standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/host-clang"

          test -f "$HOST_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/host-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_CLANG_INSTALL" \
            \
            -DLLVM_DIR="$HOST_LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_ENABLE_PROTO_FUZZER=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            2>&1 | tee "$LOGS/host-clang-configure.log"

      - name: Verify native Clang TableGen target
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C "$BUILD/host-clang" -t targets \
            > "$ROOT/host-clang-targets.txt"

          grep -q '^clang-tblgen:' "$ROOT/host-clang-targets.txt"

          echo "clang-tblgen target exists."

      - name: Build native Clang TableGen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-clang" \
            --target clang-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-clang-tblgen-build.log"

      - name: Collect native Clang TableGen
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host-clang/bin/clang-tblgen"

          cp "$BUILD/host-clang/bin/clang-tblgen" "$HOST_TOOLS/clang-tblgen"
          chmod +x "$HOST_TOOLS/clang-tblgen"

          echo "========== clang-tblgen =========="
          file "$HOST_TOOLS/clang-tblgen"
          "$HOST_TOOLS/clang-tblgen" --version

      - name: Free space used by host build trees
        shell: bash
        run: |
          set -eu
          rm -rf "$BUILD/host-llvm" "$BUILD/host-clang" \
                 "$HOST_LLVM_INSTALL" "$HOST_CLANG_INSTALL"
          df -h /

      # ============================================================
      # STAGE 3
      # ANDROID LLVM
      #
      # LLVM_HOST_TRIPLE must be the ANDROID triple (it is what
      # llvm::sys::getProcessTriple() returns at runtime, which OSL's
      # JIT uses). It was previously set to the x86_64 build machine.
      # RTTI/EH are ON so OSL/Cycles can subclass LLVM classes.
      # ============================================================

      - name: Configure Android standalone LLVM
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-llvm"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_LLVM_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_TARGET_ARCH=AArch64 \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN="$HOST_TOOLS/llvm-tblgen" \
            -DLLVM_USE_HOST_TOOLS=ON \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_ENABLE_PIC=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_EH=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_WARNINGS=OFF \
            \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g0" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g0" \
            \
            2>&1 | tee "$LOGS/target-llvm-configure.log"

      - name: Build Android LLVM libraries
        shell: bash
        run: |
          set -uo pipefail
          cmake --build "$BUILD/target-llvm" \
            --target llvm-libraries \
            -j "$BUILD_JOBS" \
            > "$LOGS/target-llvm-libraries-build.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::LLVM build failed (exit $rc)"
            tail -n 150 "$LOGS/target-llvm-libraries-build.log"
            grep -nE "error:|FAILED:|CMake Error|undefined reference|fatal error" \
              "$LOGS/target-llvm-libraries-build.log" | head -n 60 || true
            exit "$rc"
          fi
          tail -n 3 "$LOGS/target-llvm-libraries-build.log"

      - name: Install Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/target-llvm" \
            2>&1 | tee "$LOGS/target-llvm-install.log"

      - name: Free space used by Android LLVM build tree
        shell: bash
        run: |
          set -eu
          rm -rf "$BUILD/target-llvm"
          df -h /

      # ============================================================
      # STAGE 4
      # ANDROID STANDALONE CLANG
      #
      # Static Analyzer is deliberately OFF to save disk and time.
      # ============================================================

      - name: Configure Android standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-clang"

          test -f "$TARGET_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/target-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DLLVM_DIR="$TARGET_LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DCLANG_TABLEGEN="$HOST_TOOLS/clang-tblgen" \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_ENABLE_PROTO_FUZZER=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g0" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g0" \
            \
            2>&1 | tee "$LOGS/target-clang-configure.log"

      # ============================================================
      # PREFLIGHT (fixed: no nonexistent "clang-headers" target)
      # ============================================================

      - name: Preflight standalone Android Clang
        shell: bash
        run: |
          set -euo pipefail

          ninja -C "$BUILD/target-clang" -t targets all \
            > "$ROOT/target-clang-targets.txt"

          missing=0
          for t in clang-tblgen install-clang-headers install-clang-libraries \
                   clang-resource-headers clang-cmake-exports \
                   libclangBasic.a libclangAST.a libclangFrontend.a libclangCodeGen.a; do
            if grep -qE "^(lib/)?${t}:" "$ROOT/target-clang-targets.txt"; then
              echo "FOUND:   $t"
            else
              echo "MISSING: $t"
              missing=$((missing+1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing expected Clang targets are missing; clang-related targets present:"
            grep -E '^(lib/libclang|install-clang|clang-)' \
              "$ROOT/target-clang-targets.txt" | sort | head -n 80
            exit 1
          fi

          echo
          grep -E '^(CLANG_ENABLE_STATIC_ANALYZER|LLVM_DIR|CLANG_TABLEGEN)[:=]' \
            "$BUILD/target-clang/CMakeCache.txt" || true

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/llvm-min-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"
          echo "PREFLIGHT OK"

      # ============================================================
      # BUILD EVERYTHING IN THE CLANG TREE
      #
      # A full build is needed so generated files and resource
      # headers exist before the final install.
      # ============================================================

      - name: Build ALL Android Clang libraries and generated files
        shell: bash
        run: |
          set -uo pipefail
          cmake --build "$BUILD/target-clang" -j "$BUILD_JOBS" \
            > "$LOGS/target-clang-build.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Clang build failed (exit $rc)"
            echo "---- last 150 lines ----"
            tail -n 150 "$LOGS/target-clang-build.log"
            echo "---- error lines ----"
            grep -nE "error:|FAILED:|CMake Error|undefined reference|fatal error" \
              "$LOGS/target-clang-build.log" | head -n 60 || true
            exit "$rc"
          fi
          tail -n 3 "$LOGS/target-clang-build.log"

      - name: Install Android Clang (headers, libs, resource headers, CMake package)
        shell: bash
        run: |
          set -euo pipefail
          cmake --install "$BUILD/target-clang" \
            2>&1 | tee "$LOGS/target-clang-final-install.log" | tail -n 20

      # ============================================================
      # MERGE LLVM INTO THE CLANG PREFIX (one self-contained tree)
      # ============================================================

      - name: Merge LLVM install into the Clang install prefix
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$TARGET_LLVM_INSTALL"/. "$TARGET_INSTALL"/
          echo "Merged tree layout:"
          find "$TARGET_INSTALL" -maxdepth 2 -mindepth 1 -type d | sort
          echo "LLVM static libs:  $(ls "$TARGET_INSTALL"/lib/libLLVM*.a | wc -l)"
          echo "Clang static libs: $(ls "$TARGET_INSTALL"/lib/libclang*.a | wc -l)"
          echo "--- where is Version.h / Version.inc? ---"
          find "$TARGET_INSTALL" -name 'Version.*' | sort
          echo "--- cmake packages ---"
          find "$TARGET_INSTALL/lib/cmake" -maxdepth 2 | sort

      # ============================================================
      # VERIFY CLANG HEADERS
      # ============================================================

      - name: Verify Clang public headers
        shell: bash
        run: |
          set -u
          missing=0
          for f in \
            include/clang/AST/AST.h \
            include/clang/AST/ASTContext.h \
            include/clang/Basic/Version.h \
            include/clang/Basic/Version.inc \
            include/clang/Basic/SourceLocation.h \
            include/clang/Lex/Lexer.h \
            include/clang/Sema/Sema.h \
            include/clang/Frontend/CompilerInstance.h \
            include/clang/CodeGen/CodeGenAction.h \
            include/clang/Driver/Driver.h \
            include/clang/Config/config.h ; do
            if [ -f "$TARGET_INSTALL/$f" ]; then echo "OK      $f"
            else echo "MISSING $f"; missing=$((missing+1)); fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing Clang headers missing. What exists:"
            ls "$TARGET_INSTALL/include" || true
            ls "$TARGET_INSTALL/include/clang" 2>/dev/null | head -n 50 || true
            find "$TARGET_INSTALL" -name 'Version.*' | head -n 20
            exit 1
          fi
          echo "PASS: Clang public headers installed."

      # ============================================================
      # VERIFY LLVM HEADERS
      # ============================================================

      - name: Verify LLVM public headers
        shell: bash
        run: |
          set -u
          missing=0
          for f in \
            include/llvm/IR/Module.h \
            include/llvm/Support/Error.h \
            include/llvm/ADT/StringRef.h \
            include/llvm/Config/llvm-config.h \
            include/llvm/ExecutionEngine/Orc/LLJIT.h ; do
            if [ -f "$TARGET_INSTALL/$f" ]; then echo "OK      $f"
            else echo "MISSING $f"; missing=$((missing+1)); fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing LLVM headers missing"
            ls "$TARGET_INSTALL/include" || true
            exit 1
          fi
          grep LLVM_VERSION_STRING "$TARGET_INSTALL/include/llvm/Config/llvm-config.h"
          grep -q '"20.1.8"' "$TARGET_INSTALL/include/llvm/Config/llvm-config.h"
          echo "PASS: LLVM public headers installed (version 20.1.8)."

      # ============================================================
      # VERIFY CLANG RESOURCE HEADERS
      # ============================================================

      - name: Verify Clang resource headers
        shell: bash
        run: |
          set -euxo pipefail

          RESOURCE_DIR="$TARGET_INSTALL/lib/clang/20/include"

          test -d "$RESOURCE_DIR"
          test -f "$RESOURCE_DIR/stddef.h"
          test -f "$RESOURCE_DIR/stdarg.h"

          echo "PASS: Clang resource headers installed."

      # ============================================================
      # VERIFY CMAKE CONFIG FILES
      # ============================================================

      - name: Verify LLVM and Clang CMake packages
        shell: bash
        run: |
          set -u
          missing=0
          for f in \
            lib/cmake/llvm/LLVMConfig.cmake \
            lib/cmake/llvm/LLVMExports.cmake \
            lib/cmake/llvm/AddLLVM.cmake \
            lib/cmake/clang/ClangConfig.cmake \
            lib/cmake/clang/ClangTargets.cmake ; do
            if [ -f "$TARGET_INSTALL/$f" ]; then echo "OK      $f"
            else echo "MISSING $f"; missing=$((missing+1)); fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing CMake package files missing"
            find "$TARGET_INSTALL/lib/cmake" -maxdepth 2 | sort || true
            exit 1
          fi
          echo "PASS: CMake packages present."

      # ============================================================
      # SHOW LIBRARIES
      # ============================================================

      - name: Show installed LLVM libraries
        shell: bash
        run: |
          set -eu
          echo "========== LLVM libraries =========="
          find "$TARGET_INSTALL/lib" -maxdepth 1 -type f -name 'libLLVM*.a' -print | sort

      - name: Show installed Clang libraries
        shell: bash
        run: |
          set -eu
          echo "========== Clang libraries =========="
          find "$TARGET_INSTALL/lib" -maxdepth 1 -type f -name 'libclang*.a' -print | sort

      - name: Verify required static libraries exist
        shell: bash
        run: |
          set -u
          missing=0
          for l in LLVMSupport LLVMCore LLVMAnalysis LLVMBitReader LLVMBitWriter \
                   LLVMLinker LLVMIRReader LLVMPasses LLVMExecutionEngine LLVMMCJIT \
                   LLVMOrcJIT LLVMTarget LLVMTargetParser LLVMAArch64CodeGen \
                   LLVMAArch64Desc LLVMAArch64Info LLVMAArch64AsmParser \
                   clangBasic clangAST clangLex clangParse clangSema clangFrontend \
                   clangDriver clangCodeGen clangSerialization clangEdit \
                   clangAnalysis clangSupport ; do
            if [ -f "$TARGET_INSTALL/lib/lib$l.a" ]; then echo "OK      lib$l.a"
            else echo "MISSING lib$l.a"; missing=$((missing+1)); fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing required libraries missing"
            exit 1
          fi

      # ============================================================
      # ARM64 VERIFICATION OF EVERY ARCHIVE
      # ============================================================

      - name: Verify Android ARM64 (every static archive)
        shell: bash
        run: |
          set -u
          AR="$ANDROID_TOOLCHAIN/bin/llvm-ar"
          READELF="$ANDROID_TOOLCHAIN/bin/llvm-readelf"
          TMP="$(mktemp -d)"
          ok=0; bad=0; skipped=0

          for a in "$TARGET_INSTALL"/lib/*.a; do
            m="$("$AR" t "$a" 2>/dev/null | head -n 1 || true)"
            if [ -z "$m" ]; then
              echo "skip (empty archive): $(basename "$a")"
              skipped=$((skipped+1))
              continue
            fi
            "$AR" p "$a" "$m" > "$TMP/obj.o" 2>/dev/null || true
            if ! "$READELF" -h "$TMP/obj.o" > "$TMP/hdr.txt" 2>&1; then
              echo "BAD  $(basename "$a"): first member '$m' is not readable ELF"
              bad=$((bad+1))
              continue
            fi
            if grep -Eq 'Class:[[:space:]]+ELF64' "$TMP/hdr.txt" \
               && grep -Eq 'Machine:[[:space:]]+AArch64' "$TMP/hdr.txt"; then
              ok=$((ok+1))
            else
              echo "BAD  $(basename "$a"): not ELF64/AArch64"
              grep -E 'Class|Machine' "$TMP/hdr.txt"
              bad=$((bad+1))
            fi
          done

          echo "ELF64/AArch64 archives: $ok   skipped: $skipped   bad: $bad"
          if [ "$bad" -ne 0 ] || [ "$ok" -lt 100 ]; then
            echo "::error::Archive architecture verification failed"
            exit 1
          fi
          echo "=========================================="
          echo " Android ARM64 LLVM/Clang verification OK"
          echo "=========================================="

      # ============================================================
      # CONSUMER SMOKE TEST (find_package + NDK compile + link)
      # ============================================================

      - name: Smoke test - consume LLVM and Clang via CMake with the NDK
        shell: bash
        run: |
          set -euo pipefail

          SMOKE="$ROOT/consumer-test"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"

          cat > "$SMOKE/main.cpp" <<'EOF'
          #include "llvm/IR/LLVMContext.h"
          #include "llvm/IR/Module.h"
          #include "llvm/Support/raw_ostream.h"
          #include "clang/Basic/Version.h"
          int main() {
            llvm::LLVMContext ctx;
            llvm::Module mod("smoke", ctx);
            llvm::outs() << "module=" << mod.getName()
                         << " clang=" << clang::getClangFullVersion() << "\n";
            return 0;
          }
          EOF

          cat > "$SMOKE/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(smoke CXX)
          find_package(LLVM 20.1 REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          message(STATUS "SMOKE_LLVM_VERSION=${LLVM_PACKAGE_VERSION}")
          separate_arguments(LLVM_DEFS NATIVE_COMMAND "${LLVM_DEFINITIONS}")
          add_executable(smoke main.cpp)
          target_include_directories(smoke PRIVATE ${LLVM_INCLUDE_DIRS} ${CLANG_INCLUDE_DIRS})
          target_compile_definitions(smoke PRIVATE ${LLVM_DEFS})
          target_compile_features(smoke PRIVATE cxx_std_17)
          target_link_libraries(smoke PRIVATE clangBasic LLVMCore LLVMSupport)
          EOF

          cmake -S "$SMOKE" -B "$SMOKE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_FIND_ROOT_PATH="$TARGET_INSTALL" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DLLVM_DIR="$TARGET_INSTALL/lib/cmake/llvm" \
            -DClang_DIR="$TARGET_INSTALL/lib/cmake/clang" \
            2>&1 | tee "$LOGS/smoke-configure.log"

          grep -q 'SMOKE_LLVM_VERSION=20.1.8' "$LOGS/smoke-configure.log"

          cmake --build "$SMOKE/build" 2>&1 | tee "$LOGS/smoke-build.log"

          BIN="$SMOKE/build/smoke"
          test -f "$BIN"
          "$ANDROID_TOOLCHAIN/bin/llvm-readelf" -h "$BIN" | grep -E 'Class|Machine|Type'
          "$ANDROID_TOOLCHAIN/bin/llvm-readelf" -h "$BIN" | grep -Eq 'Class:[[:space:]]+ELF64'
          "$ANDROID_TOOLCHAIN/bin/llvm-readelf" -h "$BIN" | grep -Eq 'Machine:[[:space:]]+AArch64'
          "$ANDROID_TOOLCHAIN/bin/llvm-readelf" -d "$BIN" | grep NEEDED || true

          echo "SMOKE TEST OK: arm64 binary linked against installed LLVM+Clang"

      # ============================================================
      # NDK COMPILER SMOKE TEST
      # ============================================================

      - name: Android ARM64 compiler smoke test
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$ROOT/compiler-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          int blender_android_test(int x)
          {
              return x + 1;
          }
          EOF

          "$ANDROID_CLANG" \
            --target="$TARGET_TRIPLE" \
            --sysroot="$SYSROOT" \
            -march=armv8-a \
            -fPIC \
            -O2 \
            -c \
            "$TEST_DIR/test.c" \
            -o "$TEST_DIR/test.o"

          file "$TEST_DIR/test.o"

          readelf -h "$TEST_DIR/test.o" |
            grep -E "Class:.*ELF64|Machine:.*AArch64"

          echo "Android ARM64 compiler smoke test PASSED."

      # ============================================================
      # FINAL INSTALLATION
      # ============================================================

      - name: Show final installation
        shell: bash
        run: |
          set -eu

          echo "=========================================="
          echo " FINAL ANDROID LLVM/CLANG INSTALL"
          echo "=========================================="

          du -sh "$TARGET_INSTALL"

          find "$TARGET_INSTALL" \
            -maxdepth 5 \
            -type f \
            -print \
            | sort \
            > "$ROOT/final-files.txt"

          wc -l "$ROOT/final-files.txt"
          cp "$ROOT/final-files.txt" "$LOGS/final-files.txt"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_INSTALL" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64.tar.gz" \
            .

          ls -lh "$ROOT/package"

          echo "=========================================="
          echo " LLVM_ANDROID_STAGE_SUCCESS"
          echo "=========================================="

      - name: Package native TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/llvm-20.1.8-host-tablegen.tar.gz" \
            .

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload Android LLVM Clang package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: llvm-android/package/llvm-20.1.8-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload native TableGen package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-host-tablegen
          path: llvm-android/package/llvm-20.1.8-host-tablegen.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload LLVM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
