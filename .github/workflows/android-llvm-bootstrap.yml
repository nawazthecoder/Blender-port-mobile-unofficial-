name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-none-linux-android29"
  HOST_TRIPLE: "x86_64-pc-linux-gnu"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-llvm-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/host-install \
            llvm-android/target-install \
            llvm-android/package \
            llvm-android/logs

          echo \
            "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo \
            "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo \
            "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-install" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-install" \
            >> "$GITHUB_ENV"

          echo \
            "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo \
            "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANG=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANGXX=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            >> "$GITHUB_ENV"

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo
          echo "========== LLVM SOURCE =========="
          git -C "$SRC" rev-parse HEAD
          git -C "$SRC" describe --tags --always

      # ============================================================
      # STAGE 1
      # Native host tools.
      #
      # These execute on the Ubuntu GitHub runner.
      # ============================================================

      - name: Configure native LLVM tablegen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_INSTALL" \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-configure.log"

      - name: Build native tablegen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host" \
            --target \
              llvm-tblgen \
              clang-tblgen \
            -j 2 \
            2>&1 | tee "$LOGS/host-build.log"

      - name: Verify native tablegen
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host/bin/llvm-tblgen"
          test -x "$BUILD/host/bin/clang-tblgen"

          cp \
            "$BUILD/host/bin/llvm-tblgen" \
            "$HOST_TOOLS/llvm-tblgen"

          cp \
            "$BUILD/host/bin/clang-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          chmod +x \
            "$HOST_TOOLS/llvm-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          echo
          echo "========== llvm-tblgen =========="
          file "$HOST_TOOLS/llvm-tblgen"
          "$HOST_TOOLS/llvm-tblgen" --version

          echo
          echo "========== clang-tblgen =========="
          file "$HOST_TOOLS/clang-tblgen"
          "$HOST_TOOLS/clang-tblgen" --version

          echo
          echo "========== Host architecture =========="

          readelf -h "$HOST_TOOLS/llvm-tblgen" |
            grep -E "Class:|Machine:"

          readelf -h "$HOST_TOOLS/clang-tblgen" |
            grep -E "Class:|Machine:"

      # ============================================================
      # STAGE 2
      # Android AArch64 LLVM + Clang libraries.
      #
      # IMPORTANT:
      # No LLVM/Clang command-line tools are built here.
      # We only need the libraries + headers for Blender.
      # ============================================================

      - name: Configure Android ARM64 LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE="$HOST_TRIPLE" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN="$HOST_TOOLS/llvm-tblgen" \
            -DCLANG_TABLEGEN="$HOST_TOOLS/clang-tblgen" \
            \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_ENABLE_PIC=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            2>&1 | tee "$LOGS/android-configure.log"

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target/CMakeCache.txt"

          test -f "$CACHE"

          echo
          echo "========== Android target =========="

          grep -E \
            '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER_TARGET|CMAKE_CXX_COMPILER_TARGET|CMAKE_SYSROOT):' \
            "$CACHE" || true

          echo
          echo "========== LLVM target =========="

          grep -E \
            '^(LLVM_HOST_TRIPLE|LLVM_DEFAULT_TARGET_TRIPLE|LLVM_TARGETS_TO_BUILD|LLVM_NATIVE_TOOL_DIR|LLVM_TABLEGEN|CLANG_TABLEGEN):' \
            "$CACHE" || true

          echo
          echo "========== Tool settings =========="

          grep -E \
            '^(LLVM_BUILD_TOOLS|LLVM_INCLUDE_TOOLS|CLANG_BUILD_TOOLS|LLVM_BUILD_UTILS|LLVM_INCLUDE_UTILS):' \
            "$CACHE" || true

          echo
          echo "========== Test settings =========="

          grep -E \
            '^(LLVM_BUILD_TESTS|LLVM_INCLUDE_TESTS|CLANG_INCLUDE_TESTS):' \
            "$CACHE" || true

          echo
          echo "========== Native tools =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/llvm-tblgen" --version
          "$HOST_TOOLS/clang-tblgen" --version

      # ============================================================
      # Build only the libraries.
      #
      # Do NOT use LLVM_DISTRIBUTION_COMPONENTS.
      # Do NOT build the generic "all" target.
      # ============================================================

      - name: Build Android LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target LLVMCore \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-core-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMSupport \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-support-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMAnalysis \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-analysis-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMCodeGen \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-codegen-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMTarget \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-target-build.log"

      - name: Build Android AArch64 backend
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target LLVMAArch64CodeGen \
            -j 2 \
            2>&1 | tee "$LOGS/aarch64-codegen-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMAArch64AsmParser \
            -j 2 \
            2>&1 | tee "$LOGS/aarch64-parser-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMAArch64Desc \
            -j 2 \
            2>&1 | tee "$LOGS/aarch64-desc-build.log"

          cmake \
            --build "$BUILD/target" \
            --target LLVMAArch64Info \
            -j 2 \
            2>&1 | tee "$LOGS/aarch64-info-build.log"

      - name: Build Android Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target clangBasic \
            -j 2 \
            2>&1 | tee "$LOGS/clang-basic-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangLex \
            -j 2 \
            2>&1 | tee "$LOGS/clang-lex-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangAST \
            -j 2 \
            2>&1 | tee "$LOGS/clang-ast-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangSema \
            -j 2 \
            2>&1 | tee "$LOGS/clang-sema-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangAnalysis \
            -j 2 \
            2>&1 | tee "$LOGS/clang-analysis-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangParse \
            -j 2 \
            2>&1 | tee "$LOGS/clang-parse-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangSerialization \
            -j 2 \
            2>&1 | tee "$LOGS/clang-serialization-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangDriver \
            -j 2 \
            2>&1 | tee "$LOGS/clang-driver-build.log"

          cmake \
            --build "$BUILD/target" \
            --target clangFrontend \
            -j 2 \
            2>&1 | tee "$LOGS/clang-frontend-build.log"

      # ============================================================
      # Install the normal LLVM/Clang headers + libraries.
      #
      # There is deliberately NO LLVM_DISTRIBUTION_COMPONENTS here.
      # ============================================================

      - name: Install Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target install \
            -j 2 \
            2>&1 | tee "$LOGS/android-install.log"

      # ============================================================
      # Verification
      # ============================================================

      - name: Verify unwanted Android tools were not built
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Unwanted tools check =========="

          for tool in \
            bugpoint \
            llvm-as \
            llvm-bcanalyzer \
            llvm-config \
            llvm-dis \
            llvm-link \
            opt \
            clang \
            clang++ \
            clang-format \
            clangd
          do
            if [ -e "$BUILD/target/bin/$tool" ]; then
              echo "ERROR: unwanted target executable exists: $tool"
              exit 1
            fi
          done

          echo "PASS: target development executables were not built."

      - name: Verify installed headers
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== LLVM headers =========="

          test -f \
            "$TARGET_INSTALL/include/llvm/IR/Module.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/Support/Error.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/ADT/StringRef.h"

          echo "LLVM headers OK."

          echo
          echo "========== Clang headers =========="

          test -f \
            "$TARGET_INSTALL/include/clang/AST/AST.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Basic/Version.h"

          echo "Clang headers OK."

      - name: Verify CMake packages
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== LLVM CMake package =========="

          test -f \
            "$TARGET_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          echo "LLVMConfig.cmake OK."

          echo
          echo "========== Clang CMake package =========="

          test -f \
            "$TARGET_INSTALL/lib/cmake/clang/ClangConfig.cmake"

          echo "ClangConfig.cmake OK."

      - name: Find installed LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== LLVM static libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libLLVM*.a' \
            -print \
            | sort

          echo
          echo "========== Clang static libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libclang*.a' \
            -print \
            | sort

      - name: Verify Android ARM64 LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          check_library() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                | head -n 1
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: no object files in $archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "========== $name =========="

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            rm -rf "$tmp"
          }

          LLVM_CORE="$TARGET_INSTALL/lib/libLLVMCore.a"
          LLVM_SUPPORT="$TARGET_INSTALL/lib/libLLVMSupport.a"
          CLANG_BASIC="$TARGET_INSTALL/lib/libclangBasic.a"
          CLANG_AST="$TARGET_INSTALL/lib/libclangAST.a"

          test -f "$LLVM_CORE"
          test -f "$LLVM_SUPPORT"
          test -f "$CLANG_BASIC"
          test -f "$CLANG_AST"

          check_library \
            "$LLVM_CORE" \
            "LLVMCore"

          check_library \
            "$LLVM_SUPPORT" \
            "LLVMSupport"

          check_library \
            "$CLANG_BASIC" \
            "clangBasic"

          check_library \
            "$CLANG_AST" \
            "clangAST"

          echo
          echo "=========================================="
          echo " Android ARM64 LLVM/Clang verification OK"
          echo "=========================================="

      - name: Verify target compiler smoke test
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$ROOT/compiler-test"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cat > "$WORK/test.c" <<'EOF'
          int blender_android_test(int x)
          {
              return x + 1;
          }
          EOF

          "$ANDROID_CLANG" \
            --target="$TARGET_TRIPLE" \
            --sysroot="$SYSROOT" \
            -march=armv8-a \
            -fPIC \
            -O2 \
            -c "$WORK/test.c" \
            -o "$WORK/test.o"

          file "$WORK/test.o"

          readelf -h "$WORK/test.o" |
            grep -E "Class:.*ELF64|Machine:.*AArch64"

          echo
          echo "Android compiler smoke test PASSED."

      - name: Show final installation
        shell: bash
        run: |
          set -eux

          echo "========== FINAL LLVM INSTALL =========="

          find "$TARGET_INSTALL" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 1200

      - name: Package Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_INSTALL" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64.tar.gz" \
            .

      - name: Package native tablegen
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/llvm-20.1.8-host-tablegen.tar.gz" \
            .

      - name: Upload Android LLVM package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: llvm-android/package/llvm-20.1.8-android-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload native tablegen package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-host-tablegen
          path: llvm-android/package/llvm-20.1.8-host-tablegen.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload LLVM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
