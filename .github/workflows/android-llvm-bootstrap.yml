name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-none-linux-android29"
  HOST_TRIPLE: "x86_64-pc-linux-gnu"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-llvm-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-pip \
            file \
            binutils \
            lld

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-install \
            llvm-android/host-tools \
            llvm-android/target-install \
            llvm-android/package \
            llvm-android/logs

          echo "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo "HOST_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-install" \
            >> "$GITHUB_ENV"

          echo "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo "TARGET_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-install" \
            >> "$GITHUB_ENV"

          echo "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo
          echo "LLVM revision:"
          git -C "$SRC" rev-parse HEAD

          echo
          echo "LLVM tag:"
          git -C "$SRC" describe --tags --always

      # ------------------------------------------------------------
      # STAGE 1
      # Build ONLY the native tablegen programs.
      #
      # These execute on the GitHub Ubuntu runner, not on Android.
      # ------------------------------------------------------------

      - name: Configure native host LLVM tools
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_INSTALL" \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-configure.log"

      - name: Build native tablegen tools
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host" \
            --target \
              llvm-tblgen \
              clang-tblgen \
            -j 2 \
            2>&1 | tee "$LOGS/host-build.log"

      - name: Collect native tablegen tools
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host/bin/llvm-tblgen"
          test -x "$BUILD/host/bin/clang-tblgen"

          cp \
            "$BUILD/host/bin/llvm-tblgen" \
            "$HOST_TOOLS/"

          cp \
            "$BUILD/host/bin/clang-tblgen" \
            "$HOST_TOOLS/"

          echo "========== Native tools =========="

          file "$HOST_TOOLS/llvm-tblgen"
          file "$HOST_TOOLS/clang-tblgen"

          readelf -h "$HOST_TOOLS/llvm-tblgen" |
            grep -E "Class:|Machine:"

          readelf -h "$HOST_TOOLS/clang-tblgen" |
            grep -E "Class:|Machine:"

      # ------------------------------------------------------------
      # STAGE 2
      # Cross-build LLVM + Clang libraries for Android ARM64.
      #
      # IMPORTANT:
      # LLVM tools are NOT included in this build.
      # bugpoint/llvm-as/etc. therefore cannot accidentally be linked
      # against the Android sysroot.
      # ------------------------------------------------------------

      - name: Configure Android ARM64 LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE="$HOST_TRIPLE" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_USE_HOST_TOOLS=ON \
            \
            -DLLVM_ENABLE_PIC=ON \
            -DLLVM_ENABLE_THREADS=ON \
            \
            -DTHREADS_PREFER_PTHREAD_FLAG=ON \
            -DCMAKE_THREAD_LIBS_INIT="" \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            -DLLVM_DISTRIBUTION_COMPONENTS="llvm-cmake-exports;llvm-headers;llvm-libraries;clang-cmake-exports;clang-headers;clang-resource-headers;clang-libraries" \
            \
            2>&1 | tee "$LOGS/android-configure.log"

      - name: Verify Android LLVM configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target/CMakeCache.txt"

          test -f "$CACHE"

          echo "========== Cross compilation =========="

          grep -E \
            '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER_TARGET|CMAKE_CXX_COMPILER_TARGET|CMAKE_SYSROOT):' \
            "$CACHE" || true

          echo
          echo "========== LLVM configuration =========="

          grep -E \
            '^(LLVM_VERSION|LLVM_HOST_TRIPLE|LLVM_DEFAULT_TARGET_TRIPLE|LLVM_TARGETS_TO_BUILD|LLVM_NATIVE_TOOL_DIR|LLVM_USE_HOST_TOOLS):' \
            "$CACHE" || true

          echo
          echo "========== Tool suppression =========="

          grep -E \
            '^(LLVM_BUILD_TOOLS|LLVM_INCLUDE_TOOLS|CLANG_BUILD_TOOLS|LLVM_BUILD_TESTS|LLVM_INCLUDE_TESTS|LLVM_BUILD_UTILS|LLVM_INCLUDE_UTILS):' \
            "$CACHE" || true

          echo
          echo "========== Thread configuration =========="

          grep -E \
            '^(THREADS_PREFER_PTHREAD_FLAG|CMAKE_THREAD_LIBS_INIT|LLVM_ENABLE_THREADS):' \
            "$CACHE" || true

          echo
          echo "========== Native tablegen =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/llvm-tblgen" --version
          "$HOST_TOOLS/clang-tblgen" --version

      - name: Build Android LLVM Clang distribution
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target distribution \
            -j 2 \
            2>&1 | tee "$LOGS/android-build.log"

      - name: Install Android LLVM Clang distribution
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target install-distribution \
            -j 2 \
            2>&1 | tee "$LOGS/android-install.log"

      # ------------------------------------------------------------
      # Verification
      # ------------------------------------------------------------

      - name: Verify no Android host-tool executables
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Checking unwanted tools =========="

          if [ -e "$BUILD/target/bin/bugpoint" ]; then
            echo "ERROR: Android bugpoint was built."
            exit 1
          fi

          if [ -e "$BUILD/target/bin/llvm-as" ]; then
            echo "ERROR: Android llvm-as was built."
            exit 1
          fi

          if [ -e "$BUILD/target/bin/clang" ]; then
            echo "ERROR: Android clang executable was built."
            exit 1
          fi

          echo "PASS: host/development executables were not built."

      - name: Verify Android LLVM headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$TARGET_INSTALL/include/llvm/IR/Module.h"
          test -f "$TARGET_INSTALL/include/llvm/Support/Error.h"
          test -f "$TARGET_INSTALL/include/llvm/ADT/StringRef.h"

          test -f "$TARGET_INSTALL/include/clang/AST/AST.h"
          test -f "$TARGET_INSTALL/include/clang/Basic/Version.h"

          echo "LLVM and Clang headers found."

      - name: Verify LLVM and Clang CMake packages
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          test -f \
            "$TARGET_INSTALL/lib/cmake/clang/ClangConfig.cmake"

          echo "LLVMConfig.cmake found."
          echo "ClangConfig.cmake found."

      - name: Verify Android ARM64 static libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " Verifying Android ARM64 LLVM / Clang"
          echo "=========================================="

          LLVM_CORE="$TARGET_INSTALL/lib/libLLVMCore.a"
          LLVM_SUPPORT="$TARGET_INSTALL/lib/libLLVMSupport.a"
          CLANG_BASIC="$TARGET_INSTALL/lib/libclangBasic.a"
          CLANG_AST="$TARGET_INSTALL/lib/libclangAST.a"

          test -f "$LLVM_CORE"
          test -f "$LLVM_SUPPORT"
          test -f "$CLANG_BASIC"
          test -f "$CLANG_AST"

          echo
          echo "Found:"
          echo "  $LLVM_CORE"
          echo "  $LLVM_SUPPORT"
          echo "  $CLANG_BASIC"
          echo "  $CLANG_AST"

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                | head -n 1
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: No object found in $archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "----- $name -----"

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            rm -rf "$tmp"
          }

          check_archive \
            "$LLVM_CORE" \
            "LLVMCore"

          check_archive \
            "$LLVM_SUPPORT" \
            "LLVMSupport"

          check_archive \
            "$CLANG_BASIC" \
            "clangBasic"

          check_archive \
            "$CLANG_AST" \
            "clangAST"

          echo
          echo "ARM64 LLVM/Clang library verification PASSED."

      - name: Count installed libraries
        shell: bash
        run: |
          set -eux

          echo
          echo "LLVM libraries:"
          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libLLVM*.a' \
            | wc -l

          echo
          echo "Clang libraries:"
          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libclang*.a' \
            | wc -l

          echo
          echo "AArch64 target libraries:"
          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name '*.a' \
            | sort \
            | head -n 100

      - name: Show final install tree
        shell: bash
        run: |
          set -eux

          echo "========== LLVM Android install =========="

          find "$TARGET_INSTALL" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 1000

      - name: Package Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_INSTALL" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64.tar.gz" \
            .

      - name: Package native tablegen tools
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/llvm-20.1.8-host-tablegen.tar.gz" \
            .

      - name: Upload Android LLVM package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: llvm-android/package/llvm-20.1.8-android-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload host tablegen tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-host-tablegen
          path: llvm-android/package/llvm-20.1.8-host-tablegen.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload LLVM build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
