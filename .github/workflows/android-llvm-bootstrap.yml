name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-none-linux-android29"
  HOST_TRIPLE: "x86_64-pc-linux-gnu"

  BUILD_JOBS: "2"

jobs:

  # ==============================================================
  # JOB 1
  #
  # Build:
  #   - native llvm-tblgen
  #   - native llvm-min-tblgen
  #   - native clang-tblgen
  #   - Android ARM64 LLVM libraries
  #
  # Then package only the finished outputs.
  # ==============================================================

  build-llvm:
    name: Build Android ARM64 LLVM
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # FREE RUNNER DISK SPACE
      # ------------------------------------------------------------

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Disk BEFORE cleanup =========="
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/julia || true
          sudo rm -rf /usr/local/aws-cli || true

          sudo apt-get clean || true

          echo
          echo "========== Disk AFTER cleanup =========="
          df -h

      # ------------------------------------------------------------
      # HOST TOOLS
      # ------------------------------------------------------------

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

          sudo apt-get clean

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ------------------------------------------------------------
      # ANDROID NDK
      # ------------------------------------------------------------

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # DIRECTORIES
      # ------------------------------------------------------------

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/host-llvm-install \
            llvm-android/host-clang-build \
            llvm-android/target-llvm-install \
            llvm-android/package \
            llvm-android/logs

          echo \
            "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo \
            "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo \
            "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-llvm-install" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-llvm-install" \
            >> "$GITHUB_ENV"

          echo \
            "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" \
            >> "$GITHUB_ENV"

          echo \
            "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANG=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANGXX=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # LLVM SOURCE
      # ------------------------------------------------------------

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo
          echo "========== LLVM SOURCE =========="

          git -C "$SRC" rev-parse HEAD
          git -C "$SRC" describe --tags --always

      # ============================================================
      # NATIVE LLVM
      # ============================================================

      - name: Configure native LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            \
            -DCMAKE_INSTALL_PREFIX="$HOST_LLVM_INSTALL" \
            \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INCLUDE_UTILS=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-llvm-configure.log"

      - name: Build native LLVM TableGen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target \
              llvm-tblgen \
              llvm-min-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-build.log"

      - name: Install native LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target install \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-install.log"

      - name: Collect native LLVM tools
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host-llvm/bin/llvm-tblgen"
          test -x "$BUILD/host-llvm/bin/llvm-min-tblgen"

          cp \
            "$BUILD/host-llvm/bin/llvm-tblgen" \
            "$HOST_TOOLS/llvm-tblgen"

          cp \
            "$BUILD/host-llvm/bin/llvm-min-tblgen" \
            "$HOST_TOOLS/llvm-min-tblgen"

          chmod +x \
            "$HOST_TOOLS/llvm-tblgen" \
            "$HOST_TOOLS/llvm-min-tblgen"

          echo
          echo "========== llvm-tblgen =========="

          file "$HOST_TOOLS/llvm-tblgen"
          "$HOST_TOOLS/llvm-tblgen" --version

          echo
          echo "========== llvm-min-tblgen =========="

          file "$HOST_TOOLS/llvm-min-tblgen"
          "$HOST_TOOLS/llvm-min-tblgen" --version

      # ------------------------------------------------------------
      # HOST LLVM BUILD NO LONGER NEEDED
      # Keep only its installed files + tblgen binaries.
      # ------------------------------------------------------------

      - name: Remove native LLVM build tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/host-llvm"

          echo
          echo "========== Disk after host LLVM cleanup =========="
          df -h

      # ============================================================
      # NATIVE CLANG TABLEGEN
      # ============================================================

      - name: Configure native standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/host-clang"

          test -f \
            "$HOST_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/host-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            \
            -DCMAKE_INSTALL_PREFIX="$ROOT/host-clang-install" \
            \
            -DLLVM_DIR="$HOST_LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_PROTO_FUZZER=OFF \
            -DCLANG_ENABLE_HLSL=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_BUILD_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            2>&1 | tee "$LOGS/host-clang-configure.log"

      - name: Verify native clang-tblgen target
        shell: bash
        run: |
          set -euxo pipefail

          ninja \
            -C "$BUILD/host-clang" \
            -t targets \
            > "$ROOT/host-clang-targets.txt"

          grep -q '^clang-tblgen:' \
            "$ROOT/host-clang-targets.txt"

          echo "clang-tblgen target exists."

      - name: Build native clang-tblgen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-clang" \
            --target clang-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-clang-build.log"

      - name: Collect native clang-tblgen
        shell: bash
        run: |
          set -euxo pipefail

          test -x \
            "$BUILD/host-clang/bin/clang-tblgen"

          cp \
            "$BUILD/host-clang/bin/clang-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          chmod +x \
            "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/clang-tblgen" --version

      - name: Remove host Clang build tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/host-clang"

          echo
          echo "========== Disk after host tool cleanup =========="
          df -h

      # ============================================================
      # ANDROID LLVM
      # ============================================================

      - name: Configure Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-llvm"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            \
            -DCMAKE_INSTALL_PREFIX="$TARGET_LLVM_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE="$HOST_TRIPLE" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_TARGET_ARCH=AArch64 \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN="$HOST_TOOLS/llvm-tblgen" \
            \
            -DLLVM_USE_HOST_TOOLS=ON \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_ENABLE_PIC=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            2>&1 | tee "$LOGS/target-llvm-configure.log"

      - name: Verify Android LLVM configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target-llvm/CMakeCache.txt"

          test -f "$CACHE"

          echo
          echo "========== Android target =========="

          grep -E \
            '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER_TARGET|CMAKE_CXX_COMPILER_TARGET|CMAKE_SYSROOT):' \
            "$CACHE" || true

          echo
          echo "========== LLVM target =========="

          grep -E \
            '^(LLVM_HOST_TRIPLE|LLVM_DEFAULT_TARGET_TRIPLE|LLVM_TARGET_ARCH|LLVM_TARGETS_TO_BUILD|LLVM_NATIVE_TOOL_DIR|LLVM_TABLEGEN):' \
            "$CACHE" || true

          echo
          echo "========== Native tools =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/llvm-min-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

      - name: Build Android LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-llvm" \
            --target llvm-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-llvm-build.log"

      - name: Install Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/target-llvm" \
            2>&1 | tee "$LOGS/target-llvm-install.log"

          test -f \
            "$TARGET_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

      # ------------------------------------------------------------
      # TARGET LLVM BUILD OBJECTS NO LONGER NEEDED
      # ------------------------------------------------------------

      - name: Remove Android LLVM build tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-llvm"

          echo
          echo "========== Disk after Android LLVM cleanup =========="
          df -h

      # ============================================================
      # PACKAGE LLVM + NATIVE TOOLS
      # ============================================================

      - name: Package Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_LLVM_INSTALL" \
            -czf \
            "$ROOT/package/android-llvm-install.tar.gz" \
            .

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/host-tablegen-tools.tar.gz" \
            .

      - name: Verify LLVM packages exist
        shell: bash
        run: |
          set -euxo pipefail

          test -s \
            "$ROOT/package/android-llvm-install.tar.gz"

          test -s \
            "$ROOT/package/host-tablegen-tools.tar.gz"

          ls -lh \
            "$ROOT/package/android-llvm-install.tar.gz" \
            "$ROOT/package/host-tablegen-tools.tar.gz"

      # ============================================================
      # UPLOAD INPUTS FOR JOB 2
      # ============================================================

      - name: Upload Android LLVM package
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-install
          path: llvm-android/package/android-llvm-install.tar.gz
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Upload native TableGen package
        uses: actions/upload-artifact@v4
        with:
          name: host-tablegen-tools
          path: llvm-android/package/host-tablegen-tools.tar.gz
          retention-days: 3
          compression-level: 1
          overwrite: true

      # ============================================================
      # UPLOAD LOGS
      # ============================================================

      - name: Upload LLVM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-build-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true


  # ================================================================
  # JOB 2
  #
  # Fresh GitHub runner.
  #
  # Build Android standalone Clang with the Static Analyzer OFF.
  #
  # This avoids carrying the huge LLVM build tree from Job 1.
  # ================================================================

  build-clang:
    name: Build Android ARM64 Clang
    needs: build-llvm
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # FREE RUNNER DISK
      # ------------------------------------------------------------

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Disk BEFORE cleanup =========="
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/julia || true
          sudo rm -rf /usr/local/aws-cli || true

          sudo apt-get clean || true

          echo
          echo "========== Disk AFTER cleanup =========="
          df -h

      # ------------------------------------------------------------
      # HOST TOOLS
      # ------------------------------------------------------------

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

          sudo apt-get clean

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ------------------------------------------------------------
      # ANDROID NDK
      # ------------------------------------------------------------

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # DIRECTORIES
      # ------------------------------------------------------------

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/target-llvm-install \
            llvm-android/target-clang-install \
            llvm-android/package \
            llvm-android/logs

          echo \
            "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo \
            "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo \
            "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-llvm-install" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_CLANG_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-clang-install" \
            >> "$GITHUB_ENV"

          echo \
            "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" \
            >> "$GITHUB_ENV"

          echo \
            "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANG=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANGXX=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          git -C "$SRC" rev-parse HEAD
          git -C "$SRC" describe --tags --always

      # ------------------------------------------------------------
      # DOWNLOAD JOB 1 OUTPUTS
      # ------------------------------------------------------------

      - name: Download Android LLVM package
        uses: actions/download-artifact@v4
        with:
          name: android-llvm-install
          path: llvm-android/package/android-llvm

      - name: Download host TableGen package
        uses: actions/download-artifact@v4
        with:
          name: host-tablegen-tools
          path: llvm-android/package/host-tools

      # ------------------------------------------------------------
      # EXTRACT LLVM
      # ------------------------------------------------------------

      - name: Extract Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -xzf \
            "$ROOT/package/android-llvm/android-llvm-install.tar.gz" \
            -C \
            "$TARGET_LLVM_INSTALL"

          echo
          echo "========== Android LLVM =========="

          test -f \
            "$TARGET_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          test -f \
            "$TARGET_LLVM_INSTALL/include/llvm/IR/Module.h"

      # ------------------------------------------------------------
      # EXTRACT HOST TOOLS
      # ------------------------------------------------------------

      - name: Extract host TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -xzf \
            "$ROOT/package/host-tools/host-tablegen-tools.tar.gz" \
            -C \
            "$HOST_TOOLS"

          chmod +x \
            "$HOST_TOOLS/llvm-tblgen" \
            "$HOST_TOOLS/llvm-min-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/llvm-min-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/llvm-tblgen" --version
          "$HOST_TOOLS/llvm-min-tblgen" --version
          "$HOST_TOOLS/clang-tblgen" --version

      # ============================================================
      # ANDROID STANDALONE CLANG
      # ============================================================

      - name: Configure Android standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-clang"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/target-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0 -DNDEBUG" \
            \
            -DCMAKE_INSTALL_PREFIX="$TARGET_CLANG_INSTALL" \
            \
            -DLLVM_DIR="$TARGET_LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            \
            -DCLANG_TABLEGEN="$HOST_TOOLS/clang-tblgen" \
            \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_PROTO_FUZZER=OFF \
            -DCLANG_ENABLE_HLSL=OFF \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_BUILD_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            2>&1 | tee "$LOGS/target-clang-configure.log"

      # ------------------------------------------------------------
      # VERY IMPORTANT PREFLIGHT
      #
      # Check the static analyzer state BEFORE a long build.
      # ------------------------------------------------------------

      - name: Preflight Clang configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target-clang/CMakeCache.txt"

          test -f "$CACHE"

          echo
          echo "=========================================="
          echo " Clang configuration"
          echo "=========================================="

          grep -E \
            '^(CLANG_ENABLE_STATIC_ANALYZER|CLANG_ENABLE_ARCMT|CLANG_ENABLE_PROTO_FUZZER|CLANG_ENABLE_HLSL|CLANG_BUILD_TOOLS|CLANG_INCLUDE_TESTS|CLANG_INCLUDE_DOCS|CLANG_BUILD_EXAMPLES):' \
            "$CACHE" || true

          if grep -q \
              '^CLANG_ENABLE_STATIC_ANALYZER:.*=ON$' \
              "$CACHE"; then

            echo
            echo "ERROR: Static Analyzer is still enabled."
            exit 1
          fi

          if grep -q \
              '^CLANG_ENABLE_ARCMT:.*=ON$' \
              "$CACHE"; then

            echo
            echo "ERROR: ARCMT is still enabled."
            exit 1
          fi

          echo
          echo "PASS: Static Analyzer disabled."
          echo "PASS: ARCMT disabled."

          echo
          echo "========== LLVM package =========="

          test -f \
            "$TARGET_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          echo
          echo "========== Host TableGen =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/llvm-min-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

      # ------------------------------------------------------------
      # VERIFY ACTUAL CLANG TARGETS
      # ------------------------------------------------------------

      - name: Inspect Clang targets
        shell: bash
        run: |
          set -euxo pipefail

          ninja \
            -C "$BUILD/target-clang" \
            -t targets \
            > "$ROOT/clang-targets.txt"

          echo "========== Clang targets =========="

          grep -E \
            '(^|/)(clang-[A-Za-z0-9_-]+|clang-libraries|clang-headers|install-clang-headers|install-clang-libraries)(:| )' \
            "$ROOT/clang-targets.txt" \
            | sort \
            || true

          echo
          echo "Target count:"

          wc -l "$ROOT/clang-targets.txt"

          grep -q '^clang-libraries:' \
            "$ROOT/clang-targets.txt"

          grep -q '^clang-headers:' \
            "$ROOT/clang-targets.txt"

          grep -q '^install-clang-headers:' \
            "$ROOT/clang-targets.txt"

          grep -q '^install-clang-libraries:' \
            "$ROOT/clang-targets.txt"

          echo
          echo "Required Clang targets exist."

      # ============================================================
      # BUILD CLANG
      #
      # Static Analyzer is OFF.
      #
      # This removes the large clangStaticAnalyzerCheckers tree
      # that consumed the runner disk in the previous 3h22m run.
      # ============================================================

      - name: Build Android Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Disk BEFORE Clang build =========="
          df -h

          cmake \
            --build "$BUILD/target-clang" \
            --target clang-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-clang-build.log"

      # ------------------------------------------------------------
      # INSTALL HEADERS
      # ------------------------------------------------------------

      - name: Install Clang headers
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-clang" \
            --target install-clang-headers \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/install-clang-headers.log"

      # ------------------------------------------------------------
      # INSTALL LIBRARIES
      # ------------------------------------------------------------

      - name: Install Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-clang" \
            --target install-clang-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/install-clang-libraries.log"

      # ------------------------------------------------------------
      # INSTALL REMAINING FILES
      # ------------------------------------------------------------

      - name: Install remaining Clang files
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/target-clang" \
            2>&1 | tee "$LOGS/target-clang-final-install.log"

      # ============================================================
      # VERIFY PUBLIC CLANG HEADERS
      # ============================================================

      - name: Verify Clang public headers
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            "$TARGET_CLANG_INSTALL/include/clang"

          test -d \
            "$TARGET_CLANG_INSTALL/include/clang/AST"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/AST/AST.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/AST/ASTContext.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/Basic/Version.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/Basic/SourceLocation.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/Lex/Lexer.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/Sema/Sema.h"

          test -f \
            "$TARGET_CLANG_INSTALL/include/clang/Frontend/CompilerInstance.h"

          echo
          echo "PASS: Clang public headers installed."

      # ============================================================
      # VERIFY LLVM HEADERS
      # ============================================================

      - name: Verify LLVM public headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_LLVM_INSTALL/include/llvm/IR/Module.h"

          test -f \
            "$TARGET_LLVM_INSTALL/include/llvm/Support/Error.h"

          test -f \
            "$TARGET_LLVM_INSTALL/include/llvm/ADT/StringRef.h"

          echo "PASS: LLVM public headers present."

      # ============================================================
      # VERIFY RESOURCE HEADERS
      # ============================================================

      - name: Verify Clang resource headers
        shell: bash
        run: |
          set -euxo pipefail

          RESOURCE_DIR="$TARGET_CLANG_INSTALL/lib/clang/20/include"

          test -d "$RESOURCE_DIR"

          test -f \
            "$RESOURCE_DIR/stddef.h"

          test -f \
            "$RESOURCE_DIR/stdarg.h"

          echo "PASS: Clang resource headers installed."

      # ============================================================
      # VERIFY CMAKE CONFIG FILES
      # ============================================================

      - name: Verify LLVM CMake configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          echo "LLVMConfig.cmake OK."

      - name: Verify Clang CMake configuration
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_CONFIG="$(
            find "$TARGET_CLANG_INSTALL" \
              -type f \
              -name ClangConfig.cmake \
              -print \
              -quit
          )"

          test -n "$CLANG_CONFIG"

          echo "ClangConfig.cmake:"
          echo "$CLANG_CONFIG"

      # ============================================================
      # SHOW LIBRARIES
      # ============================================================

      - name: Show LLVM libraries
        shell: bash
        run: |
          set -eux

          find "$TARGET_LLVM_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libLLVM*.a' \
            -print \
            | sort

      - name: Show Clang libraries
        shell: bash
        run: |
          set -eux

          find "$TARGET_CLANG_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libclang*.a' \
            -print \
            | sort

      # ============================================================
      # VERIFY ARM64 LLVM
      # ============================================================

      - name: Verify Android ARM64 LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                -quit
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: No object found in $archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "========== $name =========="

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            echo "PASS: $name is ELF64 AArch64."

            rm -rf "$tmp"
          }

          check_archive \
            "$TARGET_LLVM_INSTALL/lib/libLLVMCore.a" \
            "LLVMCore"

          check_archive \
            "$TARGET_LLVM_INSTALL/lib/libLLVMSupport.a" \
            "LLVMSupport"

          echo
          echo "LLVM ARM64 verification passed."

      # ============================================================
      # VERIFY ARM64 CLANG
      # ============================================================

      - name: Verify Android ARM64 Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                -quit
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: No object found in $archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "========== $name =========="

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            echo "PASS: $name is ELF64 AArch64."

            rm -rf "$tmp"
          }

          CLANG_BASIC="$TARGET_CLANG_INSTALL/lib/libclangBasic.a"
          CLANG_AST="$TARGET_CLANG_INSTALL/lib/libclangAST.a"

          test -f "$CLANG_BASIC"
          test -f "$CLANG_AST"

          check_archive \
            "$CLANG_BASIC" \
            "clangBasic"

          check_archive \
            "$CLANG_AST" \
            "clangAST"

          echo
          echo "Clang ARM64 verification passed."

      # ============================================================
      # VERIFY STATIC ANALYZER DID NOT RETURN
      # ============================================================

      - name: Verify Static Analyzer exclusion
        shell: bash
        run: |
          set -euxo pipefail

          if find "$BUILD/target-clang" \
              -type f \
              -path '*StaticAnalyzer*' \
              -print \
              -quit \
              | grep -q .; then

            echo "ERROR: Static Analyzer build files were generated."
            exit 1
          fi

          if find "$TARGET_CLANG_INSTALL/lib" \
              -maxdepth 1 \
              -type f \
              -name '*StaticAnalyzer*.a' \
              -print \
              -quit \
              | grep -q .; then

            echo "ERROR: Static Analyzer library was installed."
            exit 1
          fi

          echo "PASS: Static Analyzer is absent."

      # ============================================================
      # ANDROID COMPILER SMOKE TEST
      # ============================================================

      - name: Android ARM64 compiler smoke test
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$ROOT/compiler-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          int blender_android_test(int x)
          {
              return x + 1;
          }
          EOF

          "$ANDROID_CLANG" \
            --target="$TARGET_TRIPLE" \
            --sysroot="$SYSROOT" \
            -march=armv8-a \
            -fPIC \
            -O2 \
            -c \
            "$TEST_DIR/test.c" \
            -o \
            "$TEST_DIR/test.o"

          file "$TEST_DIR/test.o"

          readelf -h "$TEST_DIR/test.o" |
            grep -E \
              "Class:.*ELF64|Machine:.*AArch64"

          echo
          echo "Android ARM64 compiler smoke test PASSED."

      # ============================================================
      # PACKAGE FINAL LLVM + CLANG
      # ============================================================

      - name: Create final Android LLVM Clang prefix
        shell: bash
        run: |
          set -euxo pipefail

          FINAL="$ROOT/final-prefix"

          rm -rf "$FINAL"

          mkdir -p "$FINAL"

          cp -a \
            "$TARGET_LLVM_INSTALL/." \
            "$FINAL/"

          cp -a \
            "$TARGET_CLANG_INSTALL/." \
            "$FINAL/"

          echo
          echo "========== Final prefix =========="

          find "$FINAL" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            | head -n 1000

      - name: Package final Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$ROOT/final-prefix" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64-full.tar.gz" \
            .

          ls -lh \
            "$ROOT/package/llvm-20.1.8-android-arm64-full.tar.gz"

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload final Android LLVM Clang package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64-full
          path: llvm-android/package/llvm-20.1.8-android-arm64-full.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload Clang logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-clang-build-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
