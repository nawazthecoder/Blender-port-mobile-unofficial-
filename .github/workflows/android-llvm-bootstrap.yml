name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-none-linux-android29"
  HOST_TRIPLE: "x86_64-pc-linux-gnu"

  BUILD_JOBS: "2"

jobs:
  build-llvm-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/host-llvm-install \
            llvm-android/host-clang-install \
            llvm-android/target-install \
            llvm-android/package \
            llvm-android/logs

          echo \
            "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo \
            "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo \
            "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_LLVM_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-llvm-install" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_CLANG_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-clang-install" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-install" \
            >> "$GITHUB_ENV"

          echo \
            "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" \
            >> "$GITHUB_ENV"

          echo \
            "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANG=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANGXX=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            >> "$GITHUB_ENV"

      # ============================================================
      # LLVM SOURCE
      # ============================================================

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo
          echo "=========================================="
          echo " LLVM SOURCE"
          echo "=========================================="

          git -C "$SRC" rev-parse HEAD
          git -C "$SRC" describe --tags --always

      # ============================================================
      # STAGE 1
      # NATIVE HOST LLVM
      # ============================================================

      - name: Configure native host LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_LLVM_INSTALL" \
            \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INCLUDE_UTILS=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-llvm-configure.log"

      - name: Build native LLVM TableGen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target \
              llvm-tblgen \
              llvm-min-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-tblgen-build.log"

      - name: Install native LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-llvm" \
            --target install \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-llvm-install.log"

      - name: Collect native LLVM TableGen
        shell: bash
        run: |
          set -euxo pipefail

          test -x \
            "$BUILD/host-llvm/bin/llvm-tblgen"

          test -x \
            "$BUILD/host-llvm/bin/llvm-min-tblgen"

          cp \
            "$BUILD/host-llvm/bin/llvm-tblgen" \
            "$HOST_TOOLS/llvm-tblgen"

          cp \
            "$BUILD/host-llvm/bin/llvm-min-tblgen" \
            "$HOST_TOOLS/llvm-min-tblgen"

          chmod +x \
            "$HOST_TOOLS/llvm-tblgen" \
            "$HOST_TOOLS/llvm-min-tblgen"

          echo
          echo "========== llvm-tblgen =========="

          file "$HOST_TOOLS/llvm-tblgen"
          "$HOST_TOOLS/llvm-tblgen" --version

          echo
          echo "========== llvm-min-tblgen =========="

          file "$HOST_TOOLS/llvm-min-tblgen"
          "$HOST_TOOLS/llvm-min-tblgen" --version

      # ============================================================
      # STAGE 2
      # NATIVE STANDALONE CLANG
      # ============================================================

      - name: Configure native standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/host-clang"

          test -f \
            "$HOST_LLVM_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/host-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_CLANG_INSTALL" \
            \
            -DLLVM_DIR="$HOST_LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            2>&1 | tee "$LOGS/host-clang-configure.log"

      - name: Verify native Clang TableGen target
        shell: bash
        run: |
          set -euxo pipefail

          ninja \
            -C "$BUILD/host-clang" \
            -t targets \
            > "$ROOT/host-clang-targets.txt"

          grep -q '^clang-tblgen:' \
            "$ROOT/host-clang-targets.txt"

          echo "clang-tblgen target found."

      - name: Build native Clang TableGen
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host-clang" \
            --target clang-tblgen \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/host-clang-tblgen-build.log"

      - name: Collect native Clang TableGen
        shell: bash
        run: |
          set -euxo pipefail

          test -x \
            "$BUILD/host-clang/bin/clang-tblgen"

          cp \
            "$BUILD/host-clang/bin/clang-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          chmod +x \
            "$HOST_TOOLS/clang-tblgen"

          echo
          echo "========== clang-tblgen =========="

          file "$HOST_TOOLS/clang-tblgen"
          "$HOST_TOOLS/clang-tblgen" --version

          echo
          echo "========== Host architecture =========="

          readelf -h "$HOST_TOOLS/clang-tblgen" |
            grep -E "Class:|Machine:"

      # ============================================================
      # STAGE 3
      # ANDROID ARM64 LLVM
      # ============================================================

      - name: Configure Android standalone LLVM
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-llvm"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target-llvm" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE="$HOST_TRIPLE" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_TARGET_ARCH=AArch64 \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN="$HOST_TOOLS/llvm-tblgen" \
            \
            -DLLVM_USE_HOST_TOOLS=ON \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_ENABLE_PIC=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            2>&1 | tee "$LOGS/target-llvm-configure.log"

      - name: Verify Android LLVM configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target-llvm/CMakeCache.txt"

          test -f "$CACHE"

          echo
          echo "========== Android target =========="

          grep -E \
            '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER_TARGET|CMAKE_CXX_COMPILER_TARGET|CMAKE_SYSROOT):' \
            "$CACHE" || true

          echo
          echo "========== LLVM target =========="

          grep -E \
            '^(LLVM_HOST_TRIPLE|LLVM_DEFAULT_TARGET_TRIPLE|LLVM_TARGET_ARCH|LLVM_TARGETS_TO_BUILD|LLVM_NATIVE_TOOL_DIR|LLVM_TABLEGEN|LLVM_INSTALL_TOOLCHAIN_ONLY):' \
            "$CACHE" || true

          echo
          echo "========== Native TableGen =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/llvm-min-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

      - name: Build Android LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-llvm" \
            --target llvm-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-llvm-libraries-build.log"

      - name: Install Android LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/target-llvm" \
            2>&1 | tee "$LOGS/target-llvm-install.log"

      # ============================================================
      # STAGE 4
      # ANDROID STANDALONE CLANG
      # ============================================================

      - name: Configure Android standalone Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target-clang"

          test -f \
            "$TARGET_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          cmake \
            -S "$SRC/clang" \
            -B "$BUILD/target-clang" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DLLVM_DIR="$TARGET_INSTALL/lib/cmake/llvm" \
            -DLLVM_TOOLS_BINARY_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN_EXE="$HOST_TOOLS/llvm-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            \
            -DCLANG_TABLEGEN="$HOST_TOOLS/clang-tblgen" \
            \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DCLANG_ENABLE_LIBXML2=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            2>&1 | tee "$LOGS/target-clang-configure.log"

      - name: Verify standalone Android Clang targets
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Android Clang targets =========="

          ninja \
            -C "$BUILD/target-clang" \
            -t targets \
            > "$ROOT/target-clang-targets.txt"

          grep -q '^clang-tblgen:' \
            "$ROOT/target-clang-targets.txt"

          grep -q '^clang-headers:' \
            "$ROOT/target-clang-targets.txt"

          grep -q '^clang-libraries:' \
            "$ROOT/target-clang-targets.txt"

          grep -q '^install-clang-headers:' \
            "$ROOT/target-clang-targets.txt"

          grep -q '^install-clang-libraries:' \
            "$ROOT/target-clang-targets.txt"

          echo "clang-tblgen: OK"
          echo "clang-headers: OK"
          echo "clang-libraries: OK"
          echo "install-clang-headers: OK"
          echo "install-clang-libraries: OK"

      - name: Build Android Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-clang" \
            --target clang-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-clang-libraries-build.log"

      - name: Install Android Clang headers
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-clang" \
            --target install-clang-headers \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-clang-headers-install.log"

      - name: Install Android Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target-clang" \
            --target install-clang-libraries \
            -j "$BUILD_JOBS" \
            2>&1 | tee "$LOGS/target-clang-libraries-install.log"

      - name: Install remaining Clang files
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/target-clang" \
            2>&1 | tee "$LOGS/target-clang-final-install.log"

      # ============================================================
      # VERIFY CLANG HEADERS
      # ============================================================

      - name: Verify Clang public headers
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            "$TARGET_INSTALL/include/clang"

          test -d \
            "$TARGET_INSTALL/include/clang/AST"

          test -f \
            "$TARGET_INSTALL/include/clang/AST/AST.h"

          test -f \
            "$TARGET_INSTALL/include/clang/AST/ASTContext.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Basic/Version.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Basic/SourceLocation.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Lex/Lexer.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Sema/Sema.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Frontend/CompilerInstance.h"

          echo
          echo "PASS: Clang public headers installed."

      # ============================================================
      # VERIFY LLVM HEADERS
      # ============================================================

      - name: Verify LLVM public headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/include/llvm/IR/Module.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/Support/Error.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/ADT/StringRef.h"

          echo "PASS: LLVM public headers installed."

      # ============================================================
      # VERIFY RESOURCE HEADERS
      # ============================================================

      - name: Verify Clang resource headers
        shell: bash
        run: |
          set -euxo pipefail

          RESOURCE_DIR="$TARGET_INSTALL/lib/clang/20/include"

          test -d \
            "$RESOURCE_DIR"

          test -f \
            "$RESOURCE_DIR/stddef.h"

          test -f \
            "$RESOURCE_DIR/stdarg.h"

          echo "PASS: Clang resource headers installed."

      # ============================================================
      # VERIFY LLVM CMAKE CONFIG
      # ============================================================

      - name: Verify LLVM CMake package
        shell: bash
        run: |
          set -euxo pipefail

          LLVM_CONFIG="$(
            find "$TARGET_INSTALL" \
              -type f \
              -name LLVMConfig.cmake \
              -print \
              -quit
          )"

          test -n "$LLVM_CONFIG"

          echo "FOUND:"
          echo "$LLVM_CONFIG"

      # ============================================================
      # VERIFY CLANG CMAKE CONFIG
      # ============================================================

      - name: Verify Clang CMake package
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_CONFIG="$(
            find "$TARGET_INSTALL" \
              -type f \
              -name ClangConfig.cmake \
              -print \
              -quit
          )"

          test -n "$CLANG_CONFIG"

          echo "FOUND:"
          echo "$CLANG_CONFIG"

      # ============================================================
      # SHOW LIBRARIES
      # ============================================================

      - name: Show installed LLVM libraries
        shell: bash
        run: |
          set -eux

          echo "========== LLVM libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libLLVM*.a' \
            -print \
            | sort

      - name: Show installed Clang libraries
        shell: bash
        run: |
          set -eux

          echo "========== Clang libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libclang*.a' \
            -print \
            | sort

      # ============================================================
      # ARM64 VERIFICATION
      # ============================================================

      - name: Verify Android ARM64 LLVM and Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                -quit
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: no object files found in:"
              echo "$archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "========== $name =========="

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            echo "PASS: $name is ELF64 AArch64."

            rm -rf "$tmp"
          }

          check_archive \
            "$TARGET_INSTALL/lib/libLLVMCore.a" \
            "LLVMCore"

          check_archive \
            "$TARGET_INSTALL/lib/libLLVMSupport.a" \
            "LLVMSupport"

          check_archive \
            "$TARGET_INSTALL/lib/libclangBasic.a" \
            "clangBasic"

          check_archive \
            "$TARGET_INSTALL/lib/libclangAST.a" \
            "clangAST"

          echo
          echo "=========================================="
          echo " Android ARM64 LLVM/Clang libraries OK"
          echo "=========================================="

      # ============================================================
      # NDK COMPILER SMOKE TEST
      # ============================================================

      - name: Android ARM64 compiler smoke test
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$ROOT/compiler-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          int blender_android_test(int x)
          {
              return x + 1;
          }
          EOF

          "$ANDROID_CLANG" \
            --target="$TARGET_TRIPLE" \
            --sysroot="$SYSROOT" \
            -march=armv8-a \
            -fPIC \
            -O2 \
            -c \
            "$TEST_DIR/test.c" \
            -o \
            "$TEST_DIR/test.o"

          echo
          echo "========== Compiler output =========="

          file "$TEST_DIR/test.o"

          readelf -h "$TEST_DIR/test.o" |
            grep -E \
              "Class:.*ELF64|Machine:.*AArch64"

          echo
          echo "Android ARM64 compiler smoke test PASSED."

      # ============================================================
      # FINAL TREE
      # ============================================================

      - name: Show final installation
        shell: bash
        run: |
          set -eux

          find "$TARGET_INSTALL" \
            -maxdepth 5 \
            -type f \
            -print \
            | sort \
            > "$ROOT/final-files.txt"

          cat "$ROOT/final-files.txt"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_INSTALL" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64.tar.gz" \
            .

      - name: Package native TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/llvm-20.1.8-host-tablegen.tar.gz" \
            .

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload Android LLVM Clang package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: llvm-android/package/llvm-20.1.8-android-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload native TableGen package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-host-tablegen
          path: llvm-android/package/llvm-20.1.8-host-tablegen.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload LLVM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
