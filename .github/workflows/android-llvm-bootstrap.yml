
name: Android ARM64 - LLVM Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "llvmorg-20.1.8"

  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  TARGET_TRIPLE: "aarch64-none-linux-android29"
  HOST_TRIPLE: "x86_64-pc-linux-gnu"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-llvm-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # HOST TOOLS
      # ============================================================

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            python3 \
            file \
            binutils \
            lld

      # ============================================================
      # ANDROID SDK / NDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf llvm-android

          mkdir -p \
            llvm-android/src \
            llvm-android/build \
            llvm-android/host-tools \
            llvm-android/host-install \
            llvm-android/target-install \
            llvm-android/package \
            llvm-android/logs

          echo \
            "ROOT=$GITHUB_WORKSPACE/llvm-android" \
            >> "$GITHUB_ENV"

          echo \
            "SRC=$GITHUB_WORKSPACE/llvm-android/src/llvm-project" \
            >> "$GITHUB_ENV"

          echo \
            "BUILD=$GITHUB_WORKSPACE/llvm-android/build" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_TOOLS=$GITHUB_WORKSPACE/llvm-android/host-tools" \
            >> "$GITHUB_ENV"

          echo \
            "HOST_INSTALL=$GITHUB_WORKSPACE/llvm-android/host-install" \
            >> "$GITHUB_ENV"

          echo \
            "TARGET_INSTALL=$GITHUB_WORKSPACE/llvm-android/target-install" \
            >> "$GITHUB_ENV"

          echo \
            "LOGS=$GITHUB_WORKSPACE/llvm-android/logs" \
            >> "$GITHUB_ENV"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo \
            "SYSROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANG=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_CLANGXX=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            >> "$GITHUB_ENV"

      # ============================================================
      # LLVM SOURCE
      # ============================================================

      - name: Download LLVM source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SRC"

          echo
          echo "========== LLVM SOURCE =========="

          git -C "$SRC" rev-parse HEAD

          git -C "$SRC" describe --tags --always

      # ============================================================
      # STAGE 1
      #
      # Build the native host TableGen executables.
      #
      # These run on GitHub's Ubuntu x86_64 machine.
      # ============================================================

      - name: Configure native host LLVM
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/host" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_INSTALL" \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            2>&1 | tee "$LOGS/host-configure.log"

      - name: Build native TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/host" \
            --target \
              llvm-tblgen \
              clang-tblgen \
            -j 2 \
            2>&1 | tee "$LOGS/host-build.log"

      - name: Verify native TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$BUILD/host/bin/llvm-tblgen"
          test -x "$BUILD/host/bin/clang-tblgen"

          cp \
            "$BUILD/host/bin/llvm-tblgen" \
            "$HOST_TOOLS/llvm-tblgen"

          cp \
            "$BUILD/host/bin/clang-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          chmod +x \
            "$HOST_TOOLS/llvm-tblgen" \
            "$HOST_TOOLS/clang-tblgen"

          echo
          echo "========== llvm-tblgen =========="

          file "$HOST_TOOLS/llvm-tblgen"

          "$HOST_TOOLS/llvm-tblgen" --version

          echo
          echo "========== clang-tblgen =========="

          file "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/clang-tblgen" --version

          echo
          echo "========== Host architecture =========="

          readelf -h "$HOST_TOOLS/llvm-tblgen" |
            grep -E "Class:|Machine:"

          readelf -h "$HOST_TOOLS/clang-tblgen" |
            grep -E "Class:|Machine:"

      # ============================================================
      # STAGE 2
      #
      # Configure LLVM + Clang for Android ARM64.
      #
      # Only libraries/headers are wanted.
      # Development executables such as bugpoint are disabled.
      # ============================================================

      - name: Configure Android ARM64 LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/target"

          cmake \
            -S "$SRC/llvm" \
            -B "$BUILD/target" \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TARGET_INSTALL" \
            \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            \
            -DCMAKE_C_COMPILER="$ANDROID_CLANG" \
            -DCMAKE_CXX_COMPILER="$ANDROID_CLANGXX" \
            \
            -DCMAKE_C_COMPILER_TARGET="$TARGET_TRIPLE" \
            -DCMAKE_CXX_COMPILER_TARGET="$TARGET_TRIPLE" \
            \
            -DCMAKE_SYSROOT="$SYSROOT" \
            \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            \
            -DLLVM_HOST_TRIPLE="$HOST_TRIPLE" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_TABLEGEN="$HOST_TOOLS/llvm-tblgen" \
            -DCLANG_TABLEGEN="$HOST_TOOLS/clang-tblgen" \
            \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_ENABLE_PIC=ON \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TOOLS=OFF \
            \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            2>&1 | tee "$LOGS/android-configure.log"

      # ============================================================
      # CONFIGURATION CHECK
      # ============================================================

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euxo pipefail

          CACHE="$BUILD/target/CMakeCache.txt"

          test -f "$CACHE"

          echo
          echo "========== Android target =========="

          grep -E \
            '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER_TARGET|CMAKE_CXX_COMPILER_TARGET|CMAKE_SYSROOT):' \
            "$CACHE" || true

          echo
          echo "========== LLVM target =========="

          grep -E \
            '^(LLVM_HOST_TRIPLE|LLVM_DEFAULT_TARGET_TRIPLE|LLVM_TARGETS_TO_BUILD|LLVM_NATIVE_TOOL_DIR|LLVM_TABLEGEN|CLANG_TABLEGEN):' \
            "$CACHE" || true

          echo
          echo "========== Build suppression =========="

          grep -E \
            '^(LLVM_BUILD_TOOLS|LLVM_INCLUDE_TOOLS|CLANG_BUILD_TOOLS|LLVM_BUILD_TESTS|LLVM_INCLUDE_TESTS|CLANG_INCLUDE_TESTS|LLVM_BUILD_UTILS|LLVM_INCLUDE_UTILS):' \
            "$CACHE" || true

          echo
          echo "========== Native TableGen =========="

          test -x "$HOST_TOOLS/llvm-tblgen"
          test -x "$HOST_TOOLS/clang-tblgen"

          "$HOST_TOOLS/llvm-tblgen" --version
          "$HOST_TOOLS/clang-tblgen" --version

      # ============================================================
      # BUILD LLVM
      #
      # Use LLVM's aggregate llvm-libraries target.
      # ============================================================

      - name: Build LLVM libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target llvm-libraries \
            -j 2 \
            2>&1 | tee "$LOGS/llvm-libraries-build.log"

      # ============================================================
      # BUILD CLANG
      #
      # IMPORTANT:
      # Use the aggregate clang-libraries target.
      #
      # Do NOT use individual names such as clangBasic.
      # ============================================================

      - name: Build Clang libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target clang-libraries \
            -j 2 \
            2>&1 | tee "$LOGS/clang-libraries-build.log"

      # ============================================================
      # INSTALL
      #
      # Normal LLVM install target installs:
      #   LLVM headers
      #   Clang headers
      #   Resource headers
      #   LLVM libraries
      #   Clang libraries
      #   CMake package files
      #
      # No LLVM distribution-components machinery is used.
      # ============================================================

      - name: Install Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$BUILD/target" \
            --target install \
            -j 2 \
            2>&1 | tee "$LOGS/android-install.log"

      # ============================================================
      # VERIFY TARGETS
      # ============================================================

      - name: Verify library aggregate targets
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Checking CMake targets =========="

          ninja \
            -C "$BUILD/target" \
            -t targets \
            | grep -E '^llvm-libraries:' \
            > /dev/null

          ninja \
            -C "$BUILD/target" \
            -t targets \
            | grep -E '^clang-libraries:' \
            > /dev/null

          echo "llvm-libraries target exists."
          echo "clang-libraries target exists."

      # ============================================================
      # VERIFY NO HOST-STYLE ANDROID EXECUTABLES
      # ============================================================

      - name: Verify unwanted target executables
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Unwanted executable check =========="

          unwanted=(
            bugpoint
            llvm-as
            llvm-bcanalyzer
            llvm-config
            llvm-dis
            llvm-link
            opt
            clang
            clang++
            clang-format
            clangd
          )

          for tool in "${unwanted[@]}"; do
            if [ -e "$BUILD/target/bin/$tool" ]; then
              echo "ERROR: unwanted Android executable was built: $tool"
              exit 1
            fi
          done

          echo "PASS: no unwanted LLVM/Clang executables were generated."

      # ============================================================
      # VERIFY HEADERS
      # ============================================================

      - name: Verify LLVM headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/include/llvm/IR/Module.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/Support/Error.h"

          test -f \
            "$TARGET_INSTALL/include/llvm/ADT/StringRef.h"

          echo "LLVM headers OK."

      - name: Verify Clang headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/include/clang/AST/AST.h"

          test -f \
            "$TARGET_INSTALL/include/clang/Basic/Version.h"

          echo "Clang headers OK."

      # ============================================================
      # VERIFY CMAKE PACKAGES
      # ============================================================

      - name: Verify LLVM CMake package
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/lib/cmake/llvm/LLVMConfig.cmake"

          echo "LLVMConfig.cmake OK."

      - name: Verify Clang CMake package
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "$TARGET_INSTALL/lib/cmake/clang/ClangConfig.cmake"

          echo "ClangConfig.cmake OK."

      # ============================================================
      # SHOW LIBRARIES
      # ============================================================

      - name: Show installed LLVM libraries
        shell: bash
        run: |
          set -eux

          echo "========== LLVM libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libLLVM*.a' \
            -print \
            | sort

          echo
          echo "========== Clang libraries =========="

          find "$TARGET_INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libclang*.a' \
            -print \
            | sort

      # ============================================================
      # VERIFY ARM64 OBJECTS
      # ============================================================

      - name: Verify Android ARM64 LLVM and Clang
        shell: bash
        run: |
          set -euxo pipefail

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                -quit
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: no object files found in $archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "========== $name =========="

            readelf -h "$obj" |
              grep -E \
                "Class:.*ELF64|Machine:.*AArch64"

            echo "PASS: $name is ELF64 AArch64"

            rm -rf "$tmp"
          }

          check_archive \
            "$TARGET_INSTALL/lib/libLLVMCore.a" \
            "LLVMCore"

          check_archive \
            "$TARGET_INSTALL/lib/libLLVMSupport.a" \
            "LLVMSupport"

          check_archive \
            "$TARGET_INSTALL/lib/libclangBasic.a" \
            "clangBasic"

          check_archive \
            "$TARGET_INSTALL/lib/libclangAST.a" \
            "clangAST"

          echo
          echo "=========================================="
          echo " Android ARM64 LLVM/Clang verification OK"
          echo "=========================================="

      # ============================================================
      # ANDROID COMPILER SMOKE TEST
      # ============================================================

      - name: Android ARM64 compiler smoke test
        shell: bash
        run: |
          set -euxo pipefail

          TEST_DIR="$ROOT/compiler-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          int blender_android_test(int x)
          {
              return x + 1;
          }
          EOF

          "$ANDROID_CLANG" \
            --target="$TARGET_TRIPLE" \
            --sysroot="$SYSROOT" \
            -march=armv8-a \
            -fPIC \
            -O2 \
            -c \
            "$TEST_DIR/test.c" \
            -o \
            "$TEST_DIR/test.o"

          echo
          echo "========== Compiler output =========="

          file "$TEST_DIR/test.o"

          readelf -h "$TEST_DIR/test.o" |
            grep -E \
              "Class:.*ELF64|Machine:.*AArch64"

          echo
          echo "Android ARM64 compiler smoke test PASSED."

      # ============================================================
      # FINAL FILE TREE
      # ============================================================

      - name: Show final install tree
        shell: bash
        run: |
          set -eux

          echo "========== FINAL LLVM INSTALL =========="

          find "$TARGET_INSTALL" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            > "$ROOT/final-files.txt"

          cat "$ROOT/final-files.txt"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Android LLVM Clang
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$TARGET_INSTALL" \
            -czf \
            "$ROOT/package/llvm-20.1.8-android-arm64.tar.gz" \
            .

      - name: Package host TableGen
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$HOST_TOOLS" \
            -czf \
            "$ROOT/package/llvm-20.1.8-host-tablegen.tar.gz" \
            .

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload Android LLVM package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: llvm-android/package/llvm-20.1.8-android-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload host TableGen package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-20.1.8-host-tablegen
          path: llvm-android/package/llvm-20.1.8-host-tablegen.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload LLVM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-logs
          path: llvm-android/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
