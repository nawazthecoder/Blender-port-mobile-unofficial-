name: Android LLVM/Clang Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "20.1.8"
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_ABI: "arm64-v8a"
  TARGET_TRIPLE: "aarch64-linux-android29"

jobs:
  build-llvm-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            cmake \
            python3 \
            git \
            build-essential \
            binutils \
            file

      - name: Download LLVM ${LLVM_VERSION}
        shell: bash
        run: |
          set -eux

          rm -rf llvm-project

          git clone \
            --depth 1 \
            --branch "llvmorg-${LLVM_VERSION}" \
            https://github.com/llvm/llvm-project.git

          test -f llvm-project/llvm/CMakeLists.txt
          test -f llvm-project/clang/CMakeLists.txt

      # ------------------------------------------------------------
      # HOST LLVM TOOLS
      #
      # These tools execute on the GitHub runner itself.
      # The Android LLVM build uses them while generating target code.
      # ------------------------------------------------------------

      - name: Configure native host LLVM tools
        shell: bash
        run: |
          set -eux

          cmake \
            -S llvm-project/llvm \
            -B build/llvm-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/llvm-host-install" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DCLANG_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF

      - name: Build native host TableGen tools
        shell: bash
        run: |
          set -eux

          cmake --build build/llvm-host \
            --target llvm-tblgen clang-tblgen \
            --parallel "$(nproc)"

          test -x build/llvm-host/bin/llvm-tblgen
          test -x build/llvm-host/bin/clang-tblgen

          file build/llvm-host/bin/llvm-tblgen
          file build/llvm-host/bin/clang-tblgen

      # ------------------------------------------------------------
      # ANDROID LLVM / CLANG
      # ------------------------------------------------------------

      - name: Configure LLVM/Clang for Android ARM64
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_NDK_ROOT"
          INSTALL="$GITHUB_WORKSPACE/llvm-android-install"
          HOST_TOOLS="$GITHUB_WORKSPACE/build/llvm-host/bin"

          rm -rf build/llvm-android
          rm -rf "$INSTALL"

          cmake \
            -S llvm-project/llvm \
            -B build/llvm-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_TOOLS" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_HOST_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DLLVM_BUILD_TOOLS=ON \
            -DCLANG_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF

      - name: Build LLVM/Clang for Android ARM64
        shell: bash
        run: |
          set -eux

          cmake --build build/llvm-android \
            --parallel "$(nproc)"

      - name: Install LLVM/Clang for Android ARM64
        shell: bash
        run: |
          set -eux

          cmake --build build/llvm-android --target install

      # ------------------------------------------------------------
      # VERIFICATION
      # ------------------------------------------------------------

      - name: Verify LLVM / Clang installation
        shell: bash
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/llvm-android-install"

          echo "=========================================="
          echo " Verifying LLVM / Clang Installation"
          echo "=========================================="

          echo ""
          echo "LLVM headers:"
          test -f "$INSTALL/include/llvm/IR/Module.h"
          test -f "$INSTALL/include/llvm/Support/Error.h"
          test -f "$INSTALL/include/llvm/ADT/StringRef.h"

          echo "Clang headers:"
          test -f "$INSTALL/include/clang/Basic/Version.h"
          test -f "$INSTALL/include/clang/AST/ASTContext.h"
          test -f "$INSTALL/include/clang/Frontend/CompilerInstance.h"

          echo ""
          echo "CMake package files:"
          test -f "$INSTALL/lib/cmake/llvm/LLVMConfig.cmake"
          test -f "$INSTALL/lib/cmake/clang/ClangConfig.cmake"

          echo ""
          echo "LLVM libraries:"
          find "$INSTALL/lib" -maxdepth 1 -type f -name 'libLLVM*.a' -print | head -20

          LLVM_ARCHIVE="$(find "$INSTALL/lib" -maxdepth 1 -type f -name 'libLLVM*.a' | head -n 1)"

          test -n "$LLVM_ARCHIVE"
          test -f "$LLVM_ARCHIVE"

          echo ""
          echo "Checking target architecture in:"
          echo "$LLVM_ARCHIVE"

          rm -rf verify-llvm
          mkdir -p verify-llvm

          FIRST_OBJECT="$(
            ar t "$LLVM_ARCHIVE" | head -n 1
          )"

          test -n "$FIRST_OBJECT"

          cd verify-llvm
          ar x "$LLVM_ARCHIVE" "$FIRST_OBJECT"

          echo ""
          echo "Extracted object:"
          ls -l

          readelf -h "$FIRST_OBJECT" | tee elf-header.txt

          grep -q "AArch64" elf-header.txt

          cd ..

          echo ""
          echo "Host TableGen tools:"
          test -x build/llvm-host/bin/llvm-tblgen
          test -x build/llvm-host/bin/clang-tblgen

          build/llvm-host/bin/llvm-tblgen --version
          build/llvm-host/bin/clang-tblgen --version

          echo ""
          echo "LLVM installed successfully."
          echo "Target: AArch64 Android"
          echo "API: ${ANDROID_API}"
          echo "LLVM: ${LLVM_VERSION}"

      # ------------------------------------------------------------
      # ANDROID COMPILER SMOKE TEST
      # ------------------------------------------------------------

      - name: Verify Android NDK compiler
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_NDK_ROOT"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET_TRIPLE}-clang"

          test -x "$CLANG"

          echo "Using:"
          echo "$CLANG"

          "$CLANG" --version

          cat > android-smoke.c <<'EOF'
          int android_llvm_smoke_test(void)
          {
              return 42;
          }
          EOF

          "$CLANG" \
            -fPIC \
            -c android-smoke.c \
            -o android-smoke.o

          file android-smoke.o

          readelf -h android-smoke.o | grep AArch64

          echo "Android ARM64 compiler smoke test passed."

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------

      - name: Package LLVM Android bundle
        shell: bash
        run: |
          set -eux

          tar \
            -C "$GITHUB_WORKSPACE" \
            -czf llvm-android-${LLVM_VERSION}-arm64-v8a.tar.gz \
            llvm-android-install

      - name: Upload LLVM Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: llvm-android-${{ env.LLVM_VERSION }}-arm64-v8a
          path: llvm-android-${{ env.LLVM_VERSION }}-arm64-v8a.tar.gz
          if-no-files-found: error
          retention-days: 7
