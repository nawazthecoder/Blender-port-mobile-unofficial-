
name: Blender 5.2.2 Android - Python Bootstrap

on:
  workflow_dispatch:

jobs:
  python-bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "=== SYSTEM ==="
          uname -a

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h /

      - name: Check Android toolchain
        run: |
          set -eux

          NDK="$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$NDK"
          test -x "$TOOLCHAIN/bin/clang"

          echo "=== NDK ==="
          cat "$NDK/source.properties"

          echo
          echo "=== CLANG ==="
          "$TOOLCHAIN/bin/clang" --version

          echo
          echo "=== ARM64 TARGET ==="

          "$TOOLCHAIN/bin/clang" \
            --target=aarch64-linux-android29 \
            -### \
            -x c \
            -c /dev/null \
            -o /tmp/test.o

          echo
          echo "Android ARM64 compiler: OK"

      - name: Check build tools
        run: |
          set -eux

          cmake --version
          ninja --version
          python3 --version
          git --version
          curl --version | head -1
          tar --version | head -1
          unzip -v | head -2

      - name: Download Blender 5.2.2
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/blender-source"

          cd "$GITHUB_WORKSPACE/blender-source"

          curl -L \
            --fail \
            --retry 3 \
            "https://download.blender.org/source/blender-5.2.2.tar.xz" \
            -o blender-5.2.2.tar.xz

          test -f blender-5.2.2.tar.xz

          tar -xf blender-5.2.2.tar.xz

          test -d blender-5.2.2

      - name: Determine Blender Python version
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/blender-source/blender-5.2.2"

          echo "=== Blender Python version ==="

          PYTHON_VERSION="$(
            sed -n \
              's/^set(PYTHON_VERSION[[:space:]]*\([0-9.]*\)).*/\1/p' \
              "$SOURCE/build_files/build_environment/cmake/versions.cmake" \
              | head -1
          )"

          if [ -z "$PYTHON_VERSION" ]; then
            echo "ERROR: Could not determine Blender Python version."
            exit 1
          fi

          echo "Blender Python version: $PYTHON_VERSION"

          echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"

      - name: Clone matching CPython
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf cpython

          git clone \
            --depth 1 \
            --branch "v${PYTHON_VERSION}" \
            https://github.com/python/cpython.git \
            cpython

          cd cpython

          echo "=== CPython version ==="
          git describe --tags --always

          echo
          echo "=== Android build system ==="

          test -d Android
          test -f Android/android.py
          test -f Android/README.md

          echo "CPython Android source: OK"

      # ================================================================
      # STEP 1: Build Python for the GitHub runner.
      # ================================================================

      - name: CPython configure-build
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          echo "=========================================="
          echo " CPython configure-build"
          echo "=========================================="

          python3 Android/android.py configure-build

          echo
          echo "=== BUILD DIRECTORY ==="

          test -d cross-build/build

          ls -la cross-build/build

      - name: CPython make-build
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          echo "=========================================="
          echo " CPython make-build"
          echo "=========================================="

          python3 Android/android.py make-build

          echo
          echo "=== BUILD PYTHON ==="

          test -x cross-build/build/python

          cross-build/build/python --version

      # ================================================================
      # STEP 2: Configure CPython for Android ARM64.
      # ================================================================

      - name: CPython configure-host
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          HOST="aarch64-linux-android"

          echo "=========================================="
          echo " CPython configure-host"
          echo " Target: $HOST"
          echo "=========================================="

          python3 Android/android.py configure-host "$HOST"

          echo
          echo "=== HOST DIRECTORY ==="

          test -d "cross-build/$HOST"

          ls -la "cross-build/$HOST"

      # ================================================================
      # STEP 3: Build Android ARM64 Python.
      # ================================================================

      - name: CPython make-host
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          HOST="aarch64-linux-android"

          echo "=========================================="
          echo " CPython make-host"
          echo " Target: $HOST"
          echo "=========================================="

          python3 Android/android.py make-host "$HOST"

      # ================================================================
      # Verify output.
      # ================================================================

      - name: Verify Android Python
        run: |
          set -eux

          HOST="aarch64-linux-android"

          PYTHON_DIR="$GITHUB_WORKSPACE/cpython/cross-build/$HOST"
          PREFIX="$PYTHON_DIR/prefix"

          echo "=========================================="
          echo " VERIFY ANDROID PYTHON"
          echo "=========================================="

          test -d "$PYTHON_DIR"
          test -d "$PREFIX"

          echo
          echo "=== Python.h ==="

          PYTHON_HEADER="$(
            find "$PREFIX" \
              -name Python.h \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_HEADER" ]; then
            echo "ERROR: Python.h not found."
            exit 1
          fi

          echo "FOUND:"
          echo "$PYTHON_HEADER"

          echo
          echo "=== libpython ==="

          PYTHON_LIBRARY="$(
            find "$PREFIX" \
              -type f \
              \( \
                -name 'libpython*.so' \
                -o \
                -name 'libpython*.a' \
              \) \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_LIBRARY" ]; then
            echo "ERROR: libpython not found."
            exit 1
          fi

          echo "FOUND:"
          echo "$PYTHON_LIBRARY"

          echo
          echo "=== PREFIX SIZE ==="

          du -sh "$PREFIX"

          echo
          echo "=== PREFIX ==="

          find "$PREFIX" -maxdepth 2 -type d | head -100

      - name: Package Android Python
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          HOST="aarch64-linux-android"

          python3 Android/android.py package "$HOST"

          echo
          echo "=== PACKAGE ==="

          find \
            "cross-build/$HOST/dist" \
            -maxdepth 2 \
            -type f \
            -print

      - name: Upload Android Python
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PYTHON_VERSION }}-android-arm64
          path: |
            cpython/cross-build/aarch64-linux-android/prefix
            cpython/cross-build/aarch64-linux-android/dist
          if-no-files-found: error

      - name: Bootstrap complete
        if: success()
        run: |
          echo
          echo "=========================================="
          echo " Android Python Bootstrap Complete"
          echo "=========================================="
          echo
          echo "Python version: $PYTHON_VERSION"
          echo "Target: aarch64-linux-android"
          echo "Python.h: FOUND"
          echo "libpython: FOUND"
          echo
          echo "Next stage:"
          echo "Connect Android Python to Blender 5.2.2"
          echo "=========================================="
