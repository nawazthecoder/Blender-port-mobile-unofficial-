name: Blender 5.2.2 Android - Python Bootstrap

on:
  workflow_dispatch:

jobs:
  python-bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "=== SYSTEM ==="
          uname -a

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h /

      - name: Check Android toolchain
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          NDK="$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$NDK"
          test -x "$TOOLCHAIN/bin/clang"

          echo
          echo "=== NDK VERSION ==="
          cat "$NDK/source.properties"

          echo
          echo "=== CLANG VERSION ==="
          "$TOOLCHAIN/bin/clang" --version

          echo
          echo "=== ARM64 TARGET TEST ==="

          "$TOOLCHAIN/bin/clang" \
            --target=aarch64-linux-android29 \
            -### \
            -x c \
            -c /dev/null \
            -o /tmp/test.o

          echo
          echo "Android ARM64 compiler: OK"

      - name: Check Java
        run: |
          set -eux

          java -version

      - name: Check build tools
        run: |
          set -eux

          cmake --version
          ninja --version
          python3 --version
          git --version
          curl --version | head -1

      - name: Determine Blender Python version
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/blender-source"

          cd "$GITHUB_WORKSPACE/blender-source"

          curl -L \
            --fail \
            --retry 3 \
            "https://download.blender.org/source/blender-5.2.2.tar.xz" \
            -o blender-5.2.2.tar.xz

          tar -xf blender-5.2.2.tar.xz

          SOURCE="$GITHUB_WORKSPACE/blender-source/blender-5.2.2"

          test -d "$SOURCE"

          echo "Blender source located at:"
          echo "$SOURCE"

          PYTHON_VERSION="$(
            sed -n \
              's/^set(PYTHON_VERSION[[:space:]]*\([0-9.]*\)).*/\1/p' \
              "$SOURCE/build_files/build_environment/cmake/versions.cmake" \
              | head -1
          )"

          if [ -z "$PYTHON_VERSION" ]; then
            echo "Could not determine Blender Python version."
            exit 1
          fi

          echo
          echo "Blender Python version:"
          echo "$PYTHON_VERSION"

          echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"

      - name: Clone CPython source
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf cpython

          git clone \
            --depth 1 \
            --branch "v${PYTHON_VERSION}" \
            https://github.com/python/cpython.git \
            cpython

          cd cpython

          echo
          echo "=== CPYTHON VERSION ==="
          git describe --tags --always

          echo
          echo "=== ANDROID SOURCE ==="

          test -f Platforms/Android/README.md
          test -f Platforms/Android/__main__.py

          echo "Platforms/Android found."

      - name: Inspect CPython Android build system
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          echo "=== Platforms/Android ==="
          ls -la Platforms/Android

          echo
          echo "=== BUILD HELP ==="
          python3 Platforms/Android build --help

          echo
          echo "=== HOST HELP ==="
          python3 Platforms/Android configure-host --help

      - name: Build CPython for Android ARM64
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          HOST="aarch64-linux-android"

          echo "=========================================="
          echo " Building CPython $PYTHON_VERSION"
          echo " Target: $HOST"
          echo "=========================================="

          python3 Platforms/Android build "$HOST"

      - name: Verify Android Python
        run: |
          set -eux

          PYTHON_DIR="$GITHUB_WORKSPACE/cpython/cross-build/aarch64-linux-android"
          PREFIX="$PYTHON_DIR/prefix"

          echo "Android Python directory:"
          echo "$PYTHON_DIR"

          test -d "$PYTHON_DIR"
          test -d "$PREFIX"

          echo
          echo "=== PYTHON.H ==="

          PYTHON_HEADER="$(
            find "$PREFIX" \
              -name Python.h \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_HEADER" ]; then
            echo "ERROR: Python.h was not produced."
            exit 1
          fi

          echo "FOUND:"
          echo "$PYTHON_HEADER"

          echo
          echo "=== PYTHON LIBRARY ==="

          PYTHON_LIBRARY="$(
            find "$PREFIX" \
              -type f \
              \( \
                -name 'libpython*.so' \
                -o \
                -name 'libpython*.a' \
              \) \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_LIBRARY" ]; then
            echo "ERROR: libpython was not produced."
            exit 1
          fi

          echo "FOUND:"
          echo "$PYTHON_LIBRARY"

          echo
          echo "=== PREFIX SIZE ==="
          du -sh "$PREFIX"

          echo
          echo "=== PREFIX CONTENTS ==="
          find "$PREFIX" -maxdepth 2 -type d | head -80

      - name: Package Android Python
        if: success()
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          python3 Platforms/Android package aarch64-linux-android

          echo
          echo "=== DISTRIBUTION ==="

          find \
            "$GITHUB_WORKSPACE/cpython/cross-build/aarch64-linux-android/dist" \
            -maxdepth 2 \
            -type f \
            -print \
            | head -100

      - name: Upload Android Python
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PYTHON_VERSION }}-android-arm64
          path: |
            cpython/cross-build/aarch64-linux-android/prefix
            cpython/cross-build/aarch64-linux-android/dist
          if-no-files-found: error

      - name: Python bootstrap complete
        if: success()
        run: |
          echo
          echo "=========================================="
          echo " Android Python Bootstrap Complete"
          echo "=========================================="
          echo
          echo "Python version:       $PYTHON_VERSION"
          echo "Target:               aarch64-linux-android"
          echo "Python.h:             FOUND"
          echo "libpython:            FOUND"
          echo
          echo "Next stage:"
          echo "Connect Android Python to Blender 5.2.2"
          echo "=========================================="
