name: Blender 5.2.2 Android Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Show runner
        run: |
          echo "=== System ==="
          uname -a
          echo "CPU: $(nproc)"
          free -h
          df -h /

      - name: Check Android toolchain
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          NDK="$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/clang"

          "$TOOLCHAIN/bin/clang" \
            --target=aarch64-linux-android29 \
            --version

          echo "ARM64 Android compiler: OK"

      - name: Check build tools
        run: |
          cmake --version
          ninja --version
          python3 --version
          git --version

      - name: Download Blender 5.2.2
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"

          curl -L --fail --retry 3 \
            "https://download.blender.org/source/blender-5.2.2.tar.xz" \
            -o blender-5.2.2.tar.xz

          tar -xf blender-5.2.2.tar.xz

          test -d blender-5.2.2

          echo "Blender source:"
          pwd
          ls -la blender-5.2.2 | head -40

      - name: Inspect Blender platform structure
        run: |
          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"

          echo "=== Platform CMake files ==="
          find "$SOURCE/build_files/cmake/platform" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          echo
          echo "=== GHOST platform files ==="
          find "$SOURCE/intern/ghost" \
            -type f \
            | grep -E '/(system|window|context)' \
            | head -100 || true

          echo
          echo "=== Android references ==="
          grep -Rni --exclude-dir=.git \
            -E 'ANDROID|Android|ANativeWindow|android_surface|EGL' \
            "$SOURCE/intern/ghost" \
            "$SOURCE/build_files/cmake" \
            | head -100 || true

      - name: Configure Android probe
        continue-on-error: true
        run: |
          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"
          BUILD="$GITHUB_WORKSPACE/build-android-probe"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$BUILD"

          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

          echo
          echo "=== Starting CMake Android probe ==="
          echo

          cmake -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_GHOST_X11=OFF \
            -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_GHOST_SDL=ON \
            -DWITH_HEADLESS=OFF \
            "$SOURCE" \
            2>&1 | tee cmake-probe.log

      - name: Show probe result
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build-android-probe/cmake-probe.log"

          echo "=========================================="
          echo " Android Configure Probe Result"
          echo "=========================================="

          if [ -f "$LOG" ]; then
            echo
            echo "=== Last 200 lines ==="
            tail -200 "$LOG"

            echo
            echo "=== CMake errors ==="
            grep -n -E \
              'CMake Error|error:|Error|FAILED|not found|NOTFOUND|unsupported|Unsupported' \
              "$LOG" \
              | tail -100 || true
          else
            echo "No CMake log was produced."
          fi
