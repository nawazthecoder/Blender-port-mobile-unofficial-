name: Blender 5.2.2 Android - Python Bootstrap

on:
  workflow_dispatch:

jobs:
  python-bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -eux

          echo "=== SYSTEM ==="
          uname -a
          echo "CPU: $(nproc)"
          echo

          echo "=== MEMORY ==="
          free -h
          echo

          echo "=== DISK ==="
          df -h /

      - name: Check Android toolchain
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo

          NDK="$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$NDK"
          test -x "$TOOLCHAIN/bin/clang"

          echo "=== NDK VERSION ==="
          cat "$NDK/source.properties"

          echo
          echo "=== CLANG ==="
          "$TOOLCHAIN/bin/clang" --version

          echo
          echo "=== ARM64 ANDROID TARGET ==="

          "$TOOLCHAIN/bin/clang" \
            --target=aarch64-linux-android29 \
            -### \
            -x c \
            -c /dev/null \
            -o /tmp/test.o

          echo
          echo "Android ARM64 compiler: OK"

      - name: Check Java
        run: |
          set -eux

          java -version

      - name: Determine Blender Python version
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"

          curl -L \
            --fail \
            --retry 3 \
            "https://download.blender.org/source/blender-5.2.2.tar.xz" \
            -o blender-5.2.2.tar.xz

          tar -xf blender-5.2.2.tar.xz

          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"

          echo "Searching Blender 5.2.2 for Python version..."

          PYTHON_VERSION="$(
            sed -n 's/^set(PYTHON_VERSION \([0-9.]*\)).*/\1/p' \
              "$SOURCE/build_files/build_environment/cmake/versions.cmake" \
              | head -1
          )"

          if [ -z "$PYTHON_VERSION" ]; then
            echo "Could not determine Blender Python version."
            exit 1
          fi

          echo "Blender requires Python: $PYTHON_VERSION"

          echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"

      - name: Download matching CPython source
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          PYTHON_FILE="Python-${PYTHON_VERSION}.tar.xz"
          PYTHON_URL="https://www.python.org/ftp/python/${PYTHON_VERSION}/${PYTHON_FILE}"

          echo "Downloading:"
          echo "$PYTHON_URL"

          curl -L \
            --fail \
            --retry 3 \
            "$PYTHON_URL" \
            -o "$PYTHON_FILE"

          test -f "$PYTHON_FILE"

          mkdir -p cpython

          tar -xf "$PYTHON_FILE" \
            -C cpython \
            --strip-components=1

          test -f cpython/Platforms/Android/README.md

          echo
          echo "CPython source:"
          ls -la cpython | head -40

      - name: Check CPython Android build system
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          echo "=== CPython Android files ==="

          ls -la Platforms/Android

          echo
          echo "=== Android build help ==="

          python3 Platforms/Android configure-host --help

      - name: Build CPython for Android ARM64
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/cpython"

          HOST="aarch64-linux-android"

          echo "=========================================="
          echo " Building CPython ${PYTHON_VERSION}"
          echo " Target: ${HOST}"
          echo "=========================================="

          python3 Platforms/Android build "$HOST"

      - name: Verify Android Python
        run: |
          set -eux

          PYTHON_DIR="$GITHUB_WORKSPACE/cpython/cross-build/aarch64-linux-android"

          echo "Looking for Android Python at:"
          echo "$PYTHON_DIR"

          test -d "$PYTHON_DIR"

          echo
          echo "=== PREFIX ==="
          find "$PYTHON_DIR/prefix" -maxdepth 2 -type d | head -50

          echo
          echo "=== PYTHON HEADERS ==="

          find "$PYTHON_DIR/prefix" \
            -name Python.h \
            -print

          PYTHON_HEADER="$(
            find "$PYTHON_DIR/prefix" \
              -name Python.h \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_HEADER" ]; then
            echo "ERROR: Python.h was not produced."
            exit 1
          fi

          echo
          echo "Python.h found:"
          echo "$PYTHON_HEADER"

          echo
          echo "=== PYTHON LIBRARIES ==="

          find "$PYTHON_DIR/prefix/lib" \
            -maxdepth 1 \
            -type f \
            | sort || true

          PYTHON_LIBRARY="$(
            find "$PYTHON_DIR/prefix/lib" \
              -maxdepth 1 \
              -type f \
              \( -name 'libpython*.so' -o -name 'libpython*.a' \) \
              -print \
              | head -1
          )"

          if [ -z "$PYTHON_LIBRARY" ]; then
            echo "ERROR: No libpython library was produced."
            exit 1
          fi

          echo
          echo "Python library found:"
          echo "$PYTHON_LIBRARY"

          echo
          echo "=== PYTHON PREFIX ==="
          du -sh "$PYTHON_DIR/prefix"

      - name: Save Android Python
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PYTHON_VERSION }}-android-arm64
          path: |
            cpython/cross-build/aarch64-linux-android/prefix
          if-no-files-found: error

      - name: Bootstrap complete
        if: success()
        run: |
          echo
          echo "=========================================="
          echo " Android Python Bootstrap Complete"
          echo "=========================================="
          echo
          echo "Blender Python version: $PYTHON_VERSION"
          echo "Android target:        aarch64-linux-android"
          echo "Python.h:              FOUND"
          echo "libpython:             FOUND"
          echo
          echo "Next stage:"
          echo "Connect Android Python to Blender 5.2.2"
          echo "=========================================="
