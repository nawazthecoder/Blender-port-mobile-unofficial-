name: Blender 5.2.2 Android Port Probe

on:
  workflow_dispatch:

jobs:
  android-probe:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Get OUR repository files.
      # ------------------------------------------------------------
      - name: Checkout our port
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Show the build machine.
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          set -eux

          echo "=== SYSTEM ==="
          uname -a
          echo "CPU cores: $(nproc)"
          echo

          echo "=== MEMORY ==="
          free -h
          echo

          echo "=== DISK ==="
          df -h /

      # ------------------------------------------------------------
      # Verify Android NDK and ARM64 compiler.
      # ------------------------------------------------------------
      - name: Check Android toolchain
        run: |
          set -eux

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          NDK="$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$NDK"
          test -x "$TOOLCHAIN/bin/clang"

          echo
          echo "=== NDK VERSION ==="
          cat "$NDK/source.properties"

          echo
          echo "=== CLANG VERSION ==="
          "$TOOLCHAIN/bin/clang" --version

          echo
          echo "=== ARM64 ANDROID TARGET TEST ==="

          "$TOOLCHAIN/bin/clang" \
            --target=aarch64-linux-android29 \
            -### \
            -x c \
            -c /dev/null \
            -o /tmp/test.o

          echo
          echo "ARM64 Android compiler: OK"

      # ------------------------------------------------------------
      # Verify normal build tools.
      # ------------------------------------------------------------
      - name: Check build tools
        run: |
          set -eux

          echo "=== CMAKE ==="
          cmake --version

          echo
          echo "=== NINJA ==="
          ninja --version

          echo
          echo "=== PYTHON ==="
          python3 --version

          echo
          echo "=== GIT ==="
          git --version

      # ------------------------------------------------------------
      # Download official Blender 5.2.2 source.
      # ------------------------------------------------------------
      - name: Download Blender 5.2.2
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"

          curl -L \
            --fail \
            --retry 3 \
            "https://download.blender.org/source/blender-5.2.2.tar.xz" \
            -o blender-5.2.2.tar.xz

          test -f blender-5.2.2.tar.xz

          echo
          echo "Downloaded:"
          ls -lh blender-5.2.2.tar.xz

          tar -xf blender-5.2.2.tar.xz

          test -d blender-5.2.2

          echo
          echo "Blender source:"
          ls -la blender-5.2.2 | head -40

      # ------------------------------------------------------------
      # Copy OUR Android platform file into Blender's source tree.
      # ------------------------------------------------------------
      - name: Install our Android platform file
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"
          OUR_FILE="$GITHUB_WORKSPACE/build_files/cmake/platform/platform_android.cmake"
          DEST="$SOURCE/build_files/cmake/platform/platform_android.cmake"

          test -f "$OUR_FILE"

          mkdir -p "$SOURCE/build_files/cmake/platform"

          cp "$OUR_FILE" "$DEST"

          test -f "$DEST"

          echo "Android platform file installed:"
          echo "$DEST"

      # ------------------------------------------------------------
      # Patch ONLY the actual platform_unix.cmake include.
      #
      # We do not assume Blender's surrounding CMake structure.
      # ------------------------------------------------------------
      - name: Patch Blender platform selection
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"
          CMAKE_FILE="$SOURCE/CMakeLists.txt"

          cp "$CMAKE_FILE" "$CMAKE_FILE.original"

          python3 - "$CMAKE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          target = "include(build_files/cmake/platform/platform_unix.cmake)"

          replacement = """if(ANDROID)
            include(build_files/cmake/platform/platform_android.cmake)
          else()
            include(build_files/cmake/platform/platform_unix.cmake)
          endif()"""

          count = text.count(target)

          print(f"Found platform_unix.cmake include count: {count}")

          if count != 1:
              raise SystemExit(
                  f"Expected exactly 1 platform_unix.cmake include, found {count}"
              )

          text = text.replace(target, replacement, 1)

          path.write_text(text)

          print("Platform selection patched successfully.")
          PY

      # ------------------------------------------------------------
      # Verify the patch before trying CMake.
      # ------------------------------------------------------------
      - name: Verify Android platform integration
        run: |
          set -eux

          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"

          echo "=== OUR ANDROID PLATFORM FILE ==="
          cat \
            "$SOURCE/build_files/cmake/platform/platform_android.cmake"

          echo
          echo "=== ANDROID SELECTION IN CMAKE ==="

          grep -n -A8 -B4 \
            "platform_android.cmake" \
            "$SOURCE/CMakeLists.txt"

          echo
          echo "=== ORIGINAL PLATFORM INCLUDE COUNT ==="

          grep -c \
            "platform_unix.cmake" \
            "$SOURCE/CMakeLists.txt"

      # ------------------------------------------------------------
      # Run CMake.
      #
      # This is still a PROBE.
      # We expect more Android-specific blockers to appear.
      # ------------------------------------------------------------
      - name: Configure Blender for Android
        continue-on-error: true
        run: |
          set -o pipefail

          SOURCE="$GITHUB_WORKSPACE/src/blender-5.2.2"
          BUILD="$GITHUB_WORKSPACE/build-android"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$BUILD"

          echo
          echo "=========================================="
          echo " Blender 5.2.2 Android Configure"
          echo "=========================================="
          echo

          cmake -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_GHOST_X11=OFF \
            -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_GHOST_SDL=OFF \
            -DWITH_HEADLESS=OFF \
            -DWITH_VULKAN_BACKEND=ON \
            -DWITH_OPENGL_BACKEND=OFF \
            -DWITH_LIBS_PRECOMPILED=OFF \
            "$SOURCE" \
            2>&1 | tee cmake-android.log

      # ------------------------------------------------------------
      # Show the important part of the result.
      # ------------------------------------------------------------
      - name: Show configure result
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build-android/cmake-android.log"

          echo
          echo "=========================================="
          echo " ANDROID CONFIGURE RESULT"
          echo "=========================================="

          if [ -f "$LOG" ]; then

            echo
            echo "=== ANDROID PLATFORM MESSAGES ==="

            grep -n -E \
              "Configuring Blender for Android|Android platform configuration loaded|Android ABI|Android API" \
              "$LOG" || true

            echo
            echo "=== ERRORS ==="

            grep -n -E \
              "CMake Error|Could NOT find|NOTFOUND|not found|unsupported|Unsupported|error:" \
              "$LOG" \
              | tail -100 || true

            echo
            echo "=== LAST 250 LINES ==="

            tail -250 "$LOG"

          else
            echo "CMake log was not produced."
          fi

      # ------------------------------------------------------------
      # Save logs/files so we can inspect them later.
      # ------------------------------------------------------------
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.2-android-probe
          path: |
            build-android/cmake-android.log
            src/blender-5.2.2/CMakeLists.txt.original
            src/blender-5.2.2/CMakeLists.txt
            src/blender-5.2.2/build_files/cmake/platform/platform_android.cmake
          if-no-files-found: warn
