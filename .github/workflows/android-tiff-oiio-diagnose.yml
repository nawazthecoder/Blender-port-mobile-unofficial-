name: Android TIFF and OIIO Package Diagnostic

on:
  workflow_dispatch:
    inputs:
      llvm_run_id:
        description: GitHub Actions run ID that produced the Android LLVM artifact
        required: true
        default: '37872328646'
        type: string
      oiio_run_id:
        description: GitHub Actions run ID that produced the Android OIIO artifact
        required: true
        default: '37616185108'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Test Android TIFF and OpenImageIO package discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      ANDROID_API: '29'
      ANDROID_NDK_VERSION: '27.3.13750724'
      ROOT: ${{ github.workspace }}/tiff-oiio-diagnostic

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Download Android LLVM artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.llvm_run_id }}
          github-token: ${{ github.token }}
          name: llvm-20.1.8-android-arm64
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/artifacts/llvm

      - name: Download Android OpenImageIO artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.oiio_run_id }}
          github-token: ${{ github.token }}
          name: android-arm64-oiio
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/artifacts/oiio

      - name: Prepare dependency prefixes and probe projects
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$ROOT/deps/llvm" \
            "$ROOT/deps/oiio" \
            "$ROOT/logs" \
            "$ROOT/probe-tiff" \
            "$ROOT/probe-oiio" \
            "$ROOT/build-tiff" \
            "$ROOT/build-oiio"

          LLVM_ARCHIVE="$(find "$ROOT/artifacts/llvm" -type f -name '*.tar.gz' -print -quit)"
          OIIO_ARCHIVE="$(find "$ROOT/artifacts/oiio" -type f -name '*.tar.gz' -print -quit)"

          test -n "$LLVM_ARCHIVE"
          test -n "$OIIO_ARCHIVE"

          {
            echo "LLVM archive: $LLVM_ARCHIVE"
            echo "OIIO archive: $OIIO_ARCHIVE"
            echo
            echo "=== LLVM archive entries ==="
            tar -tzf "$LLVM_ARCHIVE" | sed -n '1,30p'
            echo
            echo "=== OIIO archive entries ==="
            tar -tzf "$OIIO_ARCHIVE" | sed -n '1,60p'
          } | tee "$ROOT/logs/package-inventory.txt"

          tar -xzf "$LLVM_ARCHIVE" -C "$ROOT/deps/llvm"
          tar -xzf "$OIIO_ARCHIVE" -C "$ROOT/deps/oiio"

          LLVM_CONFIG="$(find "$ROOT/deps/llvm" -type f -name LLVMConfig.cmake -print -quit)"
          OIIO_CONFIG="$(find "$ROOT/deps/oiio" -type f -name OpenImageIOConfig.cmake -print -quit)"
          TIFF_LIB="$(find "$ROOT/deps/oiio" -type f -name libtiff.a -print -quit)"
          TIFF_HEADER="$(find "$ROOT/deps/oiio" -type f -name tiffio.h -print -quit)"

          test -n "$LLVM_CONFIG"
          test -n "$OIIO_CONFIG"
          test -n "$TIFF_LIB"
          test -n "$TIFF_HEADER"

          LLVM_PREFIX="${LLVM_CONFIG%/lib/cmake/llvm/LLVMConfig.cmake}"
          OIIO_PREFIX="${OIIO_CONFIG%/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake}"
          TIFF_INCLUDE_DIR="$(dirname "$TIFF_HEADER")"

          {
            echo
            echo "=== Resolved paths ==="
            echo "LLVM_CONFIG=$LLVM_CONFIG"
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "OpenImageIO_CONFIG=$OIIO_CONFIG"
            echo "OIIO_PREFIX=$OIIO_PREFIX"
            echo "TIFF_LIBRARY=$TIFF_LIB"
            echo "TIFF_INCLUDE_DIR=$TIFF_INCLUDE_DIR"
            echo
            echo "=== Package configuration files ==="
            find "$ROOT/deps/oiio" -type f \
              \( -name '*Config.cmake' -o -name '*-config.cmake' \) \
              -print | sort
          } | tee -a "$ROOT/logs/package-inventory.txt"

          {
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "OIIO_PREFIX=$OIIO_PREFIX"
            echo "TIFF_LIB=$TIFF_LIB"
            echo "TIFF_INCLUDE_DIR=$TIFF_INCLUDE_DIR"
          } >> "$GITHUB_ENV"

          cat > "$ROOT/probe-tiff/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(TiffPackageProbe LANGUAGES C CXX)

          find_package(TIFF MODULE REQUIRED)

          message(STATUS "TIFF_FOUND=${TIFF_FOUND}")
          message(STATUS "TIFF_LIBRARIES=${TIFF_LIBRARIES}")
          message(STATUS "TIFF_INCLUDE_DIRS=${TIFF_INCLUDE_DIRS}")

          if(TARGET TIFF::TIFF)
            get_target_property(_tiff_location TIFF::TIFF IMPORTED_LOCATION_RELEASE)
            if(NOT _tiff_location)
              get_target_property(_tiff_location TIFF::TIFF IMPORTED_LOCATION)
            endif()
            message(STATUS "TIFF::TIFF IMPORTED_LOCATION=${_tiff_location}")
          endif()
          CMAKE

          cat > "$ROOT/probe-oiio/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(OpenImageIOPackageProbe LANGUAGES C CXX)

          find_package(OpenImageIO CONFIG REQUIRED)

          message(STATUS "OpenImageIO_FOUND=${OpenImageIO_FOUND}")
          message(STATUS "OpenImageIO_VERSION=${OpenImageIO_VERSION}")

          if(TARGET OpenImageIO::OpenImageIO)
            message(STATUS "OpenImageIO::OpenImageIO target exists")
          elseif(TARGET OpenImageIO)
            message(STATUS "OpenImageIO target exists")
          endif()
          CMAKE

      - name: Run TIFF and OpenImageIO package probes
        id: probes
        shell: bash
        run: |
          set -uo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          TIFF_RC=1
          OIIO_RC=1

          echo "===== TIFF probe ====="

          set +e
          cmake \
            -S "$ROOT/probe-tiff" \
            -B "$ROOT/build-tiff" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DTIFF_LIBRARY="$TIFF_LIB" \
            -DTIFF_LIBRARY_RELEASE="$TIFF_LIB" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            "-DCMAKE_PREFIX_PATH=$OIIO_PREFIX" \
            2>&1 | tee "$ROOT/logs/tiff-probe.log"

          TIFF_RC=${PIPESTATUS[0]}

          echo "TIFF_PROBE_EXIT_CODE=$TIFF_RC" \
            | tee -a "$ROOT/logs/probe-status.txt"

          echo "===== OpenImageIO probe ====="

          cmake \
            -S "$ROOT/probe-oiio" \
            -B "$ROOT/build-oiio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            "-DCMAKE_PREFIX_PATH=$OIIO_PREFIX;$LLVM_PREFIX" \
            "-DOpenImageIO_DIR=$OIIO_PREFIX/lib/cmake/OpenImageIO" \
            "-DImath_DIR=$OIIO_PREFIX/lib/cmake/Imath" \
            "-DOpenEXR_DIR=$OIIO_PREFIX/lib/cmake/OpenEXR" \
            "-DOpenColorIO_DIR=$OIIO_PREFIX/lib/cmake/OpenColorIO" \
            "-DPNG_DIR=$OIIO_PREFIX/lib/cmake/PNG" \
            "-Dlibjpeg-turbo_DIR=$OIIO_PREFIX/lib/cmake/libjpeg-turbo" \
            -DTIFF_LIBRARY="$TIFF_LIB" \
            -DTIFF_LIBRARY_RELEASE="$TIFF_LIB" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            2>&1 | tee "$ROOT/logs/oiio-probe.log"

          OIIO_RC=${PIPESTATUS[0]}
          set -e

          echo "OIIO_PROBE_EXIT_CODE=$OIIO_RC" \
            | tee -a "$ROOT/logs/probe-status.txt"

          echo "tiff_rc=$TIFF_RC" >> "$GITHUB_OUTPUT"
          echo "oiio_rc=$OIIO_RC" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tiff-oiio-diagnostic-report
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/logs/
          if-no-files-found: error
          retention-days: 14

      - name: Set final setup status
        if: always()
        shell: bash
        env:
          TIFF_RC: ${{ steps.probes.outputs.tiff_rc }}
          OIIO_RC: ${{ steps.probes.outputs.oiio_rc }}
        run: |
          set -u

          if [[ "$TIFF_RC" != "0" || "$OIIO_RC" != "0" ]]; then
            echo "At least one package-discovery probe failed."
            echo "Download android-tiff-oiio-diagnostic-report."
            echo "TIFF_PROBE_EXIT_CODE=$TIFF_RC"
            echo "OIIO_PROBE_EXIT_CODE=$OIIO_RC"
            exit 1
          fi

          echo "Both TIFF and OpenImageIO package-discovery probes passed."
