name: Android TIFF and OpenImageIO Diagnostic

on:
  workflow_dispatch:
    inputs:
      llvm_run_id:
        description: "Successful LLVM workflow run ID (the number after /actions/runs/)"
        required: true
        type: string
        default: "37872328646"
      oiio_run_id:
        description: "Successful OIIO bootstrap workflow run ID (the number after /actions/runs/)"
        required: true
        type: string
        default: "38025704348"

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tiff-oiio-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Check downloaded TIFF and OpenImageIO packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_API: "29"
      ANDROID_NDK_VERSION: "27.3.13750724"
      ROOT: ${{ github.workspace }}/tiff-oiio-diagnostic

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host tools and download Android NDK directly
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            ninja-build \
            unzip

          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          NDK_SHA1="22105e410cf29afcf163760cc95522b9fb981121"

          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$NDK_URL" -o "$NDK_ARCHIVE"

          echo "$NDK_SHA1  $NDK_ARCHIVE" | sha1sum --check -

          rm -rf "$RUNNER_TEMP/android-ndk-r27d"
          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP"

          ANDROID_NDK_HOME="$RUNNER_TEMP/android-ndk-r27d"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"

          cmake --version
          ninja --version

      - name: Download LLVM artifact from selected successful run
        uses: actions/download-artifact@v4
        with:
          name: llvm-20.1.8-android-arm64
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/artifacts/llvm
          repository: ${{ github.repository }}
          run-id: ${{ inputs.llvm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download OIIO artifact from selected successful run
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-oiio
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/artifacts/oiio
          repository: ${{ github.repository }}
          run-id: ${{ inputs.oiio_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage dependency prefixes and prepare package probes
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$ROOT/deps/llvm" \
            "$ROOT/deps/oiio" \
            "$ROOT/logs" \
            "$ROOT/probe-tiff" \
            "$ROOT/probe-oiio" \
            "$ROOT/build-tiff" \
            "$ROOT/build-oiio"

          # The LLVM artifact is expected to contain a tar.gz archive.
          LLVM_ARCHIVE="$(find "$ROOT/artifacts/llvm" -type f -name '*.tar.gz' -print -quit || true)"
          test -n "$LLVM_ARCHIVE" || {
            echo "ERROR: No .tar.gz archive found inside the downloaded LLVM artifact." >&2
            find "$ROOT/artifacts/llvm" -maxdepth 4 -type f -print >&2 || true
            exit 1
          }

          # actions/download-artifact automatically extracts the artifact ZIP.
          # The OIIO workflow uploads prefix/, logs/, and manifest.txt directly,
          # so OIIO usually has no inner .tar.gz. Support both formats.
          OIIO_ARCHIVE="$(find "$ROOT/artifacts/oiio" -type f -name '*.tar.gz' -print -quit || true)"

          {
            echo "LLVM artifact directory: $ROOT/artifacts/llvm"
            echo "LLVM archive: $LLVM_ARCHIVE"
            echo "OIIO artifact directory: $ROOT/artifacts/oiio"
            echo "OIIO inner archive: ${OIIO_ARCHIVE:-<none; using extracted prefix directory>}"
            echo
            echo "=== LLVM downloaded artifact entries ==="
            find "$ROOT/artifacts/llvm" -maxdepth 4 -type f -print | sort | sed -n '1,80p'
            echo
            echo "=== OIIO downloaded artifact entries ==="
            find "$ROOT/artifacts/oiio" -maxdepth 5 -type f -print | sort | sed -n '1,160p'
          } | tee "$ROOT/logs/package-inventory.txt"

          tar -xzf "$LLVM_ARCHIVE" -C "$ROOT/deps/llvm"

          if [ -n "$OIIO_ARCHIVE" ]; then
            tar -xzf "$OIIO_ARCHIVE" -C "$ROOT/deps/oiio"
          elif [ -d "$ROOT/artifacts/oiio/prefix" ]; then
            # Correct path for the artifact generated by android-oiio-bootstrap.yml.
            cp -a "$ROOT/artifacts/oiio/prefix/." "$ROOT/deps/oiio/"
          else
            # Fallback if GitHub preserved an extra directory level.
            OIIO_CONFIG_SOURCE="$(find "$ROOT/artifacts/oiio" -type f -name OpenImageIOConfig.cmake -print -quit || true)"
            if [ -n "$OIIO_CONFIG_SOURCE" ]; then
              OIIO_PREFIX_SOURCE="${OIIO_CONFIG_SOURCE%/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake}"
              test -d "$OIIO_PREFIX_SOURCE"
              cp -a "$OIIO_PREFIX_SOURCE/." "$ROOT/deps/oiio/"
            else
              echo "ERROR: No OIIO prefix/ directory or OpenImageIOConfig.cmake was found in the downloaded artifact." >&2
              exit 1
            fi
          fi

          LLVM_CONFIG="$(find "$ROOT/deps/llvm" -type f -name LLVMConfig.cmake -print -quit || true)"
          OIIO_CONFIG="$(find "$ROOT/deps/oiio" -type f -name OpenImageIOConfig.cmake -print -quit || true)"
          TIFF_LIB="$(find "$ROOT/deps/oiio" -type f -name libtiff.a -print -quit || true)"
          TIFF_HEADER="$(find "$ROOT/deps/oiio" -type f -name tiffio.h -print -quit || true)"

          test -n "$LLVM_CONFIG" || {
            echo "ERROR: LLVMConfig.cmake was not found after extracting the LLVM archive." >&2
            find "$ROOT/deps/llvm" -maxdepth 6 -type f -print | head -200 >&2 || true
            exit 1
          }
          test -n "$OIIO_CONFIG" || {
            echo "ERROR: OpenImageIOConfig.cmake was not found in the OIIO prefix." >&2
            find "$ROOT/deps/oiio" -maxdepth 7 -type f -print | head -200 >&2 || true
            exit 1
          }
          test -n "$TIFF_LIB" || {
            echo "ERROR: libtiff.a was not found in the OIIO prefix." >&2
            exit 1
          }
          test -n "$TIFF_HEADER" || {
            echo "ERROR: tiffio.h was not found in the OIIO prefix." >&2
            exit 1
          }

          LLVM_PREFIX="${LLVM_CONFIG%/lib/cmake/llvm/LLVMConfig.cmake}"
          OIIO_PREFIX="${OIIO_CONFIG%/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake}"
          TIFF_INCLUDE_DIR="$(dirname "$TIFF_HEADER")"

          {
            echo
            echo "=== Resolved paths ==="
            echo "LLVM_CONFIG=$LLVM_CONFIG"
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "OpenImageIO_CONFIG=$OIIO_CONFIG"
            echo "OIIO_PREFIX=$OIIO_PREFIX"
            echo "TIFF_LIBRARY=$TIFF_LIB"
            echo "TIFF_INCLUDE_DIR=$TIFF_INCLUDE_DIR"
            echo
            echo "=== Package configuration files ==="
            find "$OIIO_PREFIX" -type f \
              \( -name '*Config.cmake' -o -name '*-config.cmake' \) \
              -print | sort
          } | tee -a "$ROOT/logs/package-inventory.txt"

          {
            echo "LLVM_CONFIG=$LLVM_CONFIG"
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "OIIO_CONFIG=$OIIO_CONFIG"
            echo "OIIO_PREFIX=$OIIO_PREFIX"
            echo "TIFF_LIB=$TIFF_LIB"
            echo "TIFF_INCLUDE_DIR=$TIFF_INCLUDE_DIR"
          } >> "$GITHUB_ENV"

          cat > "$ROOT/probe-tiff/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(TiffPackageProbe LANGUAGES C CXX)

          # libtiff 4.7.1 exports targets that refer to these dependency
          # targets but does not reliably create/find them for consumers.
          # Define them from the Android prefix before loading TiffConfig.cmake.
          set(DEP_PREFIX "" CACHE PATH "Android dependency prefix")
          if(NOT IS_DIRECTORY "${DEP_PREFIX}/include")
            message(FATAL_ERROR "DEP_PREFIX is missing or invalid: ${DEP_PREFIX}")
          endif()

          if(NOT TARGET ZLIB::ZLIB)
            add_library(ZLIB::ZLIB STATIC IMPORTED)
            set_target_properties(ZLIB::ZLIB PROPERTIES
              IMPORTED_LOCATION "${DEP_PREFIX}/lib/libz.a"
              INTERFACE_INCLUDE_DIRECTORIES "${DEP_PREFIX}/include")
          endif()

          if(NOT TARGET JPEG::JPEG)
            add_library(JPEG::JPEG STATIC IMPORTED)
            set_target_properties(JPEG::JPEG PROPERTIES
              IMPORTED_LOCATION "${DEP_PREFIX}/lib/libjpeg.a"
              INTERFACE_INCLUDE_DIRECTORIES "${DEP_PREFIX}/include")
          endif()

          if(NOT TARGET CMath::CMath)
            add_library(CMath::CMath INTERFACE IMPORTED)
            set_property(TARGET CMath::CMath PROPERTY INTERFACE_LINK_LIBRARIES m)
          endif()

          foreach(_required_file
              "${DEP_PREFIX}/lib/libz.a"
              "${DEP_PREFIX}/lib/libjpeg.a"
              "${DEP_PREFIX}/lib/libtiff.a"
              "${DEP_PREFIX}/include/tiffio.h")
            if(NOT EXISTS "${_required_file}")
              message(FATAL_ERROR "Missing required Android TIFF dependency: ${_required_file}")
            endif()
          endforeach()

          find_package(TIFF MODULE REQUIRED)

          message(STATUS "TIFF_FOUND=${TIFF_FOUND}")
          message(STATUS "TIFF_VERSION_STRING=${TIFF_VERSION_STRING}")
          message(STATUS "TIFF_LIBRARIES=${TIFF_LIBRARIES}")
          message(STATUS "TIFF_INCLUDE_DIRS=${TIFF_INCLUDE_DIRS}")

          if(TARGET TIFF::tiff)
            get_target_property(_tiff_location TIFF::tiff IMPORTED_LOCATION_RELEASE)
            if(NOT _tiff_location)
              get_target_property(_tiff_location TIFF::tiff IMPORTED_LOCATION)
            endif()
            message(STATUS "TIFF::tiff imported location=${_tiff_location}")
          endif()

          if(TARGET TIFF::TIFF)
            add_executable(tiff_package_probe main.cpp)
            target_link_libraries(tiff_package_probe PRIVATE TIFF::TIFF)
          else()
            message(FATAL_ERROR "FindTIFF succeeded but did not define TIFF::TIFF")
          endif()
          CMAKE

          cat > "$ROOT/probe-tiff/main.cpp" <<'CPP'
          #include <tiffio.h>
          int main() {
            const char *version = TIFFGetVersion();
            return version == nullptr;
          }
          CPP

          cat > "$ROOT/probe-oiio/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(OpenImageIOPackageProbe LANGUAGES C CXX)

          # Predefine libtiff 4.7.1's exported dependency targets before
          # OpenImageIO's package configuration recursively discovers TIFF.
          set(DEP_PREFIX "" CACHE PATH "Android dependency prefix")
          if(NOT IS_DIRECTORY "${DEP_PREFIX}/include")
            message(FATAL_ERROR "DEP_PREFIX is missing or invalid: ${DEP_PREFIX}")
          endif()

          if(NOT TARGET ZLIB::ZLIB)
            add_library(ZLIB::ZLIB STATIC IMPORTED)
            set_target_properties(ZLIB::ZLIB PROPERTIES
              IMPORTED_LOCATION "${DEP_PREFIX}/lib/libz.a"
              INTERFACE_INCLUDE_DIRECTORIES "${DEP_PREFIX}/include")
          endif()

          if(NOT TARGET JPEG::JPEG)
            add_library(JPEG::JPEG STATIC IMPORTED)
            set_target_properties(JPEG::JPEG PROPERTIES
              IMPORTED_LOCATION "${DEP_PREFIX}/lib/libjpeg.a"
              INTERFACE_INCLUDE_DIRECTORIES "${DEP_PREFIX}/include")
          endif()

          if(NOT TARGET CMath::CMath)
            add_library(CMath::CMath INTERFACE IMPORTED)
            set_property(TARGET CMath::CMath PROPERTY INTERFACE_LINK_LIBRARIES m)
          endif()

          foreach(_required_file
              "${DEP_PREFIX}/lib/libz.a"
              "${DEP_PREFIX}/lib/libjpeg.a"
              "${DEP_PREFIX}/lib/libtiff.a"
              "${DEP_PREFIX}/include/tiffio.h")
            if(NOT EXISTS "${_required_file}")
              message(FATAL_ERROR "Missing required Android TIFF dependency: ${_required_file}")
            endif()
          endforeach()

          # Force the TIFF package to load after its dependencies are defined.
          find_package(TIFF MODULE REQUIRED)
          find_package(OpenImageIO CONFIG REQUIRED)

          message(STATUS "OpenImageIO_FOUND=${OpenImageIO_FOUND}")
          message(STATUS "OpenImageIO_VERSION=${OpenImageIO_VERSION}")

          if(TARGET OpenImageIO::OpenImageIO)
            message(STATUS "OpenImageIO::OpenImageIO target exists")
            add_executable(oiio_package_probe main.cpp)
            target_link_libraries(oiio_package_probe PRIVATE OpenImageIO::OpenImageIO)
          elseif(TARGET OpenImageIO)
            message(STATUS "OpenImageIO target exists")
            add_executable(oiio_package_probe main.cpp)
            target_link_libraries(oiio_package_probe PRIVATE OpenImageIO)
          else()
            message(FATAL_ERROR "OpenImageIO package was found but no known library target exists")
          endif()
          CMAKE

          cat > "$ROOT/probe-oiio/main.cpp" <<'CPP'
          #include <OpenImageIO/imageio.h>
          int main() {
            auto input = OIIO::ImageInput::open("__oiio_diagnostic_nonexistent__.exr");
            return input ? 0 : 0;
          }
          CPP

      - name: Configure TIFF package probe
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$ROOT/probe-tiff" \
            -B "$ROOT/build-tiff" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN_FILE" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$OIIO_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH="$OIIO_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DDEP_PREFIX="$OIIO_PREFIX" \
            -DTIFF_LIBRARY="$TIFF_LIB" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            2>&1 | tee "$ROOT/logs/probe-tiff-configure.log"

      - name: Build TIFF package probe
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$ROOT/build-tiff" --parallel 2 \
            2>&1 | tee "$ROOT/logs/probe-tiff-build.log"

      - name: Configure OpenImageIO package probe
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$ROOT/probe-oiio" \
            -B "$ROOT/build-oiio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN_FILE" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$OIIO_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH="$OIIO_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DDEP_PREFIX="$OIIO_PREFIX" \
            -DOpenImageIO_DIR="$(dirname "$OIIO_CONFIG")" \
            -DOpenColorIO_DIR="$OIIO_PREFIX/lib/cmake/OpenColorIO" \
            -DOpenEXR_DIR="$OIIO_PREFIX/lib/cmake/OpenEXR" \
            -DImath_DIR="$OIIO_PREFIX/lib/cmake/Imath" \
            -Dfmt_DIR="$OIIO_PREFIX/lib/cmake/fmt" \
            -DZLIB_LIBRARY="$OIIO_PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DJPEG_LIBRARY="$OIIO_PREFIX/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$OIIO_PREFIX/include" \
            2>&1 | tee "$ROOT/logs/probe-oiio-configure.log"

      - name: Build OpenImageIO package probe
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$ROOT/build-oiio" --parallel 2 \
            2>&1 | tee "$ROOT/logs/probe-oiio-build.log"

      - name: Write diagnostic summary
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$ROOT/logs"
          {
            echo "Android TIFF and OpenImageIO package diagnostic"
            echo "LLVM workflow run ID: ${{ inputs.llvm_run_id }}"
            echo "OIIO workflow run ID: ${{ inputs.oiio_run_id }}"
            echo "Android API: $ANDROID_API"
            echo "NDK version: $ANDROID_NDK_VERSION"
            echo "Completed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$ROOT/logs/diagnostic-summary.txt"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tiff-oiio-diagnostic-logs
          path: ${{ github.workspace }}/tiff-oiio-diagnostic/logs/
          if-no-files-found: warn
          retention-days: 14
