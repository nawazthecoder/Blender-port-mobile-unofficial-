name: Android ARM64 - OpenImageIO Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  OIIO_VERSION: "v3.1.13.1"
  IMATH_VERSION: "3.2.2"
  OPENEXR_VERSION: "3.4.10"
  OPENJPH_VERSION: "0.25.2"
  DEFLATE_VERSION: "1.18"

  OPENCOLORIO_VERSION: "2.5.0"
  FMT_VERSION: "12.1.0"
  ROBINMAP_VERSION: "v1.3.0"
  PUGIXML_VERSION: "1.10"

  ZLIB_VERSION: "1.3.1"
  PNG_VERSION: "1.6.50"
  JPEG_VERSION: "3.1.0"
  TIFF_VERSION: "4.7.1"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-oiio:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            curl \
            unzip \
            xz-utils \
            file \
            binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Prepare directories
        shell: bash
        run: |
          set -eux

          rm -rf android-oiio

          mkdir -p \
            android-oiio/src \
            android-oiio/build \
            android-oiio/prefix \
            android-oiio/logs \
            android-oiio/package

          echo "SRC=$GITHUB_WORKSPACE/android-oiio/src" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_WORKSPACE/android-oiio/build" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/android-oiio/prefix" >> "$GITHUB_ENV"
          echo "LOGS=$GITHUB_WORKSPACE/android-oiio/logs" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # DOWNLOAD
      # ------------------------------------------------------------

      - name: Download dependencies
        shell: bash
        run: |
          set -eux
          cd "$SRC"

          git clone --depth 1 --branch "v${IMATH_VERSION}" \
            https://github.com/AcademySoftwareFoundation/Imath.git imath

          git clone --depth 1 --branch "v${OPENEXR_VERSION}" \
            https://github.com/AcademySoftwareFoundation/openexr.git openexr

          git clone --depth 1 --branch "${OIIO_VERSION}" \
            https://github.com/AcademySoftwareFoundation/OpenImageIO.git OpenImageIO

          git clone --depth 1 --branch "v${OPENCOLORIO_VERSION}" \
            https://github.com/AcademySoftwareFoundation/OpenColorIO.git opencolorio

          git clone --depth 1 --branch "${FMT_VERSION}" \
            https://github.com/fmtlib/fmt.git fmt

          git clone --depth 1 --branch "${PUGIXML_VERSION}" \
            https://github.com/zeux/pugixml.git pugixml

          git clone --depth 1 --branch "${ROBINMAP_VERSION}" \
            https://github.com/Tessil/robin-map.git robinmap

          git clone --depth 1 --branch "v${OPENJPH_VERSION}" \
            https://github.com/aous72/OpenJPH.git openjph

          git clone --depth 1 --branch "v${DEFLATE_VERSION}" \
            https://github.com/ebiggers/libdeflate.git deflate

          git clone --depth 1 --branch "v${ZLIB_VERSION}" \
            https://github.com/madler/zlib.git zlib

          git clone --depth 1 --branch "${JPEG_VERSION}" \
            https://github.com/libjpeg-turbo/libjpeg-turbo.git jpeg

          git clone --depth 1 --branch "v${TIFF_VERSION}" \
            https://gitlab.com/libtiff/libtiff.git tiff

      # ------------------------------------------------------------
      # HELPER
      # ------------------------------------------------------------

      - name: Build zlib
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/zlib" -B "$BUILD/zlib" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build "$BUILD/zlib" --parallel 2
          cmake --install "$BUILD/zlib"

      - name: Build libjpeg
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/jpeg" -B "$BUILD/jpeg" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF

          cmake --build "$BUILD/jpeg" --parallel 2
          cmake --install "$BUILD/jpeg"

      - name: Build libtiff
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/tiff" -B "$BUILD/tiff" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -Dtiff-tools=OFF \
            -Dtiff-tests=OFF \
            -Dtiff-docs=OFF \
            -Djbig=OFF \
            -Dlzma=OFF \
            -Dzstd=OFF \
            -Dwebp=OFF

          cmake --build "$BUILD/tiff" --parallel 2
          cmake --install "$BUILD/tiff"

      # ------------------------------------------------------------
      # IMATH
      # ------------------------------------------------------------

      - name: Build Imath
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/imath" -B "$BUILD/imath" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DIMATH_BUILD_TESTS=OFF \
            -DIMATH_BUILD_EXAMPLES=OFF \
            -DPYTHON=OFF \
            -DPYBIND11=OFF

          cmake --build "$BUILD/imath" --parallel 2
          cmake --install "$BUILD/imath"

          test -f "$PREFIX/lib/cmake/Imath/ImathConfig.cmake"

      # ------------------------------------------------------------
      # OPENJPH
      # ------------------------------------------------------------

      - name: Build OpenJPH
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/openjph" -B "$BUILD/openjph" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOJPH_BUILD_EXECUTABLES=OFF \
            -DOJPH_BUILD_TESTS=OFF

          cmake --build "$BUILD/openjph" --parallel 2
          cmake --install "$BUILD/openjph"

      # ------------------------------------------------------------
      # LIBDEFLATE
      # ------------------------------------------------------------

      - name: Build libdeflate
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/deflate" -B "$BUILD/deflate" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
            -DLIBDEFLATE_BUILD_GZIP=OFF \
            -DLIBDEFLATE_BUILD_TESTS=OFF

          cmake --build "$BUILD/deflate" --parallel 2
          cmake --install "$BUILD/deflate"

      # ------------------------------------------------------------
      # OPENEXR
      # ------------------------------------------------------------

      - name: Build OpenEXR
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/openexr" -B "$BUILD/openexr" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPENEXR_BUILD_TESTS=OFF \
            -DOPENEXR_BUILD_TOOLS=OFF \
            -DOPENEXR_BUILD_EXAMPLES=OFF \
            -DOPENEXR_BUILD_PYTHON=OFF \
            -DOPENEXR_USE_TBB=OFF

          cmake --build "$BUILD/openexr" --parallel 2
          cmake --install "$BUILD/openexr"

      # ------------------------------------------------------------
      # FMT
      # ------------------------------------------------------------

      - name: Build fmt
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/fmt" -B "$BUILD/fmt" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF

          cmake --build "$BUILD/fmt" --parallel 2
          cmake --install "$BUILD/fmt"

      # ------------------------------------------------------------
      # PUGIXML + ROBINMAP
      # ------------------------------------------------------------

      - name: Build pugixml
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/pugixml" -B "$BUILD/pugixml" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DPUGIXML_BUILD_TESTS=OFF

          cmake --build "$BUILD/pugixml" --parallel 2
          cmake --install "$BUILD/pugixml"

      - name: Install robin-map
        shell: bash
        run: |
          set -eux

          mkdir -p "$PREFIX/include"
          cp -a "$SRC/robinmap/include/tsl" "$PREFIX/include/"

      # ------------------------------------------------------------
      # OPENCOLORIO
      # ------------------------------------------------------------

      - name: Build OpenColorIO
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/opencolorio" -B "$BUILD/ocio" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DImath_ROOT="$PREFIX" \
            -DOCIO_INSTALL_EXT_PACKAGES=NONE \
            -DOCIO_BUILD_APPS=OFF \
            -DOCIO_BUILD_TESTS=OFF \
            -DOCIO_BUILD_PYTHON=OFF \
            -DOCIO_BUILD_DOCS=OFF

          cmake --build "$BUILD/ocio" --parallel 2
          cmake --install "$BUILD/ocio"

      # ------------------------------------------------------------
      # OPENIMAGEIO
      # ------------------------------------------------------------

      - name: Configure OpenImageIO
        shell: bash
        run: |
          set -eux

          cmake -S "$SRC/OpenImageIO" -B "$BUILD/oiio" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLINKSTATIC=ON \
            -DEMBEDPLUGINS=ON \
            -DOpenImageIO_BUILD_MISSING_DEPS= \
            -DOIIO_BUILD_TOOLS=OFF \
            -DOIIO_BUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DINSTALL_DOCS=OFF \
            -DINSTALL_FONTS=OFF \
            -DUSE_PYTHON=OFF \
            -DUSE_QT=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_TBB=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_OPENCV=OFF \
            -DUSE_OPENVDB=OFF \
            -DUSE_LIBRAW=OFF \
            -DUSE_WEBP=OFF \
            -DUSE_JXL=OFF \
            -DUSE_LIBHEIF=OFF \
            -DUSE_OPENJPEG=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_PUGIXML=ON \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -DOpenEXR_DIR="$PREFIX/lib/cmake/OpenEXR" \
            -DOpenColorIO_DIR="$PREFIX/lib/cmake/OpenColorIO" \
            -Dfmt_DIR="$PREFIX/lib/cmake/fmt" \
            -Dpugixml_DIR="$PREFIX/lib/cmake/pugixml"

      - name: Build OpenImageIO
        shell: bash
        run: |
          set -eux

          cmake --build "$BUILD/oiio" --parallel 2

      - name: Install OpenImageIO
        shell: bash
        run: |
          set -eux

          cmake --install "$BUILD/oiio"

          test -f "$PREFIX/lib/libOpenImageIO.a"
          test -d "$PREFIX/include/OpenImageIO"

      # ------------------------------------------------------------
      # VERIFY
      # ------------------------------------------------------------

      - name: Verify OIIO Android ARM64
        shell: bash
        run: |
          set -eux

          check_arm64() {
            archive="$1"
            test -f "$archive"

            obj="$(mktemp)"
            member="$(ar t "$archive" | head -n 1)"

            test -n "$member"

            ar p "$archive" "$member" > "$obj"

            readelf -h "$obj" | grep "AArch64"

            rm -f "$obj"
          }

          check_arm64 "$PREFIX/lib/libImath.a"
          check_arm64 "$PREFIX/lib/libOpenEXR.a"
          check_arm64 "$PREFIX/lib/libOpenColorIO.a"
          check_arm64 "$PREFIX/lib/libOpenImageIO.a"

          test -f "$PREFIX/lib/cmake/Imath/ImathConfig.cmake"

          echo
          echo "======================================"
          echo " OIIO Android ARM64 BUILD PASSED"
          echo "======================================"

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------

      - name: Package
        shell: bash
        run: |
          set -eux

          cat > android-oiio/manifest.txt <<EOF
          Blender: 5.2.2
          OpenImageIO: ${OIIO_VERSION}
          Imath: ${IMATH_VERSION}
          OpenEXR: ${OPENEXR_VERSION}
          OpenColorIO: ${OPENCOLORIO_VERSION}
          fmt: ${FMT_VERSION}
          RobinMap: ${ROBINMAP_VERSION}
          pugixml: ${PUGIXML_VERSION}
          Android ABI: arm64-v8a
          Android API: ${ANDROID_API}
          NDK: ${ANDROID_NDK_VERSION}
          EOF

          tar -czf \
            android-oiio/package/openimageio-android-arm64.tar.gz \
            -C android-oiio \
            prefix manifest.txt

      - name: Upload OIIO bundle
        uses: actions/upload-artifact@v4
        with:
          name: openimageio-android-arm64-blender-5.2.2
          path: android-oiio/package/openimageio-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-oiio-logs
          path: android-oiio/logs
          if-no-files-found: warn
          retention-days: 14
