name: Android ARM64 - OpenImageIO Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  # Blender 5.2.2 dependency versions
  OIIO_VERSION: "v3.1.13.1"
  IMATH_VERSION: "v3.2.2"
  OPENEXR_VERSION: "v3.4.10"
  OPENCOLORIO_VERSION: "v2.5.0"

  FMT_VERSION: "12.1.0"
  ROBINMAP_VERSION: "v1.3.0"
  PYSTRING_VERSION: "v1.1.4"

  ZLIB_VERSION: "v1.3.1"
  PNG_VERSION: "v1.6.50"
  JPEG_VERSION: "3.1.0"
  TIFF_VERSION: "v4.7.1"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-oiio:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            curl \
            unzip \
            xz-utils \
            file \
            binutils \
            pkg-config

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf android-oiio

          mkdir -p \
            android-oiio/src \
            android-oiio/build \
            android-oiio/prefix \
            android-oiio/logs \
            android-oiio/package

          echo "SRC=$GITHUB_WORKSPACE/android-oiio/src" \
            >> "$GITHUB_ENV"

          echo "BUILD=$GITHUB_WORKSPACE/android-oiio/build" \
            >> "$GITHUB_ENV"

          echo "PREFIX=$GITHUB_WORKSPACE/android-oiio/prefix" \
            >> "$GITHUB_ENV"

          echo "LOGS=$GITHUB_WORKSPACE/android-oiio/logs" \
            >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            >> "$GITHUB_ENV"

      - name: Download dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SRC"

          git clone --depth 1 --branch "$IMATH_VERSION" \
            https://github.com/AcademySoftwareFoundation/Imath.git \
            imath

          git clone --depth 1 --branch "$OPENEXR_VERSION" \
            https://github.com/AcademySoftwareFoundation/openexr.git \
            openexr

          git clone --depth 1 --branch "$OIIO_VERSION" \
            https://github.com/AcademySoftwareFoundation/OpenImageIO.git \
            OpenImageIO

          git clone --depth 1 --branch "$OPENCOLORIO_VERSION" \
            https://github.com/AcademySoftwareFoundation/OpenColorIO.git \
            opencolorio

          git clone --depth 1 --branch "$FMT_VERSION" \
            https://github.com/fmtlib/fmt.git \
            fmt

          git clone --depth 1 --branch "$ROBINMAP_VERSION" \
            https://github.com/Tessil/robin-map.git \
            robinmap

          git clone --depth 1 --branch "$PYSTRING_VERSION" \
            https://github.com/imageworks/pystring.git \
            pystring

          git clone --depth 1 --branch "$ZLIB_VERSION" \
            https://github.com/madler/zlib.git \
            zlib

          git clone --depth 1 --branch "$PNG_VERSION" \
            https://github.com/pnggroup/libpng.git \
            png

          git clone --depth 1 --branch "$JPEG_VERSION" \
            https://github.com/libjpeg-turbo/libjpeg-turbo.git \
            jpeg

          git clone --depth 1 --branch "$TIFF_VERSION" \
            https://gitlab.com/libtiff/libtiff.git \
            tiff

      - name: Show source revisions
        shell: bash
        run: |
          set -eux

          cd "$SRC"

          for d in \
            imath \
            openexr \
            OpenImageIO \
            opencolorio \
            fmt \
            robinmap \
            pystring \
            zlib \
            png \
            jpeg \
            tiff
          do
            echo
            echo "========== $d =========="
            git -C "$d" rev-parse HEAD
            git -C "$d" describe --tags --always || true
          done

      - name: Build zlib
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/zlib" \
            -B "$BUILD/zlib" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DZLIB_BUILD_TESTING=OFF \
            2>&1 | tee "$LOGS/zlib-configure.log"

          cmake --build "$BUILD/zlib" \
            --target install \
            2>&1 | tee "$LOGS/zlib-build.log"

      - name: Build libpng
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/png" \
            -B "$BUILD/png" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF \
            -DPNG_TOOLS=OFF \
            2>&1 | tee "$LOGS/png-configure.log"

          cmake --build "$BUILD/png" \
            --target install \
            2>&1 | tee "$LOGS/png-build.log"

      - name: Build libjpeg-turbo
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/jpeg" \
            -B "$BUILD/jpeg" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TEST=OFF \
            2>&1 | tee "$LOGS/jpeg-configure.log"

          cmake --build "$BUILD/jpeg" \
            --target install \
            2>&1 | tee "$LOGS/jpeg-build.log"

      - name: Build libtiff
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/tiff" \
            -B "$BUILD/tiff" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Dtiff-tools=OFF \
            -Dtiff-tests=OFF \
            -Dtiff-contrib=OFF \
            -Djbig=OFF \
            -Djpeg=ON \
            -Dwebp=OFF \
            -Dzstd=OFF \
            -Dlzma=OFF \
            -DLERC=OFF \
            2>&1 | tee "$LOGS/tiff-configure.log"

          cmake --build "$BUILD/tiff" \
            --target install \
            2>&1 | tee "$LOGS/tiff-build.log"

      - name: Build Imath
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/imath" \
            -B "$BUILD/imath" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIMATH_BUILD_TESTS=OFF \
            -DIMATH_INSTALL_PKG_CONFIG=OFF \
            2>&1 | tee "$LOGS/imath-configure.log"

          cmake --build "$BUILD/imath" \
            --target install \
            2>&1 | tee "$LOGS/imath-build.log"

      - name: Configure OpenEXR
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$BUILD/openexr"

          cmake \
            -S "$SRC/openexr" \
            -B "$BUILD/openexr" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING:BOOL=OFF \
            -DOPENEXR_TEST_LIBRARIES:BOOL=OFF \
            -DOPENEXR_TEST_TOOLS:BOOL=OFF \
            -DOPENEXR_TEST_PYTHON:BOOL=OFF \
            -DOPENEXR_INSTALL:BOOL=ON \
            -DOPENEXR_BUILD_LIBS:BOOL=ON \
            -DOPENEXR_BUILD_TOOLS:BOOL=OFF \
            -DOPENEXR_INSTALL_TOOLS:BOOL=OFF \
            -DOPENEXR_INSTALL_DEVELOPER_TOOLS:BOOL=OFF \
            -DOPENEXR_BUILD_EXAMPLES:BOOL=OFF \
            -DOPENEXR_BUILD_PYTHON:BOOL=OFF \
            -DOPENEXR_BUILD_OSS_FUZZ:BOOL=OFF \
            -DOPENEXR_FORCE_INTERNAL_DEFLATE:BOOL=ON \
            -DOPENEXR_FORCE_INTERNAL_OPENJPH:BOOL=ON \
            -DOPENEXR_FORCE_INTERNAL_IMATH:BOOL=OFF \
            -DOPENEXR_ENABLE_THREADING:BOOL=ON \
            -DOPENEXR_USE_TBB:BOOL=OFF \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            2>&1 | tee "$LOGS/openexr-configure.log"

          echo
          echo "========== OpenEXR test configuration =========="

          grep -E \
            '^(BUILD_TESTING|OPENEXR_TEST_LIBRARIES|OPENEXR_TEST_TOOLS|OPENEXR_TEST_PYTHON):' \
            "$BUILD/openexr/CMakeCache.txt" || true

          if grep -q '^BUILD_TESTING:.*=ON$' \
              "$BUILD/openexr/CMakeCache.txt"; then
            echo "ERROR: BUILD_TESTING is ON"
            exit 1
          fi

          if grep -q '^OPENEXR_TEST_LIBRARIES:.*=ON$' \
              "$BUILD/openexr/CMakeCache.txt"; then
            echo "ERROR: OPENEXR_TEST_LIBRARIES is ON"
            exit 1
          fi

          if grep -q '^OPENEXR_TEST_TOOLS:.*=ON$' \
              "$BUILD/openexr/CMakeCache.txt"; then
            echo "ERROR: OPENEXR_TEST_TOOLS is ON"
            exit 1
          fi

          if grep -q '^OPENEXR_TEST_PYTHON:.*=ON$' \
              "$BUILD/openexr/CMakeCache.txt"; then
            echo "ERROR: OPENEXR_TEST_PYTHON is ON"
            exit 1
          fi

      - name: Build OpenEXR libraries
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "$BUILD/openexr" \
            --target \
              Iex \
              IlmThread \
              OpenEXRCore \
              OpenEXR \
              OpenEXRUtil \
            -j 2 \
            2>&1 | tee "$LOGS/openexr-build.log"

      - name: Install OpenEXR
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --install "$BUILD/openexr" \
            2>&1 | tee "$LOGS/openexr-install.log"

      - name: Verify OpenEXR test tree
        shell: bash
        run: |
          set -eux

          TEST_FILE="$(
            find "$BUILD/openexr" \
              -path '*/src/test/*' \
              -type f \
              -print \
              -quit
          )"

          if [ -n "$TEST_FILE" ]; then
            echo "ERROR: OpenEXR test files were generated:"
            echo "$TEST_FILE"
            exit 1
          fi

          echo "OpenEXR test tree was not generated."

      - name: Build fmt
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/fmt" \
            -B "$BUILD/fmt" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF \
            2>&1 | tee "$LOGS/fmt-configure.log"

          cmake --build "$BUILD/fmt" \
            --target install \
            2>&1 | tee "$LOGS/fmt-build.log"

      - name: Install Robin-map headers
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PREFIX/include/tsl"

          cp -a \
            "$SRC/robinmap/include/tsl/." \
            "$PREFIX/include/tsl/"

          test -f "$PREFIX/include/tsl/robin_map.h"
          test -f "$PREFIX/include/tsl/robin_set.h"

      # FIX: build pystring 1.1.4 as an Android ARM64 static library.
      # This makes the header and archive available in the final prefix,
      # rather than relying on OCIO's temporary ext/dist directory.
      - name: Build and install Android pystring
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/pystring" \
            -B "$BUILD/pystring" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            2>&1 | tee "$LOGS/pystring-configure.log"

          cmake --build "$BUILD/pystring" \
            --parallel 2 \
            2>&1 | tee "$LOGS/pystring-build.log"

          cmake --install "$BUILD/pystring" \
            2>&1 | tee "$LOGS/pystring-install.log"

          PYSTRING_HEADER="$(
            find "$PREFIX/include" \
              -type f \
              -name pystring.h \
              -print \
              -quit
          )"

          PYSTRING_LIBRARY="$(
            find "$PREFIX/lib" \
              -maxdepth 1 \
              -type f \
              -name libpystring.a \
              -print \
              -quit
          )"

          if [ -z "$PYSTRING_HEADER" ]; then
            echo "ERROR: pystring.h was not installed"
            find "$PREFIX/include" -maxdepth 3 -type f -print | sort
            exit 1
          fi

          if [ -z "$PYSTRING_LIBRARY" ]; then
            echo "ERROR: libpystring.a was not installed"
            find "$PREFIX/lib" -maxdepth 1 -type f -print | sort
            exit 1
          fi

          PYSTRING_INCLUDE_DIR="$(dirname "$PYSTRING_HEADER")"

          echo "pystring header: $PYSTRING_HEADER"
          echo "pystring include directory: $PYSTRING_INCLUDE_DIR"
          echo "pystring library: $PYSTRING_LIBRARY"

          echo "PYSTRING_INCLUDE_DIR=$PYSTRING_INCLUDE_DIR" \
            >> "$GITHUB_ENV"

          echo "PYSTRING_LIBRARY=$PYSTRING_LIBRARY" \
            >> "$GITHUB_ENV"

      - name: Verify pystring installation
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$PYSTRING_INCLUDE_DIR/pystring.h"
          test -f "$PYSTRING_LIBRARY"

          echo "pystring header and static library are installed."
          echo "Include directory: $PYSTRING_INCLUDE_DIR"
          echo "Library: $PYSTRING_LIBRARY"

          ar t "$PYSTRING_LIBRARY" | sed -n '1,10p'

      - name: Build OpenColorIO
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/opencolorio" \
            -B "$BUILD/opencolorio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DOCIO_INSTALL_EXT_PACKAGES=MISSING \
            -DOCIO_BUILD_APPS=OFF \
            -DOCIO_BUILD_OPENFX=OFF \
            -DOCIO_BUILD_NUKE=OFF \
            -DOCIO_BUILD_TESTS=OFF \
            -DOCIO_BUILD_GPU_TESTS=OFF \
            -DOCIO_BUILD_DOCS=OFF \
            -DOCIO_BUILD_PYTHON=OFF \
            -DOCIO_BUILD_JAVA=OFF \
            -DOCIO_USE_OIIO_FOR_APPS=OFF \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -Dpystring_ROOT="$PREFIX" \
            -Dpystring_INCLUDE_DIR="$PYSTRING_INCLUDE_DIR" \
            -Dpystring_LIBRARY="$PYSTRING_LIBRARY" \
            2>&1 | tee "$LOGS/opencolorio-configure.log"

          echo
          echo "========== OpenColorIO pystring configuration =========="

          grep -i pystring "$BUILD/opencolorio/CMakeCache.txt" || true

          cmake --build "$BUILD/opencolorio" \
            --target install \
            --parallel 2 \
            2>&1 | tee "$LOGS/opencolorio-build.log"

      - name: Collect OpenColorIO bundled dependencies
        shell: bash
        run: |
          set -euxo pipefail

          # Preserve the explicitly installed pystring 1.1.4 in PREFIX.
          # OCIO_INSTALL_EXT_PACKAGES=MISSING should use that installation
          # instead of rebuilding pystring inside ext/dist.
          if [ -d "$BUILD/opencolorio/ext/dist" ]; then
            cp -a \
              "$BUILD/opencolorio/ext/dist/." \
              "$PREFIX/"
          fi

          # Verify that collection did not leave pystring absent.
          test -f "$PYSTRING_INCLUDE_DIR/pystring.h"
          test -f "$PYSTRING_LIBRARY"

          echo
          echo "OpenColorIO external dependency files:"

          if [ -d "$BUILD/opencolorio/ext/dist" ]; then
            find "$BUILD/opencolorio/ext/dist" \
              -maxdepth 4 \
              -type f \
              -print \
              | sort
          else
            echo "No OCIO ext/dist directory."
          fi

          echo
          echo "Confirmed pystring installation:"
          echo "$PYSTRING_INCLUDE_DIR/pystring.h"
          echo "$PYSTRING_LIBRARY"

      - name: Configure OpenImageIO
        shell: bash
        run: |
          set -euxo pipefail

          # Check pystring before the OIIO configure step.
          test -f "$PYSTRING_INCLUDE_DIR/pystring.h"
          test -f "$PYSTRING_LIBRARY"

          cmake \
            -S "$SRC/OpenImageIO" \
            -B "$BUILD/oiio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=11 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLINKSTATIC=ON \
            -DOpenImageIO_BUILD_MISSING_DEPS=OFF \
            -DOIIO_BUILD_TESTS=OFF \
            -DOIIO_BUILD_TOOLS=OFF \
            -DUSE_PYTHON=OFF \
            -DUSE_QT=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_TBB=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_OPENCV=OFF \
            -DUSE_OPENVDB=OFF \
            -DUSE_LIBRAW=OFF \
            -DUSE_WEBP=OFF \
            -DUSE_JXL=OFF \
            -DUSE_LIBHEIF=OFF \
            -DUSE_OPENJPEG=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_EXTERNAL_PUGIXML=OFF \
            -DOIIO_USE_COMPILED_FMT=OFF \
            -DOIIO_INTERNALIZE_FMT=ON \
            -DZLIB_ROOT="$PREFIX" \
            -DPNG_ROOT="$PREFIX" \
            -DTIFF_ROOT="$PREFIX" \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX" \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -DOpenEXR_DIR="$PREFIX/lib/cmake/OpenEXR" \
            -DOpenColorIO_DIR="$PREFIX/lib/cmake/OpenColorIO" \
            -Dfmt_DIR="$PREFIX/lib/cmake/fmt" \
            -Dpystring_ROOT="$PREFIX" \
            -Dpystring_INCLUDE_DIR="$PYSTRING_INCLUDE_DIR" \
            -Dpystring_LIBRARY="$PYSTRING_LIBRARY" \
            2>&1 | tee "$LOGS/oiio-configure.log"

      - name: Verify OpenImageIO configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Selected OIIO options =========="

          grep -E \
            '^(USE_EXTERNAL_PUGIXML|OIIO_USE_COMPILED_FMT|OIIO_INTERNALIZE_FMT|OIIO_BUILD_TESTS|OIIO_BUILD_TOOLS|OpenImageIO_BUILD_MISSING_DEPS):' \
            "$BUILD/oiio/CMakeCache.txt" || true

      - name: Build OpenImageIO
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "$BUILD/oiio" \
            --target install \
            --parallel 2 \
            2>&1 | tee "$LOGS/oiio-build.log"

      - name: Verify Android ARM64 libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " Android ARM64 OIIO dependency verification"
          echo "=========================================="

          echo
          echo "Installed libraries:"

          find "$PREFIX/lib" \
            -maxdepth 1 \
            -type f \
            \( -name '*.a' -o -name '*.so' \) \
            -print \
            | sort

          find_static() {
            local pattern="$1"
            local result

            result="$(
              find "$PREFIX/lib" \
                -maxdepth 1 \
                -type f \
                -name "$pattern" \
                -print \
                -quit
            )"

            if [ -z "$result" ]; then
              echo
              echo "ERROR: Missing library matching: $pattern"
              echo
              echo "Available static libraries:"

              find "$PREFIX/lib" \
                -maxdepth 1 \
                -type f \
                -name '*.a' \
                -print \
                | sort

              exit 1
            fi

            printf '%s\n' "$result"
          }

          check_archive() {
            local archive="$1"
            local name="$2"
            local tmp
            local obj

            echo
            echo "=========================================="
            echo " Checking $name"
            echo " Archive: $archive"
            echo "=========================================="

            test -f "$archive"

            tmp="$(mktemp -d)"

            (
              cd "$tmp"
              ar x "$archive"
            )

            # Do not use find | head with pipefail:
            # head can close the pipe early and trigger SIGPIPE.
            obj="$(
              find "$tmp" \
                -type f \
                -name '*.o' \
                -print \
                -quit
            )"

            if [ -z "$obj" ]; then
              echo "ERROR: No object files found inside:"
              echo "$archive"
              rm -rf "$tmp"
              exit 1
            fi

            echo
            echo "Object selected:"
            echo "$obj"

            echo
            echo "ELF header:"

            readelf -h "$obj"

            readelf -h "$obj" |
              grep -q 'Class:.*ELF64'

            readelf -h "$obj" |
              grep -q 'Machine:.*AArch64'

            echo
            echo "PASS: $name is ELF64 AArch64"

            rm -rf "$tmp"
          }

          IMATH_LIB="$(find_static 'libImath*.a')"
          OPENEXR_LIB="$(find_static 'libOpenEXR*.a')"
          OCIO_LIB="$(find_static 'libOpenColorIO*.a')"
          OIIO_LIB="$(find_static 'libOpenImageIO*.a')"
          PYSTRING_LIB="$(find_static 'libpystring.a')"

          echo
          echo "Detected libraries:"
          echo "  Imath       = $IMATH_LIB"
          echo "  OpenEXR     = $OPENEXR_LIB"
          echo "  OpenColorIO = $OCIO_LIB"
          echo "  OpenImageIO = $OIIO_LIB"
          echo "  pystring    = $PYSTRING_LIB"

          check_archive \
            "$IMATH_LIB" \
            "Imath"

          check_archive \
            "$OPENEXR_LIB" \
            "OpenEXR"

          check_archive \
            "$OCIO_LIB" \
            "OpenColorIO"

          check_archive \
            "$OIIO_LIB" \
            "OpenImageIO"

          check_archive \
            "$PYSTRING_LIB" \
            "pystring"

          echo
          echo "=========================================="
          echo " ARM64 verification PASSED"
          echo "=========================================="

      - name: Verify all important dependency libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "========== Important Android libraries =========="

          required_patterns=(
            'libImath*.a'
            'libOpenEXR*.a'
            'libOpenEXRCore*.a'
            'libOpenEXRUtil*.a'
            'libOpenColorIO*.a'
            'libOpenImageIO*.a'
            'libOpenImageIO_Util*.a'
            'libfmt*.a'
            'libjpeg*.a'
            'libpng*.a'
            'libtiff*.a'
            'libz*.a'
            'libpystring.a'
          )

          for pattern in "${required_patterns[@]}"; do
            result="$(
              find "$PREFIX/lib" \
                -maxdepth 1 \
                -type f \
                -name "$pattern" \
                -print \
                -quit
            )"

            if [ -z "$result" ]; then
              echo "ERROR: Missing $pattern"
              exit 1
            fi

            echo "FOUND: $result"
          done

          test -f "$PYSTRING_INCLUDE_DIR/pystring.h"

          echo
          echo "pystring header: $PYSTRING_INCLUDE_DIR/pystring.h"
          echo "All important dependency libraries are present."

      - name: Show final prefix
        shell: bash
        run: |
          set -eux

          echo "========== FINAL PREFIX =========="

          find "$PREFIX" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

      - name: Package Android OIIO prefix
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$PREFIX" \
            -czf \
            "$GITHUB_WORKSPACE/android-oiio/package/android-arm64-oiio-prefix.tar.gz" \
            .

      - name: Upload OIIO package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-oiio
          path: android-oiio/package/android-arm64-oiio-prefix.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-oiio-logs
          path: android-oiio/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
