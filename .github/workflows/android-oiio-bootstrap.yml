name: Android ARM64 - OpenImageIO Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-oiio-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"
  OIIO_VERSION: "v3.1.13.1"
  IMATH_VERSION: "v3.2.2"
  OPENEXR_VERSION: "v3.4.10"
  OPENCOLORIO_VERSION: "v2.5.0"
  FMT_VERSION: "12.1.0"
  ROBINMAP_VERSION: "v1.3.0"
  PYSTRING_VERSION: "v1.1.4"
  ZLIB_VERSION: "v1.3.1"
  PNG_VERSION: "v1.6.50"
  JPEG_VERSION: "3.1.0"
  TIFF_VERSION: "v4.7.1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-oiio:
    name: Build Android ARM64 image dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # FIX: Do not request the obsolete SDK package named "tools".
      - name: Install Android SDK tools and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            zip

          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

          test -x "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          cmake --version
          ninja --version

      - name: Prepare build folders and shared CMake helper
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/android-oiio"
          SRC="$ROOT/src"
          BUILD="$ROOT/build"
          PREFIX="$ROOT/prefix"
          LOGS="$ROOT/logs"
          TOOLCHAIN="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          mkdir -p "$SRC" "$BUILD" "$PREFIX" "$LOGS"
          test -f "$TOOLCHAIN"

          {
            echo "OIIO_ROOT=$ROOT"
            echo "OIIO_SRC=$SRC"
            echo "OIIO_BUILD=$BUILD"
            echo "OIIO_PREFIX=$PREFIX"
            echo "OIIO_LOGS=$LOGS"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "ANDROID_TOOLCHAIN_FILE=$TOOLCHAIN"
          } >> "$GITHUB_ENV"

          cat > "$ROOT/common.sh" <<'BASH'
          set -Eeuo pipefail

          COMMON_CMAKE_ARGS=(
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_TOOLCHAIN_FILE"
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM="android-${ANDROID_API}"
            -DANDROID_STL=c++_static
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX="$OIIO_PREFIX"
            -DCMAKE_INSTALL_LIBDIR=lib
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DCMAKE_PREFIX_PATH="$OIIO_PREFIX"
            -DCMAKE_FIND_ROOT_PATH="$OIIO_PREFIX"
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY
          )

          run_cmake_project() {
            local name="$1"
            local source="$2"
            shift 2
            local build_dir="$OIIO_BUILD/$name"

            test -d "$source"
            rm -rf "$build_dir"

            cmake -S "$source" -B "$build_dir" -G Ninja \
              "${COMMON_CMAKE_ARGS[@]}" \
              -DBUILD_SHARED_LIBS=OFF \
              "$@" \
              2>&1 | tee "$OIIO_LOGS/${name}-configure.log"

            cmake --build "$build_dir" --parallel 2 \
              2>&1 | tee "$OIIO_LOGS/${name}-build.log"

            cmake --install "$build_dir" \
              2>&1 | tee "$OIIO_LOGS/${name}-install.log"
          }
          BASH

      - name: Download pinned dependency sources
        shell: bash
        run: |
          set -euxo pipefail

          clone_tag() {
            local url="$1"
            local tag="$2"
            local dest="$3"

            if [ -d "$dest/.git" ]; then
              git -C "$dest" fetch --depth 1 origin "$tag"
              git -C "$dest" checkout --detach FETCH_HEAD
            else
              git clone --depth 1 --branch "$tag" "$url" "$dest"
            fi
          }

          clone_tag https://github.com/madler/zlib.git \
            "$ZLIB_VERSION" "$OIIO_SRC/zlib"

          clone_tag https://github.com/AcademySoftwareFoundation/Imath.git \
            "$IMATH_VERSION" "$OIIO_SRC/imath"

          clone_tag https://github.com/AcademySoftwareFoundation/openexr.git \
            "$OPENEXR_VERSION" "$OIIO_SRC/openexr"

          clone_tag https://github.com/AcademySoftwareFoundation/OpenColorIO.git \
            "$OPENCOLORIO_VERSION" "$OIIO_SRC/opencolorio"

          clone_tag https://github.com/AcademySoftwareFoundation/OpenImageIO.git \
            "$OIIO_VERSION" "$OIIO_SRC/OpenImageIO"

          clone_tag https://github.com/fmtlib/fmt.git \
            "$FMT_VERSION" "$OIIO_SRC/fmt"

          clone_tag https://github.com/Tessil/robin-map.git \
            "$ROBINMAP_VERSION" "$OIIO_SRC/robin-map"

          clone_tag https://github.com/imageworks/pystring.git \
            "$PYSTRING_VERSION" "$OIIO_SRC/pystring"

          clone_tag https://github.com/pnggroup/libpng.git \
            "$PNG_VERSION" "$OIIO_SRC/libpng"

          clone_tag https://github.com/libjpeg-turbo/libjpeg-turbo.git \
            "$JPEG_VERSION" "$OIIO_SRC/libjpeg-turbo"

          clone_tag https://gitlab.com/libtiff/libtiff.git \
            "$TIFF_VERSION" "$OIIO_SRC/libtiff"

          printf 'OIIO=%s\nIMATH=%s\nOPENEXR=%s\nOCIO=%s\nFMT=%s\nROBINMAP=%s\nPYSTRING=%s\nZLIB=%s\nPNG=%s\nJPEG=%s\nTIFF=%s\n' \
            "$OIIO_VERSION" \
            "$IMATH_VERSION" \
            "$OPENEXR_VERSION" \
            "$OPENCOLORIO_VERSION" \
            "$FMT_VERSION" \
            "$ROBINMAP_VERSION" \
            "$PYSTRING_VERSION" \
            "$ZLIB_VERSION" \
            "$PNG_VERSION" \
            "$JPEG_VERSION" \
            "$TIFF_VERSION" \
            | tee "$OIIO_LOGS/source-versions.txt"

      - name: Build Android zlib, Imath, fmt, robin-map, and pystring
        shell: bash
        run: |
          set -euxo pipefail
          source "$OIIO_ROOT/common.sh"

          run_cmake_project zlib "$OIIO_SRC/zlib" \
            -DZLIB_BUILD_EXAMPLES=OFF

          run_cmake_project imath "$OIIO_SRC/imath" \
            -DBUILD_TESTING=OFF \
            -DIMATH_BUILD_TESTS=OFF \
            -DIMATH_INSTALL_PKG_CONFIG=OFF

          run_cmake_project fmt "$OIIO_SRC/fmt" \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF \
            -DFMT_INSTALL=ON

          # robin-map is header-only.
          test -f "$OIIO_SRC/robin-map/include/tsl/robin_map.h"
          mkdir -p "$OIIO_PREFIX/include/tsl"
          cp -a "$OIIO_SRC/robin-map/include/tsl/." \
            "$OIIO_PREFIX/include/tsl/"

          # Fix pystring: build a static PIC library and install its header.
          test -f "$OIIO_SRC/pystring/pystring.cpp"
          test -f "$OIIO_SRC/pystring/pystring.h"

          cat > "$OIIO_SRC/pystring/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.10)
          project(pystring LANGUAGES CXX)

          add_library(pystring STATIC pystring.cpp)

          set_target_properties(pystring PROPERTIES
            POSITION_INDEPENDENT_CODE ON
            PUBLIC_HEADER pystring.h
          )

          install(TARGETS pystring
            ARCHIVE DESTINATION lib
            PUBLIC_HEADER DESTINATION include
          )
          CMAKE

          run_cmake_project pystring "$OIIO_SRC/pystring"

          test -s "$OIIO_PREFIX/include/pystring.h"
          test -s "$OIIO_PREFIX/lib/libpystring.a"

          ar t "$OIIO_PREFIX/lib/libpystring.a" \
            | tee "$OIIO_LOGS/pystring-archive-members.txt"

          {
            echo "PYSTRING_INCLUDE_DIR=$OIIO_PREFIX/include"
            echo "PYSTRING_LIBRARY=$OIIO_PREFIX/lib/libpystring.a"
          } >> "$GITHUB_ENV"

      - name: Build Android JPEG, PNG, TIFF, and OpenEXR
        shell: bash
        run: |
          set -euxo pipefail
          source "$OIIO_ROOT/common.sh"

          run_cmake_project libjpeg-turbo "$OIIO_SRC/libjpeg-turbo" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF

          run_cmake_project libpng "$OIIO_SRC/libpng" \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF \
            -DZLIB_ROOT="$OIIO_PREFIX" \
            -DZLIB_LIBRARY="$OIIO_PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$OIIO_PREFIX/include"

          test -s "$OIIO_PREFIX/lib/libpng16.a"
          ln -sf libpng16.a "$OIIO_PREFIX/lib/libpng.a"

          if [ ! -f "$OIIO_PREFIX/include/png.h" ]; then
            cp "$OIIO_SRC/libpng/png.h" \
              "$OIIO_SRC/libpng/pngconf.h" \
              "$OIIO_PREFIX/include/"
          fi

          if [ ! -f "$OIIO_PREFIX/include/pnglibconf.h" ]; then
            test -f "$OIIO_BUILD/libpng/pnglibconf.h"
            cp "$OIIO_BUILD/libpng/pnglibconf.h" \
              "$OIIO_PREFIX/include/pnglibconf.h"
          fi

          run_cmake_project libtiff "$OIIO_SRC/libtiff" \
            -DBUILD_TESTING=OFF \
            -Dtiff-tools=OFF \
            -Dtiff-tests=OFF \
            -Dtiff-contrib=OFF \
            -Dtiff-docs=OFF \
            -Dzstd=OFF \
            -Dwebp=OFF \
            -Dlzma=OFF \
            -Dlibdeflate=OFF \
            -Djpeg=ON \
            -Dpng=ON \
            -Dzlib=ON \
            -DJPEG_LIBRARY="$OIIO_PREFIX/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DPNG_LIBRARY="$OIIO_PREFIX/lib/libpng.a" \
            -DPNG_PNG_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DZLIB_LIBRARY="$OIIO_PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$OIIO_PREFIX/include"

          run_cmake_project openexr "$OIIO_SRC/openexr" \
            -DBUILD_TESTING=OFF \
            -DOPENEXR_BUILD_TOOLS=OFF \
            -DOPENEXR_BUILD_EXAMPLES=OFF \
            -DOPENEXR_BUILD_TESTS=OFF \
            -DOPENEXR_INSTALL=ON \
            -DImath_DIR="$OIIO_PREFIX/lib/cmake/Imath" \
            -DZLIB_LIBRARY="$OIIO_PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$OIIO_PREFIX/include"

      - name: Build Android OpenColorIO
        shell: bash
        run: |
          set -euxo pipefail
          source "$OIIO_ROOT/common.sh"

          run_cmake_project opencolorio "$OIIO_SRC/opencolorio" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOCIO_BUILD_APPS=OFF \
            -DOCIO_BUILD_TESTS=OFF \
            -DOCIO_BUILD_DOCS=OFF \
            -DOCIO_BUILD_PYTHON=OFF \
            -DOCIO_BUILD_GPU_TESTS=OFF \
            -DOCIO_BUILD_NUKE=OFF \
            -DOCIO_BUILD_JAVA=OFF \
            -DOCIO_INSTALL_EXT_PACKAGES=MISSING \
            -DImath_DIR="$OIIO_PREFIX/lib/cmake/Imath" \
            -Dpystring_ROOT="$OIIO_PREFIX" \
            -Dpystring_INCLUDE_DIR="$PYSTRING_INCLUDE_DIR" \
            -Dpystring_LIBRARY="$PYSTRING_LIBRARY"

          if [ -d "$OIIO_BUILD/opencolorio/ext/dist" ]; then
            cp -a "$OIIO_BUILD/opencolorio/ext/dist/." "$OIIO_PREFIX/"
          fi

          test -s "$OIIO_PREFIX/include/pystring.h"
          test -s "$OIIO_PREFIX/lib/libpystring.a"
          test -f "$OIIO_PREFIX/lib/cmake/OpenColorIO/OpenColorIOConfig.cmake"

      - name: Configure and build Android OpenImageIO
        shell: bash
        run: |
          set -euxo pipefail
          source "$OIIO_ROOT/common.sh"
          rm -rf "$OIIO_BUILD/OpenImageIO"

          cmake -S "$OIIO_SRC/OpenImageIO" -B "$OIIO_BUILD/OpenImageIO" -G Ninja \
            "${COMMON_CMAKE_ARGS[@]}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DOIIO_BUILD_TESTS=OFF \
            -DOIIO_BUILD_TOOLS=OFF \
            -DOIIO_BUILD_DOCS=OFF \
            -DUSE_PYTHON=OFF \
            -DUSE_TBB=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_OPENCV=OFF \
            -DUSE_OPENVDB=OFF \
            -DUSE_QT=OFF \
            -DUSE_OPENJPEG=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_GIF=OFF \
            -DUSE_WEBP=OFF \
            -DUSE_HEIF=OFF \
            -DUSE_JXL=OFF \
            -DUSE_NUKE=OFF \
            -DUSE_PTEX=OFF \
            -DUSE_OPENEXR=ON \
            -DUSE_OCIO=ON \
            -DUSE_TIFF=ON \
            -DUSE_PNG=ON \
            -DUSE_JPEG=ON \
            -DImath_DIR="$OIIO_PREFIX/lib/cmake/Imath" \
            -DOpenEXR_DIR="$OIIO_PREFIX/lib/cmake/OpenEXR" \
            -DOpenColorIO_DIR="$OIIO_PREFIX/lib/cmake/OpenColorIO" \
            -DOpenColorIO_ROOT="$OIIO_PREFIX" \
            -Dfmt_ROOT="$OIIO_PREFIX" \
            -Dfmt_DIR="$OIIO_PREFIX/lib/cmake/fmt" \
            -Drobinmap_ROOT="$OIIO_PREFIX" \
            -Dpystring_ROOT="$OIIO_PREFIX" \
            -Dpystring_INCLUDE_DIR="$PYSTRING_INCLUDE_DIR" \
            -Dpystring_LIBRARY="$PYSTRING_LIBRARY" \
            -DJPEG_LIBRARY="$OIIO_PREFIX/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DPNG_LIBRARY="$OIIO_PREFIX/lib/libpng.a" \
            -DPNG_PNG_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DTIFF_LIBRARY="$OIIO_PREFIX/lib/libtiff.a" \
            -DTIFF_INCLUDE_DIR="$OIIO_PREFIX/include" \
            -DZLIB_LIBRARY="$OIIO_PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$OIIO_PREFIX/include" \
            2>&1 | tee "$OIIO_LOGS/OpenImageIO-configure.log"

          cmake --build "$OIIO_BUILD/OpenImageIO" --parallel 2 \
            2>&1 | tee "$OIIO_LOGS/OpenImageIO-build.log"

          cmake --install "$OIIO_BUILD/OpenImageIO" \
            2>&1 | tee "$OIIO_LOGS/OpenImageIO-install.log"

      - name: Verify ARM64 libraries and write manifest
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$OIIO_PREFIX/lib/libpystring.a"
          test -f "$OIIO_PREFIX/include/pystring.h"
          test -f "$OIIO_PREFIX/lib/cmake/OpenColorIO/OpenColorIOConfig.cmake"
          test -f "$OIIO_PREFIX/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake"
          test -s "$OIIO_PREFIX/lib/libz.a"
          test -s "$OIIO_PREFIX/lib/libjpeg.a"
          test -s "$OIIO_PREFIX/lib/libpng16.a"
          test -s "$OIIO_PREFIX/lib/libtiff.a"
          test -s "$OIIO_PREFIX/lib/libOpenImageIO.a"

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/llvm-readelf"

          : > "$OIIO_LOGS/arm64-library-audit.txt"

          find "$OIIO_PREFIX/lib" -maxdepth 1 -type f -name '*.a' -print \
            | sort | while read -r archive; do
              echo "===== $archive =====" \
                | tee -a "$OIIO_LOGS/arm64-library-audit.txt"

              "$NDK_BIN/llvm-ar" t "$archive" >/dev/null
              member="$("$NDK_BIN/llvm-ar" t "$archive" | head -n 1 || true)"

              if [ -n "$member" ]; then
                tmpdir="$(mktemp -d)"

                if (cd "$tmpdir" && "$NDK_BIN/llvm-ar" x "$archive" "$member" >/dev/null 2>&1); then
                  "$NDK_BIN/llvm-readelf" -h "$tmpdir/$member" 2>/dev/null \
                    | grep -E 'Class:|Machine:' \
                    | tee -a "$OIIO_LOGS/arm64-library-audit.txt" || true
                fi

                rm -rf "$tmpdir"
              fi
            done

          {
            echo "OpenImageIO Android ARM64 bootstrap"
            echo "Android API: $ANDROID_API"
            echo "NDK: $ANDROID_NDK_VERSION"
            echo "OpenImageIO: $OIIO_VERSION"
            echo "OpenColorIO: $OPENCOLORIO_VERSION"
            echo "Prefix: $OIIO_PREFIX"
            echo "Built on: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            find "$OIIO_PREFIX" -maxdepth 4 -type f | sort
          } | tee "$OIIO_ROOT/manifest.txt"

      - name: Upload Android ARM64 OpenImageIO dependency bundle and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-oiio
          path: |
            android-oiio/prefix/
            android-oiio/logs/
            android-oiio/manifest.txt
          if-no-files-found: warn
          retention-days: 14
