name: Android ARM64 - OpenImageIO Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "29"
  ANDROID_NDK_VERSION: "27.3.13750724"

  # Blender 5.2.2 dependency set
  OIIO_VERSION: "v3.1.13.1"
  IMATH_VERSION: "v3.2.2"
  OPENEXR_VERSION: "v3.4.10"
  OPENCOLORIO_VERSION: "v2.5.0"
  FMT_VERSION: "12.1.0"
  ROBINMAP_VERSION: "v1.3.0"

  ZLIB_VERSION: "v1.3.1"
  PNG_VERSION: "v1.6.50"
  JPEG_VERSION: "3.1.0"
  TIFF_VERSION: "v4.7.1"

  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-oiio:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            curl \
            unzip \
            xz-utils \
            file \
            binutils \
            pkg-config

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Prepare directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf android-oiio

          mkdir -p \
            android-oiio/src \
            android-oiio/build \
            android-oiio/prefix \
            android-oiio/logs \
            android-oiio/package

          echo "SRC=$GITHUB_WORKSPACE/android-oiio/src" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_WORKSPACE/android-oiio/build" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/android-oiio/prefix" >> "$GITHUB_ENV"
          echo "LOGS=$GITHUB_WORKSPACE/android-oiio/logs" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"

      - name: Download dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SRC"

          git clone --depth 1 --branch "$IMATH_VERSION" \
            https://github.com/AcademySoftwareFoundation/Imath.git \
            imath

          git clone --depth 1 --branch "$OPENEXR_VERSION" \
            https://github.com/AcademySoftwareFoundation/openexr.git \
            openexr

          git clone --depth 1 --branch "$OIIO_VERSION" \
            https://github.com/AcademySoftwareFoundation/OpenImageIO.git \
            OpenImageIO

          git clone --depth 1 --branch "$OPENCOLORIO_VERSION" \
            https://github.com/AcademySoftwareFoundation/OpenColorIO.git \
            opencolorio

          git clone --depth 1 --branch "$FMT_VERSION" \
            https://github.com/fmtlib/fmt.git \
            fmt

          git clone --depth 1 --branch "$ROBINMAP_VERSION" \
            https://github.com/Tessil/robin-map.git \
            robinmap

          git clone --depth 1 --branch "$ZLIB_VERSION" \
            https://github.com/madler/zlib.git \
            zlib

          git clone --depth 1 --branch "$PNG_VERSION" \
            https://github.com/pnggroup/libpng.git \
            png

          git clone --depth 1 --branch "$JPEG_VERSION" \
            https://github.com/libjpeg-turbo/libjpeg-turbo.git \
            jpeg

          git clone --depth 1 --branch "$TIFF_VERSION" \
            https://gitlab.com/libtiff/libtiff.git \
            tiff

      - name: Show revisions
        shell: bash
        run: |
          set -eux

          cd "$SRC"

          for d in \
            imath \
            openexr \
            OpenImageIO \
            opencolorio \
            fmt \
            robinmap \
            zlib \
            png \
            jpeg \
            tiff
          do
            echo
            echo "===== $d ====="
            git -C "$d" rev-parse HEAD
            git -C "$d" describe --tags --always || true
          done

      - name: Build zlib
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/zlib" \
            -B "$BUILD/zlib" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DZLIB_BUILD_TESTING=OFF \
            2>&1 | tee "$LOGS/zlib-configure.log"

          cmake --build "$BUILD/zlib" \
            --target install \
            2>&1 | tee "$LOGS/zlib-build.log"

      - name: Build libpng
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/png" \
            -B "$BUILD/png" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF \
            -DPNG_TOOLS=OFF \
            2>&1 | tee "$LOGS/png-configure.log"

          cmake --build "$BUILD/png" \
            --target install \
            2>&1 | tee "$LOGS/png-build.log"

      - name: Build libjpeg-turbo
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/jpeg" \
            -B "$BUILD/jpeg" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TEST=OFF \
            2>&1 | tee "$LOGS/jpeg-configure.log"

          cmake --build "$BUILD/jpeg" \
            --target install \
            2>&1 | tee "$LOGS/jpeg-build.log"

      - name: Build libtiff
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/tiff" \
            -B "$BUILD/tiff" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Dtiff-tools=OFF \
            -Dtiff-tests=OFF \
            -Dtiff-contrib=OFF \
            -Djbig=OFF \
            -Djpeg=ON \
            -Dwebp=OFF \
            -Dzstd=OFF \
            -Dlzma=OFF \
            -DLERC=OFF \
            2>&1 | tee "$LOGS/tiff-configure.log"

          cmake --build "$BUILD/tiff" \
            --target install \
            2>&1 | tee "$LOGS/tiff-build.log"

      - name: Build Imath
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/imath" \
            -B "$BUILD/imath" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIMATH_BUILD_TESTS=OFF \
            -DIMATH_INSTALL_PKG_CONFIG=OFF \
            2>&1 | tee "$LOGS/imath-configure.log"

          cmake --build "$BUILD/imath" \
            --target install \
            2>&1 | tee "$LOGS/imath-build.log"

      - name: Build OpenEXR
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/openexr" \
            -B "$BUILD/openexr" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPENEXR_BUILD_TESTS=OFF \
            -DOPENEXR_BUILD_TOOLS=OFF \
            -DOPENEXR_BUILD_EXAMPLES=OFF \
            -DOPENEXR_BUILD_PYTHON=OFF \
            -DOPENEXR_FORCE_INTERNAL_OPENJPH=ON \
            -DOPENEXR_FORCE_INTERNAL_DEFLATE=ON \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            2>&1 | tee "$LOGS/openexr-configure.log"

          cmake --build "$BUILD/openexr" \
            --target install \
            2>&1 | tee "$LOGS/openexr-build.log"

      - name: Build fmt
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/fmt" \
            -B "$BUILD/fmt" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF \
            2>&1 | tee "$LOGS/fmt-configure.log"

          cmake --build "$BUILD/fmt" \
            --target install \
            2>&1 | tee "$LOGS/fmt-build.log"

      - name: Install Robin-map headers
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PREFIX/include/tsl"

          cp "$SRC/robinmap/include/tsl/robin_map.h" \
            "$PREFIX/include/tsl/"

          cp "$SRC/robinmap/include/tsl/robin_set.h" \
            "$PREFIX/include/tsl/"

      - name: Build OpenColorIO
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/opencolorio" \
            -B "$BUILD/opencolorio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DOCIO_INSTALL_EXT_PACKAGES=MISSING \
            -DOCIO_BUILD_APPS=OFF \
            -DOCIO_BUILD_PYTHON=OFF \
            -DOCIO_BUILD_TESTS=OFF \
            -DOCIO_BUILD_GPU_TESTS=OFF \
            -DOCIO_BUILD_DOCS=OFF \
            -DOCIO_BUILD_OPENFX=OFF \
            -DOCIO_USE_OPENGL=OFF \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DZLIB_ROOT="$PREFIX" \
            2>&1 | tee "$LOGS/opencolorio-configure.log"

          cmake --build "$BUILD/opencolorio" \
            --target install \
            2>&1 | tee "$LOGS/opencolorio-build.log"

          # OCIO keeps automatically-built dependency libraries under ext/dist.
          # Copy them into our final Android prefix so later Blender linking
          # does not depend on the temporary OCIO build directory.
          if [ -d "$BUILD/opencolorio/ext/dist" ]; then
            cp -a "$BUILD/opencolorio/ext/dist/." "$PREFIX/"
          fi

      - name: Configure OpenImageIO
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$SRC/OpenImageIO" \
            -B "$BUILD/oiio" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=11 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PREFIX;$BUILD/opencolorio/ext/dist" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLINKSTATIC=ON \
            -DOpenImageIO_BUILD_MISSING_DEPS=OFF \
            -DEMBEDPLUGINS=ON \
            -DOIIO_BUILD_TOOLS=OFF \
            -DOIIO_BUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DINSTALL_DOCS=OFF \
            -DINSTALL_FONTS=OFF \
            -DUSE_PYTHON=OFF \
            -DUSE_QT=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_TBB=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_OPENCV=OFF \
            -DUSE_OPENVDB=OFF \
            -DUSE_LIBRAW=OFF \
            -DUSE_WEBP=OFF \
            -DUSE_JXL=OFF \
            -DUSE_LIBHEIF=OFF \
            -DUSE_OPENJPEG=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_EXTERNAL_PUGIXML=OFF \
            -DOIIO_USE_COMPILED_FMT=OFF \
            -DImath_DIR="$PREFIX/lib/cmake/Imath" \
            -DOpenEXR_DIR="$PREFIX/lib/cmake/OpenEXR" \
            -DOpenColorIO_DIR="$PREFIX/lib/cmake/OpenColorIO" \
            -Dfmt_DIR="$PREFIX/lib/cmake/fmt" \
            2>&1 | tee "$LOGS/oiio-configure.log"

      - name: Build OpenImageIO
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "$BUILD/oiio" \
            --target install \
            2>&1 | tee "$LOGS/oiio-build.log"

      - name: Verify installed libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " Verifying Android ARM64 OIIO stack"
          echo "=========================================="

          required=(
            "$PREFIX/lib/libImath.a"
            "$PREFIX/lib/libOpenEXR.a"
            "$PREFIX/lib/libOpenColorIO.a"
            "$PREFIX/lib/libOpenImageIO.a"
          )

          for f in "${required[@]}"; do
            test -f "$f"
            echo "FOUND: $f"
          done

          check_archive() {
            local archive="$1"
            local name="$2"
            local dir
            local obj

            dir="$(mktemp -d)"

            (
              cd "$dir"
              ar x "$archive"
            )

            obj="$(find "$dir" -type f -name '*.o' | head -n 1)"

            test -n "$obj"

            echo
            echo "----- $name -----"
            readelf -h "$obj" | grep -E \
              "Class:.*ELF64|Machine:.*AArch64"

            rm -rf "$dir"
          }

          check_archive "$PREFIX/lib/libImath.a" "Imath"
          check_archive "$PREFIX/lib/libOpenEXR.a" "OpenEXR"
          check_archive "$PREFIX/lib/libOpenColorIO.a" "OpenColorIO"
          check_archive "$PREFIX/lib/libOpenImageIO.a" "OpenImageIO"

          echo
          echo "Installed prefix:"
          find "$PREFIX" -maxdepth 4 -type f | sort | head -n 500

      - name: Package Android OIIO prefix
        shell: bash
        run: |
          set -euxo pipefail

          tar \
            -C "$PREFIX" \
            -czf "$GITHUB_WORKSPACE/android-oiio/package/android-arm64-oiio-prefix.tar.gz" \
            .

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-oiio
          path: android-oiio/package/android-arm64-oiio-prefix.tar.gz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-oiio-logs
          path: android-oiio/logs
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          overwrite: true
